<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#09090B">
<title>Sonics Inbox</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090B;--card:#141416;--card2:#17171A;--line:rgba(242,239,230,.09);
 --line2:rgba(242,239,230,.18);--ink:#F2EFE6;--muted:#B4B0A7;--dim:#7C786F;
 --sky:#3FC5EC;--green:#16E37F;--gold:#FFC63D;--red:#FF5D5D;
 --disp:'Archivo',Arial,sans-serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15.5px;line-height:1.6;
 -webkit-font-smoothing:antialiased;padding-bottom:70px}
.wrap{max-width:1180px;margin:0 auto;padding:0 20px}
header{padding:38px 0 24px;border-bottom:1px solid var(--line);margin-bottom:26px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{width:46px;height:46px;border-radius:50%}
h1{font-family:var(--disp);font-weight:900;letter-spacing:-.035em;font-size:27px;line-height:1.05}
.sub{color:var(--dim);font-size:12.5px;margin-top:4px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
 background:rgba(22,227,127,.1);border:1px solid rgba(22,227,127,.28);color:var(--green);
 font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.btn{border:0;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:13.5px;
 padding:12px 20px;border-radius:11px;background:var(--sky);color:#04202b;transition:.2s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
.btn.g{background:rgba(242,239,230,.06);color:var(--ink);border:1px solid var(--line2)}
.btn[disabled]{opacity:.4;cursor:not-allowed}
.srch{flex:1;min-width:200px;padding:12px 15px;border-radius:11px;background:var(--card);
 border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:14px}
.srch:focus{outline:none;border-color:var(--sky)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-bottom:22px}
.st{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:15px}
.st b{font-family:var(--disp);font-weight:900;font-size:26px;display:block;letter-spacing:-.03em}
.st span{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);
 display:block;margin-top:6px}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:13.5px;white-space:nowrap}
th{background:var(--card2);text-align:left;padding:13px 14px;font-size:10px;font-weight:800;
 letter-spacing:.13em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);
 position:sticky;top:0}
td{padding:13px 14px;border-bottom:1px solid var(--line);color:var(--muted)}
tr:last-child td{border-bottom:none}
tr:hover td{background:rgba(255,255,255,.022)}
td.nm{color:var(--ink);font-weight:700}
td a{color:var(--sky);text-decoration:none}
.chip{display:inline-block;font-size:9.5px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;
 padding:3px 8px;border-radius:5px}
.chip.dup{background:rgba(255,198,61,.14);color:var(--gold)}
.chip.med{background:rgba(255,93,93,.14);color:var(--red)}
.note{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
 border-radius:14px;padding:22px;margin-bottom:20px}
.note.warn{border-color:rgba(255,198,61,.3);background:rgba(255,198,61,.055)}
.note h3{font-family:var(--disp);font-weight:800;font-size:17px;margin-bottom:9px;letter-spacing:-.02em}
.note p{color:var(--muted);font-size:14px;margin-bottom:8px}
.note code{background:rgba(255,255,255,.07);padding:2px 7px;border-radius:5px;font-size:13px;
 font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.empty{text-align:center;padding:60px 20px;color:var(--dim)}
footer{margin-top:34px;color:var(--dim);font-size:12px}
@media(max-width:640px){h1{font-size:22px}.pill{margin-left:0}}
</style></head><body>
<div class="wrap">

<header>
  <div class="top">
    <img src="logo.png" alt="">
    <div>
      <h1>Sonics Inbox</h1>
      <div class="sub">Tryout registrations · South West Sonics</div>
    </div>
    <div class="pill" id="lockpill">Private</div>
  </div>
</header>

<div class="stats" id="stats"></div>

<div class="bar">
  <input class="srch" id="q" placeholder="Search name, parent, school, phone…">
  <button class="btn" id="xls">Download Excel</button>
  <button class="btn g" id="csv">Download CSV</button>
  <button class="btn g" id="rf">Refresh</button>
</div>

<div id="mount"><div class="empty">Loading registrations…</div></div>

<footer id="ft"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const FIELDS=["Player name","Date of birth","Age","Gender","Uniform size","School","Experience",
 "Parent name","Parent mobile","Relationship","Parent email","Emergency contact","Emergency phone",
 "Medical","Ambulance cover","Notes","Consent - medical","Consent - conduct","Consent - photos",
 "How did you hear"];
const SHOW=["Player name","Age","Gender","School","Experience","Parent name","Parent mobile","Parent email","Medical"];
let ROWS=[];
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const syd=iso=>{try{const d=new Date(iso);
  return d.toLocaleString('en-AU',{timeZone:'Australia/Sydney',weekday:'short',day:'numeric',
    month:'short',hour:'numeric',minute:'2-digit'});}catch(e){return iso||"";}};

function dupKeys(rows){
  const seen={},dup=new Set();
  rows.forEach(r=>{const k=((r.data['Player name']||'')+'|'+(r.data['Date of birth']||'')).toLowerCase().trim();
    if(k.length>1){ if(seen[k]) dup.add(r.id); else seen[k]=1; }});
  return dup;
}
function render(){
  const q=($('#q').value||'').toLowerCase().trim();
  const dups=dupKeys(ROWS);
  const list=ROWS.filter(r=>!q||FIELDS.some(f=>String(r.data[f]||'').toLowerCase().includes(q)));
  const withMed=ROWS.filter(r=>{const m=(r.data['Medical']||'').toLowerCase().trim();
    return m && !['none','no','nothing','n/a','na','nil','no medical conditions'].includes(m);}).length;
  $('#stats').innerHTML=`
    <div class="st"><b>${ROWS.length}</b><span>Registrations</span></div>
    <div class="st"><b>${ROWS.length-dups.size}</b><span>Unique players</span></div>
    <div class="st"><b>${withMed}</b><span>Medical notes</span></div>
    <div class="st"><b>${ROWS.length?syd(ROWS[0].at).split(',')[0]:'—'}</b><span>Latest</span></div>`;
  if(!list.length){ $('#mount').innerHTML='<div class="empty">No registrations match.</div>'; return; }
  $('#mount').innerHTML=`<div class="tblwrap"><table><thead><tr>
    <th>Received</th>${SHOW.map(f=>`<th>${esc(f)}</th>`).join('')}</tr></thead><tbody>
    ${list.map(r=>{const d=r.data,m=(d['Medical']||'').trim();
      const flagged=m&&!['none','no','nothing','n/a','na','nil','No Medical conditions'].includes(m.toLowerCase());
      return `<tr>
        <td>${esc(syd(r.at))} ${dups.has(r.id)?'<span class="chip dup">dup</span>':''}</td>
        ${SHOW.map(f=>{let v=d[f]||'';
          if(f==='Player name') return `<td class="nm">${esc(v)}</td>`;
          if(f==='Parent mobile') return `<td><a href="tel:${esc(String(v).replace(/\s/g,''))}">${esc(v)}</a></td>`;
          if(f==='Parent email') return `<td><a href="mailto:${esc(v)}">${esc(v)}</a></td>`;
          if(f==='Medical') return `<td>${flagged?'<span class="chip med">check</span> ':''}${esc(v)}</td>`;
          return `<td>${esc(v)}</td>`;}).join('')}
      </tr>`;}).join('')}
    </tbody></table></div>`;
  $('#ft').textContent=`Showing ${list.length} of ${ROWS.length} · times in Sydney`;
}
function sheetRows(){
  return ROWS.map(r=>{const o={'Received':syd(r.at)};
    FIELDS.forEach(f=>o[f]=r.data[f]||''); return o;});
}
$('#xls').onclick=()=>{
  if(!ROWS.length) return;
  const ws=XLSX.utils.json_to_sheet(sheetRows());
  ws['!cols']=[{wch:22}].concat(FIELDS.map(f=>({wch:Math.min(Math.max(f.length+4,12),40)})));
  ws['!freeze']={xSplit:0,ySplit:1};
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Registrations');
  XLSX.writeFile(wb,`Sonics-registrations-${new Date().toISOString().slice(0,10)}.xlsx`);
};
$('#csv').onclick=()=>{
  if(!ROWS.length) return;
  const ws=XLSX.utils.json_to_sheet(sheetRows());
  const blob=new Blob([XLSX.utils.sheet_to_csv(ws)],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`Sonics-registrations-${new Date().toISOString().slice(0,10)}.csv`; a.click();
};
$('#q').oninput=render;
$('#rf').onclick=load;

async function load(){
  $('#rf').disabled=true;
  try{
    const r=await fetch('/.netlify/functions/registrations',{cache:'no-store'});
    const j=await r.json();
    if(j.ok){
      ROWS=(j.rows||[]).sort((a,b)=>new Date(b.at)-new Date(a.at));
      $('#xls').disabled=!ROWS.length; $('#csv').disabled=!ROWS.length;
      render();
    }else{
      $('#mount').innerHTML=`<div class="note warn">
        <h3>Not connected yet</h3>
        <p>The inbox needs a Netlify access token before it can pull registrations in here.
           Nothing is lost in the meantime — every submission is safely stored on Netlify.</p>
        <p><b style="color:var(--ink)">To switch it on:</b> Netlify → User settings → Applications →
           <b style="color:var(--ink)">New access token</b>, then send it to Aiman. It gets stored as
           <code>NETLIFY_API_TOKEN</code> on this site and never appears on the page.</p>
        <p style="margin-bottom:0">Until then you can read and export them from
           <a href="https://app.netlify.com/projects/sonics-register/forms" style="color:var(--sky)">Netlify → Forms</a>,
           which has its own CSV download.</p></div>`;
      $('#stats').innerHTML=''; $('#xls').disabled=true; $('#csv').disabled=true;
    }
  }catch(e){
    $('#mount').innerHTML='<div class="note warn"><h3>Could not reach the inbox</h3><p>'+esc(e.message)+'</p></div>';
  }
  $('#rf').disabled=false;
}
load();
</script></body></html>
