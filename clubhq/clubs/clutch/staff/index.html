<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0A08">
<title>Clutch HQ</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>

:root{
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --disp:"Big Shoulders Display","IBM Plex Sans",sans-serif;
  color-scheme:dark;
  --bg:#0B0A08; --side:#0F0D0B; --panel:#15130F; --panel-2:#1B1814; --hover:#221E18;
  --line:rgba(255,240,220,.07); --line-2:rgba(255,240,220,.14);
  --ink:#F6F1E9; --ink-2:#BAB1A4; --muted:#857B6F;
  --accent:#FF8A1E; --accent-2:#E36F00; --accent-ink:#1A0C00; --accent-wash:rgba(255,138,30,.12); --accent-line:rgba(255,138,30,.38);
  --gold:#E8C21C;
  --good:#46C272; --warn:#F2B01E; --crit:#F2584B;
  --good-wash:rgba(70,194,114,.12); --warn-wash:rgba(242,176,30,.12); --crit-wash:rgba(242,88,75,.12);
  --shadow:0 24px 60px -20px rgba(0,0,0,.75);
  --r:10px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F5F2EC; --side:#EEE9E1; --panel:#FFFFFF; --panel-2:#FAF8F4; --hover:#F3EFE8;
  --line:rgba(40,25,10,.08); --line-2:rgba(40,25,10,.16);
  --ink:#17120C; --ink-2:#544A3E; --muted:#85796B;
  --accent:#C35803; --accent-2:#A34700; --accent-ink:#FFFFFF; --accent-wash:rgba(195,88,3,.08); --accent-line:rgba(195,88,3,.35);
  --gold:#A88400;
  --good:#1E8A47; --warn:#A86A00; --crit:#C8372D;
  --good-wash:rgba(30,138,71,.09); --warn-wash:rgba(168,106,0,.09); --crit-wash:rgba(200,55,45,.08);
  --shadow:0 24px 50px -24px rgba(40,25,10,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none}
.brand img{width:44px;height:44px;object-fit:contain;flex:none}
.brand b{display:block;font:800 24px/1 var(--disp);letter-spacing:.01em;text-transform:uppercase}
.brand span{display:block;font:500 11px var(--mono);color:var(--muted);margin-top:3px;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--accent-wash);color:var(--accent)}
.nav a .ct{margin-left:auto;font:600 11px var(--mono);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:1px 7px}
.side .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.demo{font-size:12px;color:var(--muted);line-height:1.4}
.demo b{color:var(--warn);font-weight:600}
.side .row{display:flex;gap:6px}

main{min-width:0;padding:26px 32px 60px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font:800 40px/0.95 var(--disp);letter-spacing:.005em;text-transform:uppercase}
.ph .sub{color:var(--ink-2);font-size:13.5px;margin-top:6px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--crit)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;height:34px;padding:0 12px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--accent-wash);color:var(--accent);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card.flush{padding:0}
.ch{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:12px}
.card.flush .ch{padding:16px 20px 0}
.ch h2{margin:0;font-size:14px;font-weight:600}
.ch .sub{font-size:12.5px;color:var(--muted)}
.ch .right{margin-left:auto;font:500 11.5px var(--mono);color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;text-align:left;cursor:default}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--line-2)}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.hot .v{color:var(--accent)}

/* alerts */
.alerts{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.al:first-child{border-top:0;padding-top:2px}
.al svg{width:16px;height:16px}
.al.crit svg{color:var(--crit)} .al.warn svg{color:var(--warn)} .al.info svg{color:var(--accent)}
.al .t{font-size:13.5px}
.al .t b{font-weight:600}
.al.done{opacity:.65} .al.done svg{color:var(--good)}
.stepn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);background:var(--accent-wash);color:var(--accent);border:1px solid var(--accent-line)}
.al .m{font-size:12px;color:var(--muted);margin-top:1px}

/* week board */
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{min-width:0;display:flex;flex-direction:column;gap:8px}
.dh{padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.dh b{display:block;font:800 20px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.dh span{display:block;font:400 11px var(--mono);color:var(--muted);margin-top:4px}
.day.today .dh{border-color:var(--accent-line);background:var(--accent-wash)}
.day.today .dh b{color:var(--accent)}
.day.past{opacity:.72}
.sess{text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px 10px;cursor:pointer;position:relative;
  border-left:3px solid var(--line-2);display:block}
.sess:hover{border-color:var(--line-2);background:var(--panel-2)}
.sess.G{border-left-color:var(--accent)}
.sess .tm{font:500 11.5px var(--mono);color:var(--ink-2)}
.sess .tn{font-weight:600;font-size:13.5px;margin-top:2px;line-height:1.25}
.sess .sm{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.sess .flag{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font:600 10.5px var(--mono);letter-spacing:.03em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.flag.crit{color:var(--crit);background:var(--crit-wash)} .flag.warn{color:var(--warn);background:var(--warn-wash)} .flag.good{color:var(--good);background:var(--good-wash)}
.avb{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line-2);margin-top:8px;gap:2px}
.avb i{display:block;height:100%}
.avb .in{background:var(--good)} .avb .out{background:var(--crit)}
.empty{color:var(--muted);font-size:12.5px;padding:8px 2px}
.dayempty{font-size:12px;color:var(--muted);padding:6px 10px}
.mg{font:500 11px var(--mono);color:var(--gold);display:flex;align-items:center;gap:5px;margin-top:5px}
.mg svg{width:12px;height:12px}

/* teams */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.team{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px 18px;cursor:pointer;text-align:left;width:100%;display:block}
.team:hover{border-color:var(--line-2);background:var(--panel-2)}
.team .tt{display:flex;align-items:baseline;gap:8px}
.team .tt b{font:800 28px/1 var(--disp);text-transform:uppercase}
.team .tt span{font-size:12.5px;color:var(--muted)}
.team .cm{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.team dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:12px 0 0;font-size:12.5px}
.team dt{color:var(--muted)} .team dd{margin:0;text-align:right}
.meter{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.low i{background:var(--warn)}
.team .flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.team.squad{border-style:dashed}
.team.add{display:grid;place-items:center;min-height:180px;color:var(--ink-2);border-style:dashed}
.team.add svg{width:22px;height:22px;margin:0 auto 6px}

/* tables */
.tw{overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:500 11px var(--mono);letter-spacing:.03em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--panel);position:sticky;top:0;z-index:1}
th.r,td.r{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font:600 11px var(--sans);flex:none;background:var(--accent-wash);color:var(--accent);border:1px solid var(--accent-line)}
.who b{display:block;font-weight:500;line-height:1.2;white-space:nowrap}
.who small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.acc{border-color:var(--accent-line);color:var(--accent);background:var(--accent-wash)}
.chip.crit{border-color:transparent;color:var(--crit);background:var(--crit-wash)}
.chip.warn{border-color:transparent;color:var(--warn);background:var(--warn-wash)}
.chip.good{border-color:transparent;color:var(--good);background:var(--good-wash)}
.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.st svg{width:14px;height:14px}
.st.good svg{color:var(--good)} .st.warn svg{color:var(--warn)} .st.crit svg{color:var(--crit)}
.strip{display:flex;gap:2px}
.strip i{width:7px;height:14px;border-radius:2px;background:var(--line-2)}
.strip i.p{background:var(--accent)} .strip i.a{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fbar select,.fbar input{height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 10px;font-size:13px}
.fbar input{min-width:220px}
.fbar .ct{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col h3{margin:2px 4px 4px;font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between}
.col h3 span{color:var(--muted)}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
.rc b{font-weight:600}
.rc .m{font-size:12px;color:var(--muted);margin-top:2px}
.rc q{display:block;font-size:12.5px;color:var(--ink-2);margin-top:7px;quotes:none;border-left:2px solid var(--line-2);padding-left:8px}
.rc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rc select{height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);font-size:12.5px;padding:0 6px}

/* tasks */
.task{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.task.done .tx{color:var(--muted);text-decoration:line-through}
.task .who2{font:500 11px var(--mono);color:var(--muted)}
.addtask{display:flex;gap:6px;margin-top:10px}
.addtask input{flex:1;height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 10px;min-width:0}
.addtask select{height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 6px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--panel);border-left:1px solid var(--line-2);z-index:41;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.dhd{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dhd h2{margin:0;font:800 30px/1 var(--disp);text-transform:uppercase}
.dhd .sub{color:var(--ink-2);font-size:13px;margin-top:6px}
.dhd .x{margin-left:auto}
.dbd{overflow:auto;padding:16px 22px 40px;flex:1}
.sec{margin-top:20px}
.sec:first-child{margin-top:0}
.sec h3{margin:0 0 10px;font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3 .right{margin-left:auto;text-transform:none;letter-spacing:0}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0}
dl.kv a{color:var(--accent);text-decoration:none}
.plist{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.tog{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.tog button{border:0;background:none;height:30px;min-width:46px;padding:0 10px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.tog button+button{border-left:1px solid var(--line)}
.tog button.on.in{background:var(--good-wash);color:var(--good);font-weight:600}
.tog button.on.out{background:var(--crit-wash);color:var(--crit);font-weight:600}
.tl .ev{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.tl .ev:first-child{border-top:0}
.tl .ev .d{font:400 12px var(--mono);color:var(--muted)}
.msg{white-space:pre-wrap;font:400 12.5px/1.5 var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--ink-2)}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;
  background:var(--panel);border:1px solid var(--line-2);border-radius:14px;z-index:42;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal form{padding:20px 22px 22px}
.modal h2{margin:0 0 4px;font:800 28px/1 var(--disp);text-transform:uppercase}
.modal .sub{color:var(--ink-2);font-size:13px;margin-bottom:16px}
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 6}
.f.h{grid-column:span 3} .f.t{grid-column:span 2}
.f label{font-size:12px;color:var(--ink-2);font-weight:500}
.f input,.f select,.f textarea{height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);padding:0 10px;font-size:13.5px;min-width:0}
.f textarea{height:auto;min-height:74px;padding:9px 10px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--muted)}
.fsec{grid-column:span 6;font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;z-index:60;
  box-shadow:var(--shadow);animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}

.welcome{position:fixed;inset:0;z-index:70;background:radial-gradient(1200px 600px at 50% -10%,rgba(255,138,30,.16),transparent 60%),var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}
.welcome[hidden]{display:none}
.wbox{width:min(640px,100%);text-align:center}
.wbox img{width:150px;height:150px;object-fit:contain;margin:0 auto 6px}
.wbox h1{margin:0;font:900 64px/0.95 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.wbox>p{color:var(--ink-2);margin:10px 0 26px;font-size:15px}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
.wopt{border:1px solid var(--line-2);background:var(--panel);border-radius:12px;padding:18px 18px 16px;cursor:pointer}
.wopt:hover{border-color:var(--accent-line)}
.wopt b{display:block;font:800 26px/1 var(--disp);text-transform:uppercase}
.wopt span{display:block;color:var(--ink-2);font-size:13px;margin-top:8px}
.wopt.pri{border-color:var(--accent);background:var(--accent-wash)}
.wopt.pri b{color:var(--accent)}

const payTotal = p => D.payments.filter(x => x.player_id === p.id).reduce((s,x) => s + +x.amount, 0);
const feeOf = p => { const t = team(p.team_id); return t ? +t.fee : 0; };
const owing = p => Math.max(0, feeOf(p) - payTotal(p));
const instOf = p => D.instalments.filter(i => i.player_id === p.id).sort((a,b) => a.due.localeCompare(b.due));
const rno = x => "#" + String(x.receipt_no ?? "").padStart(4, "0");
function receiptText(p, x){ const t = team(p.team_id), left = owing(p);
  return `${CLUB.name} — Receipt ${rno(x)}\n${money(x.amount)} received (${x.method.toLowerCase()}) on ${fd(x.paid_on, {y:1})}\nPlayer: ${pname(p)}${t ? " · " + tname(t) : ""}${x.note ? `\nFor: ${x.note}` : ""}\n${feeOf(p) ? (left ? `Season fees now: ${money(left)} still to pay` : "Season fees: paid in full") : "Thank you!"}\n${CLUB.thanks},\n${D.org.contact_name}`;
}
function showReceipt(p, x){ const g = D.guardians.some(y => y.family_id === p.family_id), txt = receiptText(p, x);
  openModal(`<div style="padding:20px 22px"><h2>Receipt ${rno(x)}</h2>

    <pre style="white-space:pre-wrap;background:rgba(125,125,125,.12);border-radius:10px;padding:14px;font-size:13px;line-height:1.55;font-family:inherit;margin:0 0 14px">${esc(txt)}</pre>
    <div class="mact" style="justify-content:flex-start;flex-wrap:wrap"><button class="btn pri" data-act="copyText" data-v="${esc(txt).replace(/"/g, "&quot;")}">${I.copy}Copy receipt</button>

    <button class="btn ghost" data-act="closeAll">Done</button></div></div>`);
}
const statsOf = p => { const S = D.stats.filter(s => s.player_id === p.id); const pts = S.reduce((x,s) => x + s.points, 0); return {games:S.length, pts, ppg:S.length ? pts/S.length : null}; };
function last5(tid){ return D.fixtures.filter(f => f.team_id === tid && f.us != null).sort((a,b) => b.date.localeCompare(a.date)).slice(0,5).map(f => f.us > f.them ? "w" : f.us < f.them ? "l" : "d"); }
const wlChips = tid => { const L = last5(tid); return L.length ? `<span class="wl">${L.slice().reverse().map(x => `<i class="${x}">${x.toUpperCase()}</i>`).join("")}</span>` : '<span class="muted">–</span>'; };
function attOf(p){
  const rec = [];
  for (const key in D.roll) { if (key.split("|")[0] !== p.team_id) continue; const v = D.roll[key][p.id]; if (v !== undefined) rec.push({d:key.split("|")[1], v}); }
  rec.sort((a,b) => a.d.localeCompare(b.d));
  const here = rec.filter(r => r.v === 1).length;
  return {n:rec.length, here, pct:rec.length ? here/rec.length : null, last8:rec.slice(-8)};
}
async function signed(path, bucket = "avatars"){
  if (!path) return null;
  if (SIGNED[path]) return SIGNED[path];
  const { data } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (data && data.signedUrl) { SIGNED[path] = data.signedUrl; return data.signedUrl; }
  return null;
}
function avatarHtml(p, big){
  const cls = big ? "avpic big" : "avpic";
  if (p.photo_path && SIGNED[p.photo_path]) return `<img class="${cls}" src="${SIGNED[p.photo_path]}" alt="">`;
  if (p.photo_path) { signed(p.photo_path).then(u => { if (u) render(); }); }
  return `<div class="av${big ? "" : ""}" style="${big ? "width:64px;height:64px;border-radius:12px;font-size:20px" : ""}">${initials(pname(p))}</div>`;
}

/* ---------- sessions, clashes ---------- */
function weekSessions(M){
  const out = [], end = addD(M, 6);
  D.teams.filter(t => !t.archived).forEach(t => {
    (t.train || []).forEach((s, i) => {
      const date = addD(M, s.dow - 1);
      if (date < D.org.season.start || date > D.org.season.end || (t.created && date < t.created)) return;
      out.push({key:`${t.id}|${date}|T${i}`, team:t.id, type:"T", date, start:s.start, end:s.end, venue:s.venue, court:s.court, coaches:[t.coach_id, t.asst_id].filter(Boolean)});
    });
    D.fixtures.filter(f => f.team_id === t.id && f.date >= M && f.date <= end).forEach(f => {
      out.push({key:`${t.id}|${f.date}|G`, team:t.id, type:"G", date:f.date, start:f.time, end:mt(tm(f.time) + 50), venue:f.venue_id, court:f.court, opp:f.opp, fx:f, coaches:[t.coach_id, t.asst_id].filter(Boolean)});
    });
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || tm(a.start) - tm(b.start));
}
function conflicts(S){
  const C = [];
  for (let i = 0; i < S.length; i++) for (let j = i + 1; j < S.length; j++) {
    const a = S[i], b = S[j];
    if (a.date !== b.date || !(tm(a.start) < tm(b.end) && tm(b.start) < tm(a.end))) continue;
    a.coaches.filter(c => b.coaches.includes(c)).forEach(c => C.push({kind:"coach", a, b, coach:c}));
    if (a.venue === b.venue && a.court === b.court) C.push({kind:"court", a, b});
  }
  return C;
}
function availCount(s){ const r = roster(s.team), a = D.avail[s.key] || {}; const inn = r.filter(p => a[p.id] === "in").length, out = r.filter(p => a[p.id] === "out").length; return {inn, out, none:r.length - inn - out, n:r.length}; }
function rollCount(s){ const r = D.roll[s.key]; if (!r) return null; const v = Object.values(r); return {here:v.filter(x => x === 1).length, n:v.length}; }
function isPast(s){ const T = todayISO(); return s.date < T || (s.date === T && tm(s.end) <= new Date().getHours() * 60); }
const gameShort = s => { const a = availCount(s), d = between(todayISO(), s.date); return a.n > 0 && a.inn < D.org.min_game && (d <= 2 || a.inn + a.none < D.org.min_game); };
const pendingMod = () => D.posts.filter(p => p.status === "pending").length + D.comments.filter(c => c.status === "pending").length + D.media.filter(m => m.status === "pending").length;
const unreadConvs = () => D.convs.filter(c => c.last_message_at && (!D.reads[c.id] || D.reads[c.id] < c.last_message_at)).length;
function convLabel(c){
  const f = fam(c.family_id), t = team(c.team_id);
  if (c.kind === "family") return (f ? f.name : "Family") + " · private";
  if (c.kind === "club") return (f ? f.name : "Family") + " ↔ " + CLUB.short;
  return (f ? f.name : "Family") + " ↔ coach · " + (t ? tname(t) : "");
}

/* ---------- shell & routing ---------- */
const ROUTES = () => {
  const base = [["week","This week",I.week],["teams","Teams",I.teams],["players","Players",I.players]];
  if (isAdmin()) base.push(["regos","Registrations",I.regos], ["money","Money",I.money]);
  base.push(["coaches","Coaches",I.coach], ["messages","Messages",I.chat], ["community","Community",I.comm]);
  if (isAdmin()) base.push(["seasons","Seasons",I.seasons], ["settings","Settings",I.settings]);
  return base;
};
function parseHash(){ const h = location.hash.replace(/^#\/?/, "").split("/")[0]; return ROUTES().some(r => r[0] === h) ? h : "week"; }
addEventListener("hashchange", () => { if (!D) return; VIEW.r = parseHash(); render(); scrollTo(0, 0);
  if (VIEW.r === "community") refreshComm();
  if (VIEW.r === "messages") refreshConvs(); });
function shell(){
  const badges = {regos: D.regs.filter(r => r.stage === "new" && !r.archived).length, community: pendingMod(), messages: unreadConvs()};
  $("#nav").innerHTML = ROUTES().map(([k, l, i]) => `<a href="#/${k}" class="${VIEW.r === k ? "on" : ""}">${i}${l}${badges[k] ? `<span class="ct">${badges[k]}</span>` : ""}</a>`).join("");
  const mob = [["week","Week",I.week],["players","Players",I.players],["messages","Chat",I.chat],["community","Club",I.comm],["more","More",I.more]];
  const inMore = !["week","players","messages","community"].includes(VIEW.r);
  $("#tabbar").innerHTML = mob.map(([k, l, i]) => `<a href="#/${k === "more" ? "teams" : k}" class="${VIEW.r === k || (k === "more" && inMore) ? "on" : ""}">${i}${l}${badges[k] ? `<span class="ct">${badges[k]}</span>` : ""}</a>`).join("");
  const th = document.documentElement.dataset.theme;
  $("#themeBtn").innerHTML = (th === "light" ? I.moon : I.sun) + (th === "light" ? "Dark" : "Light");
  $("#themeBtnM").innerHTML = th === "light" ? I.moon : I.sun;
  $("#whoami").textContent = ME.full_name + " · " + (isAdmin() ? "Admin" : "Coach");
  $("#demoNote").innerHTML = `<b>Live club data.</b> Everything here is shared with the other staff sign-ins.`;
}
const moreNav = () => `<div class="seg morenav">${ROUTES().filter(r => !["week","players","messages","community"].includes(r[0])).map(([k, l]) => `<button class="${VIEW.r === k ? "on" : ""}" data-act="go" data-id="${k}">${l}</button>`).join("")}</div>`;
function render(){
  if (!D || !ME) return;
  shell();
  const V = {week:vWeek, teams:vTeams, players:vPlayers, regos:vRegos, money:vMoney, coaches:vCoaches, messages:vMessages, community:vCommunity, seasons:vSeasons, settings:vSettings}[VIEW.r];
  $("#main").innerHTML = V();
  if (VIEW.r === "messages") { const box = $("#tmsgs"); if (box) box.scrollTop = box.scrollHeight; }
  if (DRAWER) { const html = DRAWER.k === "sess" ? dSession(DRAWER.id) : DRAWER.k === "team" ? dTeam(DRAWER.id) : DRAWER.k === "player" ? dPlayer(DRAWER.id) : DRAWER.k === "season" ? dSeason(DRAWER.id) : "";
    if (html) { const sc = ($(".dbd") || {}).scrollTop || 0; $("#drawer").innerHTML = html; if ($(".dbd")) $(".dbd").scrollTop = sc; } else closeAll(); }
}

function vWeek(){
  const M = VIEW.week, T = todayISO(), S = weekSessions(M), C = conflicts(S);
  const isThis = M === monday(T);
  const games = S.filter(s => s.type === "G"), up = games.filter(s => !isPast(s));
  const av = up.reduce((o, s) => { const a = availCount(s); o.inn += a.inn; o.n += a.n; o.none += a.none; return o; }, {inn:0, n:0, none:0});
  const A = alerts(M, S, C);
  const owe = active().reduce((s, p) => s + owing(p), 0);
  const days = [1,2,3,4,5,6,7].map(d => {
    const date = addD(M, d - 1), ss = S.filter(s => s.date === date), mg = maghrib(date);
    return `<div class="day${date === T ? " today" : ""}${date < T ? " past" : ""}">
      <div class="dh"><b>${DN[d]} ${new Date(U(date)).getUTCDate()}</b>${D.org.prayer ? `<span>${CLUB.prayerLabel} ~${t12(mg)}</span>` : `<span>${MON[new Date(U(date)).getUTCMonth()]}</span>`}</div>
      ${ss.length ? ss.map(s => sessCard(s, C, mg)).join("") : `<div class="dayempty">Nothing on</div>`}</div>`;
  }).join("");
  return `
  <div class="ph"><div><h1>${isThis ? "This week" : "Week of " + fd(M)}</h1><div class="sub">${fd(M, {wd:1})} to ${fd(addD(M, 6), {wd:1, y:1})} · ${esc(D.org.season.name || "")}</div></div>
    <div class="acts"><button class="btn icon" data-act="wk" data-d="-7" aria-label="Previous week">${I.prev}</button>
      ${isThis ? "" : `<button class="btn" data-act="wk" data-d="0">This week</button>`}
      <button class="btn icon" data-act="wk" data-d="7" aria-label="Next week">${I.next}</button>
      ${isAdmin() ? `<button class="btn pri" data-act="newTeam">${I.plus}New team</button>` : ""}</div></div>
  <div class="kpis">
    <div class="kpi"><div class="l">Sessions</div><div class="v">${S.length}</div><div class="s">${S.length - games.length} training · ${games.length} games</div></div>
    <div class="kpi"><div class="l">Confirmed for games</div><div class="v">${av.inn}<small> of ${av.n}</small></div><div class="s">${av.none} still to reply</div></div>
    <button class="kpi${A.some(a => a.lv === "crit") ? " hot" : ""}" data-act="scrollTo" data-id="attn"><div class="l">Needs attention</div><div class="v">${A.length}</div><div class="s">${A.filter(a => a.lv === "crit").length} urgent</div></button>
    ${isAdmin() ? `<button class="kpi" data-act="go" data-id="money"><div class="l">Fees owing</div><div class="v">${money(owe)}</div><div class="s">${plural(active().filter(p => owing(p) > 0).length, "player")}</div></button>` : `<button class="kpi" data-act="go" data-id="messages"><div class="l">Messages</div><div class="v">${unreadConvs()}</div><div class="s">unread threads</div></button>`}
    <button class="kpi" data-act="go" data-id="community"><div class="l">Waiting for approval</div><div class="v">${pendingMod()}</div><div class="s">posts, comments and media</div></button>
  </div>
  <div class="grid">
    <section class="card c8" id="attn"><div class="ch"><h2>Needs attention</h2><span class="sub">Sorted by how much it'll hurt if nobody acts</span></div>
      ${A.length ? `<div class="alerts">${A.map(a => `<div class="al ${a.lv}">${a.lv === "info" ? I.info : I.alert}<div><div class="t">${a.t}</div><div class="m">${a.m}</div></div>
        <button class="btn sm" data-act="${a.act}" data-id="${esc(a.id ?? "")}">${a.btn}</button></div>`).join("")}</div>` : `<div class="empty">Nothing needs you this week.</div>`}</section>
    <section class="card c4"><div class="ch"><h2>To do</h2><span class="right">${D.tasks.filter(k => !k.done).length} open</span></div>${tasksHtml()}</section>
    <section class="c12"><div class="board">${days}</div></section>
  </div>`;
}
function alerts(M, S, C){
  const A = [], T = todayISO();
  C.forEach(c => {
    if (c.kind === "coach") A.push({lv:"crit", t:`<b>${esc(coach(c.coach).name)}</b> is booked for two sessions at once`, m:`${DN[dow(c.a.date)]}: ${tname(team(c.a.team))} ${trange(c.a.start, c.a.end)} and ${tname(team(c.b.team))} ${trange(c.b.start, c.b.end)}. Arrange a fill-in coach.`, act:"go", id:"coaches", btn:"Coaches"});
    else A.push({lv:"crit", t:`${CLUB.areaCap} clash at <b>${esc((venue(c.a.venue) || {}).short || "?")}</b>, ${CLUB.area} ${c.a.court}`, m:`${DN[dow(c.a.date)]}: ${tname(team(c.a.team))} and ${tname(team(c.b.team))}`, act:"editTeam", id:c.b.team, btn:"Fix times"});
  });
  S.filter(s => s.type === "G" && !isPast(s) && gameShort(s)).forEach(s => { const a = availCount(s);
    A.push({lv:a.inn + a.none < D.org.min_game ? "crit" : "warn", t:`<b>${tname(team(s.team))}</b> has ${a.inn} confirmed for ${DN[dow(s.date)]}'s game`, m:`${D.org.min_game} needed. ${a.none} haven't replied.`, act:"sess", id:s.key, btn:"Open"}); });
  if (pendingMod()) A.push({lv:"warn", t:`${plural(pendingMod(), "post or comment is", "posts and comments are").replace(/^\d+ /, m => m)} waiting for approval`, m:"Families can't see them until an admin approves.", act:"go", id:"community", btn:"Review"});
  active().forEach(p => { const t = team(p.team_id); if (t && GI(ageGroupOf(p.dob)) > GI(t.age)) A.push({lv:"crit", t:`<b>${esc(pname(p))}</b> is ${ageGroupOf(p.dob)} age and too old for ${t.age}`, m:`Born ${fd(p.dob, {y:1})}.`, act:"player", id:p.id, btn:"Move"}); });
  D.coaches.forEach(c => { const w = wwcc(c); if (w.level !== "good" && D.teams.some(t => !t.archived && (t.coach_id === c.id || t.asst_id === c.id)))
    A.push({lv:w.level, t:`${CLUB.check.name}: <b>${esc(c.name)}</b>`, m:w.text + ".", act:"go", id:"coaches", btn:"Coaches"}); });
  if (isAdmin()) { const waiting = D.regs.filter(r => r.stage === "new" && !r.archived && between(r.at.slice(0,10), T) >= 3);
    if (waiting.length) A.push({lv:"warn", t:`${plural(waiting.length, "registration")} waiting more than 3 days`, m:waiting.map(r => r.first_name + " " + r.last_name).join(", "), act:"go", id:"regos", btn:"Reply"}); }
  S.filter(s => isPast(s) && !D.roll[s.key] && s.date >= addD(T, -6) && roster(s.team).length).forEach(s => A.push({lv:"info", t:`Roll not taken: <b>${tname(team(s.team))}</b>, ${DN[dow(s.date)]} ${s.type === "G" ? "game" : "training"}`, m:"Take it while it's fresh.", act:"sess", id:s.key, btn:"Take roll"}));
  const order = {crit:0, warn:1, info:2};
  return A.sort((a,b) => order[a.lv] - order[b.lv]);
}
function sessCard(s, C, mg){
  const t = team(s.team), v = venue(s.venue), past = isPast(s), fl = C.filter(c => c.a.key === s.key || c.b.key === s.key);

  if (past) { const r = rollCount(s); foot = r ? `<div class="sm">${r.here} of ${r.n} there${s.fx && s.fx.us != null ? ` · ${s.fx.us}–${s.fx.them} ${s.fx.us > s.fx.them ? "W" : "L"}` : ""}</div>` : (roster(s.team).length ? `<span class="flag warn">Roll not taken</span>` : ""); }
  else if (s.type === "G") { const a = availCount(s); foot = `<div class="avb"><i class="in" style="width:${a.inn / Math.max(1, a.n) * 100}%"></i><i class="out" style="width:${a.out / Math.max(1, a.n) * 100}%"></i></div><div class="sm">${a.inn} in · ${a.out} out · ${a.none} no reply</div>${gameShort(s) ? `<span class="flag warn">Short</span>` : ""}`; }
  const spans = D.org.prayer && tm(s.start) < tm(mg) && tm(mg) < tm(s.end);

    ${spans ? `<div class="mg">${I.crescent}${CLUB.prayerLabel} break ${t12(mg)}</div>` : ""}${foot}

}

    name:(a,b) => a.last_name.localeCompare(b.last_name) || a.first_name.localeCompare(b.first_name),

  <section class="card flush"><div class="tw"><table>

        <span class="pill2">${fd(i.due, {wd:1})}</span><span class="mono num">${money(i.amount)}</span></div>`; }).join("") || `<div class="empty">No payment plans set up. Add one from a player's file.</div>`}</div></section>

        <td class="hidemob" style="white-space:nowrap">${tname(team(p.team_id))}</td><td class="r mono num">${money(owing(p))}</td>

    <section class="card flush" style="grid-column:1/-1"><div class="ch"><h2>Receipts</h2><span class="sub">Every payment recorded, newest first — open one to copy or resend it</span></div>

/* ---------- coaches ---------- */
function wwcc(c){
  if (!c.wwcc_exp) return {level:"crit", text:"Not on file"};
  const d = between(todayISO(), c.wwcc_exp);
  if (d < 0) return {level:"crit", text:"Expired " + fd(c.wwcc_exp, {y:1})};
  if (d <= 60) return {level:"warn", text:`Expires in ${d} days`};
  return {level:"good", text:"Valid to " + fd(c.wwcc_exp, {y:1})};
}
function vCoaches(){
  const M = monday(todayISO()), S = weekSessions(M), C = conflicts(S).filter(c => c.kind === "coach");

  <div class="ph"><div><h1>Coaches</h1><div class="sub">Every coach needs a current ${CLUB.check.name} before they run a session.</div></div>
    ${isAdmin() ? `<div class="acts"><button class="btn" data-act="inviteCoach">${I.key}Invite link</button><button class="btn pri" data-act="newCoach">${I.plus}Add coach</button></div>` : ""}</div>
  ${C.length ? `<section class="card" style="margin-bottom:16px;border-left:3px solid var(--crit)"><div class="ch"><h2>Clashes this week — arrange a fill-in</h2></div>
    ${C.map(x => `<div class="al crit">${I.alert}<div><div class="t"><b>${esc(coach(x.coach).name)}</b> · ${DL[dow(x.a.date)]}</div>

/* ---------- community ---------- */
function vCommunity(){
  const seg = VIEW.comm;
  const pendP = D.posts.filter(p => p.status === "pending"), pendC = D.comments.filter(c => c.status === "pending"), pendM = D.media.filter(m => m.status === "pending");
  const nPend = pendP.length + pendC.length + pendM.length;
  const segs = `<div class="seg" style="margin-bottom:16px">
    ${[["queue", `Approval queue${nPend ? " · " + nPend : ""}`], ["board", "Board"], ["gallery", "Gallery"]].map(([k, l]) => `<button class="${seg === k ? "on" : ""}" data-act="commSeg" data-id="${k}">${l}</button>`).join("")}</div>`;
  let body = "";
  if (seg === "queue") {
    body = nPend ? `<div class="modq">
      ${pendP.map(p => `<div class="postcard"><div class="ph2"><div class="av">${initials(p.author_name)}</div><div><b>${esc(p.author_name)}</b> <span class="chip">${p.author_role}</span> <span class="muted" style="font-size:12px">post · ${ftime(p.created_at)}</span></div></div>
        <div class="body">${esc(p.body)}</div><div class="qs"><button class="btn sm pri" data-act="mod" data-t="posts" data-id="${p.id}" data-v="approved">Approve</button><button class="btn sm danger" data-act="mod" data-t="posts" data-id="${p.id}" data-v="rejected">Reject</button></div></div>`).join("")}
      ${pendC.map(c => { const on = D.posts.find(p => p.id === c.post_id); return `<div class="postcard"><div class="ph2"><div class="av">${initials(c.author_name)}</div><div><b>${esc(c.author_name)}</b> <span class="chip">${c.author_role}</span> <span class="muted" style="font-size:12px">comment on “${esc((on ? on.body : "").slice(0, 40))}…”</span></div></div>
        <div class="body">${esc(c.body)}</div><div class="qs"><button class="btn sm pri" data-act="mod" data-t="comments" data-id="${c.id}" data-v="approved">Approve</button><button class="btn sm danger" data-act="mod" data-t="comments" data-id="${c.id}" data-v="rejected">Reject</button></div></div>`; }).join("")}
      ${pendM.map(m => `<div class="postcard"><div class="ph2"><div class="av">${initials(m.author_name)}</div><div><b>${esc(m.author_name)}</b> <span class="muted" style="font-size:12px">${m.kind} for the gallery${m.caption ? " · " + esc(m.caption) : ""}</span></div></div>
        <div style="margin:10px 0;max-width:280px" id="mq-${m.id}">${mediaTag(m, "mq")}</div>
        <div class="qs"><button class="btn sm pri" data-act="mod" data-t="media" data-id="${m.id}" data-v="approved">Approve</button><button class="btn sm danger" data-act="mod" data-t="media" data-id="${m.id}" data-v="rejected">Reject</button></div></div>`).join("")}
    </div>` : `<section class="card"><div class="empty">Nothing waiting. Anything a parent or player posts lands here first.</div></section>`;
  } else if (seg === "board") {
    const feed = D.posts.filter(p => p.status === "approved");
    body = `<section class="card" style="margin-bottom:14px"><form data-form="post" class="addtask" style="margin:0"><input name="body" placeholder="Post to the whole club (goes up straight away as ${isAdmin() ? "admin" : "coach — admins approve it first"})" required maxlength="4000"><button class="btn pri icon" aria-label="Post">${I.send}</button></form></section>
      ${feed.map(p => postCard(p)).join("") || `<section class="card"><div class="empty">No posts yet.</div></section>`}`;
  } else {
    const gal = D.media.filter(m => m.status === "approved" || m.author_id === ME.id);
    body = `<section class="card" style="margin-bottom:14px"><div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
      <label class="btn pri" style="cursor:pointer">${I.cam}Add photo or clip<input type="file" accept="image/*,video/mp4,video/quicktime" data-act="galUpload" hidden></label>
      <span class="muted" style="font-size:12.5px">Staff uploads show straight away. Family uploads wait for an admin. Respect photo consent — check the player list first.</span></div></section>
      <div class="gal">${gal.map(m => `<div class="gi" id="g-${m.id}">${mediaTag(m, "g")}${m.status === "pending" ? `<span class="chip warn pend">Waiting</span>` : ""}
        <div class="cap">${esc(m.caption || m.author_name)}${isAdmin() ? ` <button class="glink" data-act="delMedia" data-id="${m.id}" style="color:#fff;float:right">✕</button>` : ""}</div></div>`).join("") || `<div class="empty">Nothing in the gallery yet.</div>`}</div>`;
  }
  return `${moreNav()}
  <div class="ph"><div><h1>Community</h1><div class="sub">Every post, comment and family photo is approved by an admin before the club sees it.</div></div></div>
  ${segs}${body}`;
}
function mediaTag(m, pre){
  const url = SIGNED["media:" + m.path];
  if (!url) { signed(m.path, "media").then(u => { if (u) { SIGNED["media:" + m.path] = u; render(); } }); return `<div style="aspect-ratio:1;display:grid;place-items:center;color:var(--muted);font-size:12px">Loading…</div>`; }
  return m.kind === "video" ? `<video src="${url}" controls playsinline preload="metadata"></video>` : `<img src="${url}" alt="" loading="lazy">`;
}
function postCard(p){
  const cms = D.comments.filter(c => c.post_id === p.id && c.status === "approved");
  const likes = D.likes.filter(l => l.post_id === p.id);
  const mine = likes.some(l => l.profile_id === ME.id);
  return `<div class="postcard"><div class="ph2"><div class="av">${initials(p.author_name)}</div><div><b>${esc(p.author_name)}</b> <span class="chip${["admin","coach"].includes(p.author_role) ? " acc" : ""}">${p.author_role === "admin" ? CLUB.short : p.author_role}</span><div class="muted" style="font-size:11.5px">${ftime(p.created_at)}</div></div>
    ${isAdmin() ? `<button class="btn sm ghost danger" style="margin-left:auto" data-act="delPost" data-id="${p.id}">Remove</button>` : ""}</div>
  <div class="body">${esc(p.body)}</div>
  <div class="meta"><button class="${mine ? "on" : ""}" data-act="like" data-id="${p.id}">${I.heart}${likes.length || ""}</button><span>${plural(cms.length, "comment")}</span></div>
  ${cms.map(c => `<div class="cmt"><div class="av">${initials(c.author_name)}</div><div class="cb"><b>${esc(c.author_name)}</b> ${esc(c.body)}</div></div>`).join("")}
  <form class="addtask" data-form="comment" data-id="${p.id}" style="margin-top:10px"><input name="body" placeholder="Comment" required maxlength="2000"><button class="btn icon sm" aria-label="Send">${I.send}</button></form></div>`;
}

/* =========================================================
   Drawers
   ========================================================= */
function openDrawer(k, id){ DRAWER = {k, id}; render(); $("#drawer").classList.add("on"); $("#drawer").setAttribute("aria-hidden", "false"); $("#scrim").classList.add("on"); }
function closeAll(){ DRAWER = null; $("#drawer").classList.remove("on"); $("#drawer").setAttribute("aria-hidden", "true"); $("#modal").classList.remove("on"); $("#scrim").classList.remove("on"); }
const dHead = (title, sub, extra = "") => `<div class="dhd"><div style="min-width:0"><h2>${title}</h2><div class="sub">${sub}</div>${extra}</div><button class="btn icon ghost x" data-act="closeAll" aria-label="Close">${I.x}</button></div>`;
function findSession(key){ return weekSessions(monday(key.split("|")[1])).find(s => s.key === key); }

function dSession(key){
  const s = findSession(key); if (!s) return "";
  const t = team(s.team), v = venue(s.venue), past = isPast(s), R = roster(s.team), a = D.avail[key] || {}, r = D.roll[key] || {};
  const mg = maghrib(s.date), spans = D.org.prayer && tm(s.start) < tm(mg) && tm(mg) < tm(s.end);
  const cnt = past ? rollCount(s) : availCount(s);
  return dHead(tname(t), `${s.type === "G" ? "Game vs " + esc(s.opp) : "Training"} · ${fd(s.date, {wd:1})} · ${trange(s.start, s.end)}`) + `<div class="dbd">
    <div class="sec"><dl class="kv"><dt>Where</dt><dd>${esc(v ? v.name : "TBC")}, ${CLUB.area} ${s.court}</dd><dt>Coach</dt><dd>${esc(t.coach_name || "Not set")}${t.asst_name ? ", " + esc(t.asst_name) : ""}</dd>
      ${spans ? `<dt>${CLUB.prayerLabel}</dt><dd>~${t12(mg)}. Plan a short break.</dd>` : ""}
      ${s.fx && s.fx.us != null ? `<dt>Result</dt><dd>${s.fx.us}–${s.fx.them} ${s.fx.us > s.fx.them ? "win" : "loss"}</dd>` : ""}
      ${s.fx ? `<dt>Game video</dt><dd>${s.fx.video_url ? `<a href="${esc(s.fx.video_url)}" target="_blank" rel="noopener">${I.video ? "" : ""}Watch on ${CLUB.film.name || "video"} ↗</a>` : `<button class="glink" data-act="setVideo" data-id="${s.fx.id}">Add ${CLUB.film.name || "video"} link</button>`}</dd>` : ""}</dl></div>
    ${s.fx && past ? `<div class="sec"><h3>Score${s.fx.us == null ? " — not entered" : ""}<span class="right"><button class="btn sm" data-act="score" data-id="${s.fx.id}">${I.edit}${s.fx.us == null ? "Enter" : "Edit"}</button></span></h3></div>` : ""}
    <div class="sec"><h3>${past ? "Roll call" : s.type === "G" ? "Who's playing" : "Expected"}<span class="right mono">${past ? (cnt ? `${cnt.here} of ${R.length} there` : "not taken") : s.type === "G" ? `${cnt.inn} in · ${cnt.out} out · ${cnt.none} no reply` : R.length + " on the roster"}</span></h3>
      ${past ? `<div style="display:flex;gap:6px;margin-bottom:8px"><button class="btn sm" data-act="rollAll" data-id="${key}">Everyone was there</button></div>` : ""}
      <div class="plist">${R.map(p => { const val = past ? r[p.id] : a[p.id];
        return `<div class="pr"><div class="who">${avatarHtml(p)}<div><b>${esc(pname(p))}</b><small>${p.no != null ? "#" + p.no : ""}</small></div></div>
          ${past ? `<div class="tog"><button class="${val === 1 ? "on in" : ""}" data-act="roll" data-id="${key}" data-p="${p.id}" data-v="1">Here</button><button class="${val === 0 ? "on out" : ""}" data-act="roll" data-id="${key}" data-p="${p.id}" data-v="0">Away</button></div>`
          : s.type === "G" ? `<div class="tog"><button class="${val === "in" ? "on in" : ""}" data-act="avail" data-id="${key}" data-p="${p.id}" data-v="in">In</button><button class="${val === "out" ? "on out" : ""}" data-act="avail" data-id="${key}" data-p="${p.id}" data-v="out">Out</button></div>` : ""}</div>`; }).join("") || `<div class="empty">Nobody on this roster yet.</div>`}</div></div>
    ${s.fx && past ? `<div class="sec"><h3>${CLUB.scoreCap}<span class="right muted">typed from the ${CLUB.scoresheet} sheet</span></h3><div class="plist">
      ${R.map(p => { const st = D.stats.find(x => x.fixture_id === s.fx.id && x.player_id === p.id);
        return `<div class="pr"><div class="who"><div class="av">${initials(pname(p))}</div><b style="font-weight:500">${esc(pname(p))}</b></div>
        <input type="number" min="0" max="99" value="${st ? st.points : ""}" placeholder="0" data-act="ptsIn" data-fx="${s.fx.id}" data-p="${p.id}" style="width:70px;height:32px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel-2);padding:0 8px;text-align:right"></div>`; }).join("")}</div></div>` : ""}
    <div class="sec"><h3>Message for the team chat<span class="right"><button class="btn sm" data-act="copyTeamMsg" data-id="${t.id}" data-w="${monday(s.date)}">${I.copy}Copy</button></span></h3><div class="msg">${esc(teamMsg(t, monday(s.date)))}</div></div>
  </div>`;
}
function teamMsg(t, M){
  const S = weekSessions(M).filter(s => s.team === t.id);
  const lines = S.map(s => `${s.type === "G" ? "Game" : "Training"}: ${DL[dow(s.date)]} ${fd(s.date)}, ${trange(s.start, s.end)} at ${(venue(s.venue) || {short:"TBC"}).short}, ${CLUB.area} ${s.court}${s.opp ? ` vs ${s.opp}` : ""}`);
  return `${CLUB.greetLong} ${tname(t)} families,\n\nThis week:\n${lines.join("\n") || "No sessions."}\n\n${S.some(s => s.type === "G") ? "Please reply IN or OUT in the ${CLUB.short} app so we can plan the rotation.\n\n" : ""}${t.coach_name ? "Coach " + t.coach_name : D.org.contact_name}`;
}

function moveSelect(p){
  if (!isAdmin()) return "";

  return `<select class="btn sm" style="padding:0 6px" data-act="move" data-id="${p.id}" aria-label="Move">
    <option value="">${p.team_id ? "Move to…" : "Add to team…"}</option>${teams.filter(t => t.id !== p.team_id).map(t => `<option value="${t.id}">${tname(t)}</option>`).join("")}

}

function dSeason(id){

    ${(s.teams || []).map(t => `<div class="sec"><h3>${esc(t.name)} · coach ${esc(t.coach || "–")}<span class="right mono">${t.record || ""}${t.attendance != null ? " · " + t.attendance + "% attendance" : ""}</span></h3>

async function loadSeason(id){

async function run(fn){ try { await fn(); } catch (e) { console.error(e); toast(e.message || "That didn't save. Try again."); } }
async function reload(tables){ await fetchAll(); render(); }
const ACT = {
  go:el => { closeAll(); location.hash = "#/" + el.dataset.id; },
  wk:el => { const d = +el.dataset.d; VIEW.week = d === 0 ? monday(todayISO()) : addD(VIEW.week, d); render(); },

  signout:async () => { await sb.auth.signOut(); location.reload(); },
  sess:el => openDrawer("sess", el.dataset.id),
  team:el => openDrawer("team", el.dataset.id),
  player:(el, e) => { if (e) e.preventDefault(); openDrawer("player", el.dataset.id); },
  season:el => { VIEW.seasonData = null; openDrawer("season", el.dataset.id); },
  squadDrawer:() => { VIEW.pf.team = "squad"; location.hash = "#/players"; },
  newTeam:() => teamForm(null),

/* ---------- spreadsheet import ---------- */
// The reader library only loads when someone actually picks a file.
let IMP = null;
async function needXLSX(){ if (window.XLSX) return;
  await new Promise((ok, no) => { const s = document.createElement("script");
    s.src = "https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js";
    s.onload = ok; s.onerror = () => no(new Error("Couldn't load the spreadsheet reader — check the connection"));
    document.head.appendChild(s); });
}
function importSheet(file){ run(async () => {
  await needXLSX();
  // raw:true keeps CSV cells as the text that was typed — otherwise the reader
  // guesses dates American-style and 12/03 (12 March) turns into December 3.
  const wb = XLSX.read(await file.arrayBuffer(), {type:"array", raw:true});
  const ws = wb.Sheets[wb.SheetNames[0]];
  const all = XLSX.utils.sheet_to_json(ws, {header:1, raw:true, defval:""});
  const hi = all.findIndex(r => r.filter(c => typeof c === "string" && c.trim()).length >= 2);
  if (hi < 0) throw new Error("Couldn't find a heading row in that file");
  const headers = all[hi].map(h => String(h).trim());
  const rows = all.slice(hi + 1).filter(r => r.some(c => String(c).trim()));
  if (!rows.length) throw new Error("No rows under the headings");
  IMP = {headers, rows};
  importMap();
}); }
// What we can file, and how a heading usually spells it.
const IMP_FIELDS = [
  ["first", "Player first name", /first|given/i],
  ["last", "Player last name", /last ?name|surname|family name/i],
  ["full", "Player full name (one column)", /^(player ?|child ?|full ?)?names?$/i],
  ["dob", "Date of birth", /d\.? ?o\.? ?b|birth/i],
  ["team", "Team or age group", /team|squad|age ?group|division|div/i],
  ["no", "Jersey number", /jersey|singlet|^#$|^no\.?$|^(shirt|top) ?(no|number)$/i],
  ["gname", "Parent name", /(parent|guardian|mother|father|mum|dad)(?!.*(mob|phone|mail|numb))/i],
  ["gphone", "Parent mobile", /(parent|guardian|contact|emergency).*(mob|phone|number)|^(mobile|phone|contact)( number)?$/i],
  ["gemail", "Parent email", /mail/i],
  ["phone", "Player mobile", /player.*(mob|phone)/i],
  ["med", "Medical note", /medical|allerg|health|condition/i],
];
function importMap(){
  const used = new Set(), guess = {};
  for (const [k, , re] of IMP_FIELDS) { const i = IMP.headers.findIndex((h, ix) => h && re.test(h) && !used.has(ix));
    if (i >= 0) { guess[k] = i; used.add(i); } }
  const opts = ci => `<option value="">— not in this sheet —</option>` + IMP.headers.map((h, i) =>
    `<option value="${i}"${ci === i ? " selected" : ""}>${esc(h || "column " + (i + 1))}</option>`).join("");
  openModal(`<form data-form="importGo"><h2>Import ${IMP.rows.length} rows</h2>
    <div class="sub">The headings have been matched up automatically — fix any that look wrong, then import. Already-known players are skipped.</div><div class="fg">
    ${IMP_FIELDS.map(([k, label]) => `<div class="f h"><label>${label}</label><select name="${k}">${opts(guess[k])}</select></div>`).join("")}
    </div>${mact("Import players")}</form>`);
}
function parseDob(v){
  if (v === "" || v == null) return null;
  if (typeof v === "number" && v > 20000 && v < 60000) return new Date(Date.UTC(1899, 11, 30) + v * 86400000).toISOString().slice(0, 10);
  const s = String(v).trim();
  let m = s.match(/^(\d{4})-(\d{2})-(\d{2})/); if (m) return m[0];
  m = s.match(/^(\d{1,2})[\/.-](\d{1,2})[\/.-](\d{2,4})$/); // day-first by default; set dateOrder:"mdy" in club.config.json for US-style sheets
  if (m) { let y = +m[3]; if (y < 100) y += y > 30 ? 1900 : 2000;
    let d = +m[1], mo = +m[2];
    if (CLUB.dateOrder === "mdy") { const t2 = d; d = mo; mo = t2; }
    if (mo > 12 && d <= 12) { const t = mo; mo = d; d = t; } // clearly month-first, flip it
    if (mo < 1 || mo > 12 || d < 1 || d > 31) return null;
    return `${y}-${String(mo).padStart(2, "0")}-${String(d).padStart(2, "0")}`; }
  return null;
}

/* ---------- uploads ---------- */
function shrink(file, max){ return new Promise(res => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => res(b), "image/jpeg", .86); }; img.src = URL.createObjectURL(file); }); }
function uploadAvatar(pid, file){ run(async () => {
  const blob = await shrink(file, 512); const path = `players/${pid}.jpg`;
  const { error } = await sb.storage.from("avatars").upload(path, blob, {upsert:true, contentType:"image/jpeg"});
  if (error) throw error;
  await sb.from("players").update({photo_path:path}).eq("id", pid).throwOnError();
  player(pid).photo_path = path; delete SIGNED[path]; render(); toast("Photo saved"); }); }
function uploadMedia(file){ run(async () => {
  const isVideo = file.type.startsWith("video");
  if (file.size > 50 * 1024 * 1024) { toast("Keep clips under 50MB"); return; }
  const blob = isVideo ? file : await shrink(file, 1600);
  const path = `gallery/${Date.now()}-${Math.random().toString(36).slice(2, 8)}${isVideo ? ".mp4" : ".jpg"}`;
  const { error } = await sb.storage.from("media").upload(path, blob, {contentType:isVideo ? file.type : "image/jpeg"});
  if (error) throw error;
  const cap = prompt("Caption (optional)") || "";
  const { data } = await sb.from("media").insert({path, kind:isVideo ? "video" : "image", caption:cap}).select().single().throwOnError();
  D.media.unshift(data); render(); toast("Added to the gallery"); }); }

/* ---------- messages plumbing ---------- */
async function loadMsgs(cid){
  const { data } = await sb.from("messages").select("*").eq("conversation_id", cid).order("created_at").limit(300);
  D.msgs[cid] = data || []; markRead(cid);
}
function markRead(cid){ D.reads[cid] = new Date().toISOString(); sb.from("conversation_reads").upsert({conversation_id:cid, profile_id:ME.id, last_read_at:D.reads[cid]}).then(() => {}); }
function startRealtime(){
  sb.channel("staff")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"messages"}, pl => { const m = pl.new;
      if (D.msgs[m.conversation_id] && !D.msgs[m.conversation_id].some(x => x.id === m.id)) D.msgs[m.conversation_id].push(m);
      const c = D.convs.find(x => x.id === m.conversation_id);
      if (c) { c.last_message_at = m.created_at; c.last_preview = m.body.slice(0, 120); if (VIEW.conv === m.conversation_id) markRead(c.id); }
      else sb.from("conversations").select("*").eq("id", m.conversation_id).single().then(({data}) => { if (data) { D.convs.unshift(data); render(); } });
      render(); })
    .on("postgres_changes", {event:"*", schema:"public", table:"posts"}, () => refreshComm())
    .on("postgres_changes", {event:"*", schema:"public", table:"comments"}, () => refreshComm())
    .on("postgres_changes", {event:"*", schema:"public", table:"media"}, () => refreshComm())
    .subscribe();
}
async function refreshConvs(){ try { const c = await q("conversations", "*", {c:"last_message_at", a:false}); D.convs = c; render(); } catch (e) {} }
let commT = null;
function refreshComm(){ clearTimeout(commT); commT = setTimeout(async () => {
  const [p, c, m, l] = await Promise.all([q("posts", "*", {c:"created_at", a:false}), q("comments", "*", {c:"created_at"}), q("media", "*", {c:"created_at", a:false}), q("post_likes")]);
  D.posts = p; D.comments = c; D.media = m; D.likes = l; render(); }, 400); }

/* ---------- theme ---------- */
function setTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem(CLUB.slug + "_staff_theme", t); } catch (e) {} const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#F5F2EC" : "#0B0A08"; render(); }
(() => { let t = null; try { t = localStorage.getItem(CLUB.slug + "_staff_theme"); } catch (e) {} document.documentElement.dataset.theme = t || "dark"; })();

/* ---------- gate ---------- */
function gate(mode, err){
  $("#loading").hidden = true; $("#shell").hidden = true; $("#gate").hidden = false;
  const g = $("#gcard");
  if (mode === "wrongApp") { g.innerHTML = `<p style="margin:0 0 14px;font-size:14px">This sign-in belongs to the family app, not the staff one.</p>
    <a class="btn pri" href="${FAMILY_URL}">Open the ${CLUB.short} app</a><div style="height:8px"></div><button class="btn" data-act="signout" style="width:100%">Sign out</button>`; return; }
  if (mode === "forgot") { g.innerHTML = `<p style="margin:0 0 8px;font-size:14.5px;font-weight:600">Forgot your password?</p>
    <p style="margin:0 0 16px;font-size:13.5px;color:var(--ink-2)">No stress — message ${CLUB.short} and an admin sends you a fresh code. When it arrives, tap “I have a code” and pick a new password.</p>
    <a class="btn pri" style="width:100%" href="https://wa.me/${CLUB.wa}?text=${encodeURIComponent(CLUB.greet + ", I forgot my " + CLUB.hq + " password. My email is: ")}" target="_blank" rel="noopener">WhatsApp ${CLUB.short} for a reset code</a>
    <div style="height:8px"></div>
    <button class="btn" style="width:100%" data-g="toActivate">I have a code</button>
    <p style="text-align:center;margin:14px 0 0"><button type="button" class="glink" data-g="toSignin">Back to sign in</button></p>`; return; }
  if (mode === "join") { g.innerHTML = `<form id="gform" data-g="join">
    <p style="margin:0 0 8px;font-size:14.5px;font-weight:600">Welcome to the ${CLUB.short} coaching staff 👋</p>
    <p style="margin:0 0 16px;font-size:13.5px;color:var(--ink-2)">Fill in your details once and you're in. The ${CLUB.check.abbr} number comes from ${CLUB.check.authority}.</p>
    <div class="gerr">${esc(err || "")}</div>
    <div class="f"><label>Full name</label><input name="name" required autocomplete="name"></div>
    <div class="f"><label>Mobile</label><input name="phone" inputmode="tel" required autocomplete="tel"></div>
    <div class="f"><label>Email (your sign-in)</label><input name="email" type="email" required autocomplete="email"></div>
    <div class="f"><label>${CLUB.check.abbr} number</label><input name="wwcc_no" placeholder="${CLUB.check.placeholder}"></div>
    <div class="f"><label>${CLUB.check.abbr} expiry</label><input name="wwcc_exp" type="date"></div>
    <div class="f"><label>Choose a password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn pri">Save my details and go in</button>
    <p style="text-align:center;margin:14px 0 0"><button type="button" class="glink" data-g="toSignin">I already have an account</button></p></form>`; return; }
  if (mode === "welcome") { g.innerHTML = `<form id="gform" data-g="welcome">
    <p style="margin:0 0 8px;font-size:14.5px;font-weight:600">Welcome to ${CLUB.hq} 👋</p>
    <p style="margin:0 0 16px;font-size:13.5px;color:var(--ink-2)">One step and you're in: pick a password. Next time you open the app it's just your email and this password.</p>
    <div class="gerr">${esc(err || "")}</div>
    <div class="f"><label>Choose a password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn pri">Set my password and go in</button>
    <p style="text-align:center;margin:14px 0 0"><button type="button" class="glink" data-g="toSignin">I already have a password</button></p></form>`; return; }
  if (mode === "activate") { g.innerHTML = `<form id="gform" data-g="activate">
    <div class="gerr">${esc(err || "")}</div>
    <div class="f"><label>Email</label><input name="email" type="email" required autocomplete="username"></div>
    <div class="f"><label>Code from ${CLUB.short}</label><input name="code" required autocomplete="one-time-code" style="text-transform:uppercase"></div>
    <div class="f"><label>Choose a password (8+ characters)</label><input name="password" type="password" minlength="8" required autocomplete="new-password"></div>
    <button class="btn pri">Set password and sign in</button>
    <p style="text-align:center;margin:14px 0 0"><button type="button" class="glink" data-g="toSignin">Back to sign in</button></p></form>`; return; }
  g.innerHTML = `<form id="gform" data-g="signin">
    <div class="gerr">${esc(err || "")}</div>
    <div class="f"><label>Email</label><input name="email" type="email" required autocomplete="username"></div>
    <div class="f"><label>Password</label><input name="password" type="password" required autocomplete="current-password"></div>
    <button class="btn pri">Sign in</button>
    <p style="text-align:center;margin:14px 0 0;display:flex;justify-content:space-between"><button type="button" class="glink" data-g="toActivate">I have a code</button><button type="button" class="glink" data-g="toForgot">Forgot password?</button></p></form>`;
}
document.addEventListener("click", e => { const b = e.target.closest("[data-g]"); if (!b || b.tagName === "FORM") return;
  if (b.dataset.g === "toActivate") gate("activate"); if (b.dataset.g === "toSignin") { WELCOME = null; JOIN = null; gate("signin"); } if (b.dataset.g === "toForgot") gate("forgot"); });
document.addEventListener("submit", async e => {
  const f = e.target; if (!f.dataset.g) return; e.preventDefault();
  const v = Object.fromEntries(new FormData(f).entries());
  f.querySelector("button.pri").disabled = true;
  if (f.dataset.g === "join") {
    const r = await fetch(`${SUPA_URL}/functions/v1/join`, {method:"POST", headers:{"Content-Type":"application/json", apikey:SUPA_KEY}, body:JSON.stringify({...v, token:JOIN})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { gate("join", j.error || "That didn't work"); return; }
    JOIN = null;
    const { error } = await sb.auth.signInWithPassword({email:j.email, password:v.password});
    if (error) { gate("signin", error.message); return; }
    boot(); return;
  }
  if (f.dataset.g === "welcome") {
    const r = await fetch(`${SUPA_URL}/functions/v1/setup`, {method:"POST", headers:{"Content-Type":"application/json", apikey:SUPA_KEY}, body:JSON.stringify({token:WELCOME, password:v.password})});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { gate("welcome", j.error || "That didn't work"); return; }
    if (!["admin","coach"].includes(j.role)) { gate("signin", "That link is for the family app: " + FAMILY_URL); return; }
    WELCOME = null;
    const { error } = await sb.auth.signInWithPassword({email:j.email, password:v.password});
    if (error) { gate("signin", error.message); return; }
    boot(); return;
  }
  if (f.dataset.g === "activate") {
    const r = await fetch(`${SUPA_URL}/functions/v1/activate`, {method:"POST", headers:{"Content-Type":"application/json", apikey:SUPA_KEY}, body:JSON.stringify(v)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { gate("activate", j.error || "That didn't work"); return; }
    if (!["admin","coach"].includes(j.role)) { gate("signin", "That code is for the family app: " + FAMILY_URL); return; }
  }
  const { error } = await sb.auth.signInWithPassword({email:v.email, password:v.password});
  if (error) { gate(f.dataset.g === "activate" ? "signin" : "signin", error.message === "Invalid login credentials" ? "Wrong email or password." : error.message); return; }
  boot();
});

/* ---------- boot ---------- */
// A welcome link (<staff url>/#welcome=TOKEN) skips the whole gate:
// the token is lifted out of the URL before anything else sees it.
let WELCOME = null, JOIN = null;
{ const m = location.hash.match(/^#welcome=([A-Za-z0-9_-]{16,64})$/); if (m) { WELCOME = m[1]; history.replaceState(null, "", location.pathname + location.search); } }
{ const m = location.hash.match(/^#join=([A-Za-z0-9_-]{16,64})$/); if (m) { JOIN = m[1]; history.replaceState(null, "", location.pathname + location.search); } }
async function boot(){
  if (WELCOME) { $("#loading").hidden = true; gate("welcome"); return; }
  if (JOIN) { $("#loading").hidden = true; gate("join"); return; }
  $("#gate").hidden = true; $("#loading").hidden = false;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { gate("signin"); return; }
  const { data: prof, error } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (error || !prof) { gate("signin", "Couldn't load your profile. Try again."); return; }
  ME = prof;
  if (!["admin","coach"].includes(ME.role)) { gate("wrongApp"); return; }
  try { await fetchAll(); } catch (e) { console.error(e); gate("signin", "Couldn't load the club data: " + e.message); return; }
  $("#loading").hidden = true; $("#shell").hidden = false;
  VIEW.r = parseHash(); render(); startRealtime();
}
boot();
</script>
</body>
