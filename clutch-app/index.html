<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0A08">
<title>Clutch</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --disp:"Big Shoulders Display","IBM Plex Sans",sans-serif;
  color-scheme:dark;
  --bg:#0B0A08; --panel:#16130F; --panel-2:#1C1813; --hover:#241E17;
  --line:rgba(255,240,220,.08); --line-2:rgba(255,240,220,.16);
  --ink:#F6F1E9; --ink-2:#BAB1A4; --muted:#8B8175;
  --accent:#FF8A1E; --accent-2:#E36F00; --accent-ink:#1A0C00; --accent-wash:rgba(255,138,30,.13); --accent-line:rgba(255,138,30,.4);
  --good:#46C272; --warn:#F2B01E; --crit:#F2584B;
  --good-wash:rgba(70,194,114,.13); --warn-wash:rgba(242,176,30,.13); --crit-wash:rgba(242,88,75,.13);
  --shadow:0 24px 60px -20px rgba(0,0,0,.75);
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
svg{display:block}
.mono{font-family:var(--mono)} .muted{color:var(--muted)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
[hidden]{display:none!important}

main{max-width:640px;margin:0 auto;padding:16px 16px calc(86px + env(safe-area-inset-bottom))}
.apptop{position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.apptop .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px;padding:10px 16px}
.apptop img{width:36px;height:36px;object-fit:contain}
.apptop b{font:800 24px/1 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.apptop .r{margin-left:auto;font:500 11.5px var(--mono);color:var(--muted);text-align:right}

.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:color-mix(in srgb,#131109 94%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom))}
.tabbar .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tabbar a{display:flex;flex-direction:column;align-items:center;gap:3px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600;padding:4px 0;position:relative}
.tabbar a svg{width:22px;height:22px}
.tabbar a.on{color:var(--accent)}
.tabbar .ct{position:absolute;top:-2px;left:calc(50% + 7px);font:600 10px var(--mono);background:var(--accent);color:var(--accent-ink);border-radius:9px;padding:0 5px}

h1.pg{margin:14px 0 4px;font:800 34px/0.95 var(--disp);text-transform:uppercase}
.pgsub{color:var(--ink-2);font-size:13.5px;margin-bottom:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:14px}
.card h2{margin:0 0 10px;font-size:14.5px;font-weight:600}
.btn{min-height:40px;padding:8px 14px;border-radius:10px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;font-size:14px;font-weight:500;text-decoration:none;color:var(--ink)}
.btn:hover{background:var(--hover)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.pri:hover{background:var(--accent-2)}
.btn.sm{min-height:32px;padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn svg{width:16px;height:16px}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;border-radius:6px;font-size:12px;border:1px solid var(--line-2);color:var(--ink-2)}
.chip.acc{border-color:var(--accent-line);color:var(--accent);background:var(--accent-wash)}
.chip.warn{border-color:transparent;color:var(--warn);background:var(--warn-wash)}
.chip.good{border-color:transparent;color:var(--good);background:var(--good-wash)}
.chip.crit{border-color:transparent;color:var(--crit);background:var(--crit-wash)}
.seg{display:flex;border:1px solid var(--line-2);border-radius:10px;overflow:hidden;background:var(--panel);margin-bottom:14px}
.seg button{flex:1;border:0;background:none;min-height:38px;cursor:pointer;font-size:13.5px;color:var(--ink-2)}
.seg button.on{background:var(--accent-wash);color:var(--accent);font-weight:700}
.seg button+button{border-left:1px solid var(--line)}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:13.5px;font-weight:500;z-index:60;box-shadow:var(--shadow);max-width:90vw;text-align:center}
.av{border-radius:10px;display:grid;place-items:center;font-weight:700;background:var(--accent-wash);color:var(--accent);border:1px solid var(--accent-line);flex:none;overflow:hidden}
.av img{width:100%;height:100%;object-fit:cover}
.wl{display:inline-flex;gap:3px;vertical-align:middle}
.wl i{width:17px;height:17px;border-radius:4px;display:grid;place-items:center;font:700 10px var(--mono);color:#fff;font-style:normal}
.wl i.w{background:var(--good)} .wl i.l{background:var(--crit)} .wl i.d{background:var(--line-2);color:var(--ink-2)}
.tog{display:inline-flex;border:1px solid var(--line-2);border-radius:9px;overflow:hidden;flex:none}
.tog button{border:0;background:none;min-height:36px;min-width:52px;padding:0 12px;cursor:pointer;font-size:13px;font-weight:600;color:var(--ink-2)}
.tog button+button{border-left:1px solid var(--line)}
.tog button.on.in{background:var(--good-wash);color:var(--good)}
.tog button.on.out{background:var(--crit-wash);color:var(--crit)}
.row{display:flex;align-items:center;gap:12px}
.spread{justify-content:space-between}
.list>*+*{border-top:1px solid var(--line)}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:8px 16px;margin:0;font-size:14px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0}
.f{margin-bottom:12px}
.f label{display:block;font-size:12.5px;color:var(--ink-2);font-weight:500;margin-bottom:5px}
.f input,.f select,.f textarea{width:100%;min-height:44px;border:1px solid var(--line-2);border-radius:10px;background:var(--panel-2);padding:10px 12px;font-size:15px}
.f textarea{min-height:80px;resize:vertical}

/* gate */
.gate{position:fixed;inset:0;z-index:50;overflow:auto;background:
  radial-gradient(900px 500px at 50% -10%,rgba(255,138,30,.22),transparent 60%),
  var(--bg)}
.gate .court{position:fixed;inset:0;pointer-events:none;opacity:.06}
.gwrap{min-height:100%;display:grid;place-items:center;padding:28px 20px}
.gbox{width:min(420px,100%);text-align:center}
.gbox .logo{width:150px;height:150px;object-fit:contain;margin:0 auto;filter:drop-shadow(0 18px 40px rgba(255,138,30,.25))}
.gbox h1{margin:6px 0 0;font:900 56px/0.95 var(--disp);text-transform:uppercase}
.gbox .tag{color:var(--ink-2);font-size:14px;margin:8px 0 24px}
.pick{display:grid;gap:12px;text-align:left}
.pick button{display:flex;gap:14px;align-items:center;border:1px solid var(--line-2);background:var(--panel);border-radius:16px;padding:16px;cursor:pointer}
.pick button:hover{border-color:var(--accent-line)}
.pick .ic{width:52px;height:52px;border-radius:14px;background:var(--accent-wash);border:1px solid var(--accent-line);display:grid;place-items:center;color:var(--accent);flex:none}
.pick .ic svg{width:26px;height:26px}
.pick b{display:block;font:800 22px/1 var(--disp);text-transform:uppercase}
.pick span{display:block;color:var(--ink-2);font-size:13px;margin-top:4px}
.gcard{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;text-align:left}
.gerr{color:var(--crit);font-size:13px;min-height:1.2em;margin-bottom:10px}
.glink{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13.5px;padding:0}
.gback{margin-top:16px}
/* kid code screen */
.kidcode{ text-align:center }
.kidcode h2{font:900 34px/1 var(--disp);text-transform:uppercase;margin:0 0 6px}
.kidcode p{color:var(--ink-2);font-size:14px;margin:0 0 18px}
.codebox{display:flex;gap:8px;justify-content:center;margin-bottom:18px}
.codebox input{width:46px;height:58px;text-align:center;font:700 26px var(--mono);border:2px solid var(--line-2);border-radius:12px;background:var(--panel-2);color:var(--ink)}
.codebox input:focus{border-color:var(--accent);outline:none}
.bounce{animation:bounce 2.4s ease-in-out infinite}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}

/* kid hero */
.hero{position:relative;border-radius:18px;overflow:hidden;border:1px solid var(--accent-line);background:
  radial-gradient(600px 300px at 80% -20%,rgba(255,138,30,.35),transparent 60%),
  linear-gradient(160deg,#1E1710,#0F0C08);padding:20px;margin-bottom:14px}
.hero .row1{display:flex;gap:16px;align-items:center}
.hero .av{width:84px;height:84px;border-radius:18px;font-size:28px}
.hero h1{margin:0;font:900 40px/0.9 var(--disp);text-transform:uppercase}
.hero .sub{color:var(--ink-2);font-size:13.5px;margin-top:4px}
.hero .no{position:absolute;top:6px;right:14px;font:900 84px/1 var(--disp);color:rgba(255,138,30,.16)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}
.stat{background:rgba(0,0,0,.25);border:1px solid var(--line);border-radius:12px;padding:10px 8px;text-align:center}
.stat b{display:block;font:800 24px/1 var(--disp);color:var(--accent)}
.stat span{display:block;font-size:10.5px;color:var(--ink-2);margin-top:3px;text-transform:uppercase;letter-spacing:.05em;font-weight:600}
.count{display:flex;align-items:center;gap:12px;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:12px 16px;margin-top:14px;font-weight:700}
.count b{font:900 30px/1 var(--disp)}
.count svg{width:22px;height:22px}

/* sessions */
.sessrow{display:grid;grid-template-columns:52px 1fr auto;gap:12px;padding:12px 0;align-items:center}
.sessrow .d{ text-align:center }
.sessrow .d b{display:block;font:800 20px/1 var(--disp)}
.sessrow .d span{display:block;font:600 10.5px var(--mono);color:var(--muted);text-transform:uppercase}
.sessrow .t{min-width:0}
.sessrow .t b{display:block;font-size:14.5px}
.sessrow .t small{display:block;color:var(--muted);font-size:12.5px;margin-top:1px}
.score{font:800 20px var(--disp)}

/* chat */
.convbtn{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;padding:13px 0;cursor:pointer}
.convbtn .av{width:44px;height:44px;font-size:15px}
.convbtn b{display:block;font-size:14.5px}
.convbtn small{display:block;color:var(--muted);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:56vw}
.convbtn .dot{margin-left:auto;width:9px;height:9px;border-radius:50%;background:var(--accent);flex:none}
.thread{display:flex;flex-direction:column;height:calc(100dvh - 220px);min-height:320px}
.tmsgs{flex:1;overflow:auto;display:flex;flex-direction:column;gap:10px;padding:4px 0 12px}
.bubble{max-width:82%;border-radius:14px;padding:9px 13px;font-size:14.5px;line-height:1.45;background:var(--panel);border:1px solid var(--line);align-self:flex-start;white-space:pre-wrap;word-break:break-word}
.bubble.me{align-self:flex-end;background:var(--accent-wash);border-color:var(--accent-line)}
.bubble .who{font:600 11px var(--mono);color:var(--accent);margin-bottom:2px}
.bubble .when{font:400 10.5px var(--mono);color:var(--muted);margin-top:3px}
.tcomp{display:flex;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.tcomp textarea{flex:1;min-height:44px;max-height:110px;border:1px solid var(--line-2);border-radius:12px;background:var(--panel);padding:11px 13px;font-size:15px;resize:none}

/* board */
.postcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.postcard .hd{display:flex;gap:10px;align-items:center}
.postcard .hd .av{width:38px;height:38px;font-size:13px}
.postcard .hd b{font-size:14px}
.postcard .body{margin:10px 0 8px;font-size:14.5px;white-space:pre-wrap;word-break:break-word}
.meta{display:flex;gap:16px;align-items:center;color:var(--muted);font-size:13px}
.meta button{background:none;border:0;color:var(--muted);cursor:pointer;font-size:13px;display:inline-flex;gap:5px;align-items:center;padding:4px 0}
.meta button.on{color:var(--accent)}
.meta button svg{width:17px;height:17px}
.cmt{display:grid;grid-template-columns:28px 1fr;gap:9px;padding:9px 0 0;font-size:13.5px}
.cmt .av{width:28px;height:28px;font-size:10px;border-radius:8px}
.cmt b{font-weight:600}
.gal{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.gal .gi{position:relative;border-radius:12px;overflow:hidden;border:1px solid var(--line);aspect-ratio:1;background:var(--panel-2)}
.gal img,.gal video{width:100%;height:100%;object-fit:cover;display:block}
.gal .cap{position:absolute;left:0;right:0;bottom:0;padding:16px 8px 6px;font-size:11px;color:#fff;background:linear-gradient(transparent,rgba(0,0,0,.72))}
.gal .pend{position:absolute;top:6px;left:6px}
.rules{font-size:13px;color:var(--ink-2);background:var(--panel-2);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:14px}
.bigcode{font:700 34px/1 var(--mono);letter-spacing:.2em;text-align:center;background:var(--panel-2);border:1px dashed var(--accent-line);border-radius:14px;padding:18px 8px;margin:12px 0;user-select:all}
.loading{position:fixed;inset:0;z-index:70;background:var(--bg);display:grid;place-items:center}
.loading img{width:96px;height:96px;object-fit:contain;animation:bounce 1.2s ease-in-out infinite}
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:40}
.sheet{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(560px,100%);max-height:86dvh;overflow:auto;background:var(--panel);border:1px solid var(--line-2);border-radius:18px 18px 0 0;z-index:41;padding:20px 18px calc(20px + env(safe-area-inset-bottom))}
.sheet h2{margin:0 0 4px;font:800 26px/1 var(--disp);text-transform:uppercase}
.sheet .sub{color:var(--ink-2);font-size:13px;margin-bottom:14px}
</style>
</head>
<body>
<div class="loading" id="loading"><img src="logo.png" alt=""></div>
<div class="gate" id="gate" hidden>
  <svg class="court" viewBox="0 0 400 800" preserveAspectRatio="xMidYMid slice"><g fill="none" stroke="#FF8A1E" stroke-width="2"><circle cx="200" cy="400" r="60"/><path d="M0 400h400M0 40h400M120 40v120a80 80 0 0 0 160 0V40M120 760v-120a80 80 0 0 1 160 0v120M0 760h400"/></g></svg>
  <div class="gwrap"><div class="gbox" id="gbox"></div></div>
</div>

<header class="apptop" id="apptop" hidden><div class="in"><img src="logo.png" alt=""><b>Clutch</b><div class="r" id="whoami"></div></div></header>
<main id="main" hidden></main>
<nav class="tabbar" id="tabbar" hidden><div class="in" id="tabin"></div></nav>
<div class="scrim" id="scrim" hidden data-act="closeSheet"></div>
<div class="sheet" id="sheet" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script>

/* ---------- data ---------- */
async function q(table, sel, order){ let x = sb.from(table).select(sel || "*"); if (order) x = x.order(order.c, {ascending:order.a !== false}); const { data, error } = await x.limit(5000); if (error) throw new Error(table + ": " + error.message); return data || []; }
async function fetchAll(){
  const wantMoney = !isKid();
  const [org, venues, teams, players, guardians, fixtures, avail, roll, stats, notices, posts, comments, likes, media, convs, payments, instalments, logs] = await Promise.all([
    q("org_settings"), q("venues"), q("teams"), q("players", "*", {c:"dob"}), q("guardians"),
    q("fixtures", "*", {c:"date"}), q("availability"), q("roll"), q("game_stats"),
    q("notices", "*", {c:"created_at", a:false}), q("posts", "*", {c:"created_at", a:false}),
    q("comments", "*", {c:"created_at"}), q("post_likes"), q("media", "*", {c:"created_at", a:false}),
    q("conversations"),
    wantMoney ? q("payments") : Promise.resolve([]), wantMoney ? q("instalments", "*", {c:"due"}) : Promise.resolve([]),
    q("player_log", "*", {c:"on_date", a:false}),
  ]);
  D = {org:org[0], venues, teams, players:players.filter(p => p.status === "active"), guardians, fixtures, stats, notices, posts, comments, likes, media, convs, payments, instalments, logs, avail:{}, roll:{}, msgs:{}, reads:{}};
  avail.forEach(r => { (D.avail[r.session_key] = D.avail[r.session_key] || {})[r.player_id] = r.status; });
  roll.forEach(r => { (D.roll[r.session_key] = D.roll[r.session_key] || {})[r.player_id] = r.present; });
  try { (await q("conversation_reads")).forEach(r => { if (r.profile_id === ME.id) D.reads[r.conversation_id] = r.last_read_at; }); } catch (e) {}
  KID = ME.player_id ? D.players.find(p => p.id === ME.player_id) : null;
}
const team = id => D.teams.find(t => t.id === id);
const venue = id => D.venues.find(v => v.id === id);
const tname = t => t ? `${t.age} ${t.div}` : "Training squad";
const pname = p => p.first_name + " " + p.last_name;
const myKids = () => isKid() ? (KID ? [KID] : []) : D.players;
const myTeams = () => [...new Set(myKids().map(p => p.team_id).filter(Boolean))].map(team).filter(Boolean);
const payTotal = p => D.payments.filter(x => x.player_id === p.id).reduce((s,x) => s + +x.amount, 0);
const feeOf = p => { const t = team(p.team_id); return t ? +t.fee : 0; };
const owing = p => Math.max(0, feeOf(p) - payTotal(p));
const statsOf = p => { const S = D.stats.filter(s => s.player_id === p.id); const pts = S.reduce((x,s) => x + s.points, 0); return {games:S.length, pts, ppg:S.length ? pts/S.length : 0}; };
const attOf = p => { let n = 0, here = 0; for (const k in D.roll) { const v = D.roll[k][p.id]; if (v !== undefined) { n++; if (v) here++; } } return {n, here, pct:n ? here/n : null}; };
function last5(tid){ return D.fixtures.filter(f => f.team_id === tid && f.us != null).sort((a,b) => b.date.localeCompare(a.date)).slice(0,5); }
const wlChips = tid => { const L = last5(tid); return L.length ? `<span class="wl">${L.slice().reverse().map(f => { const x = f.us > f.them ? "w" : f.us < f.them ? "l" : "d"; return `<i class="${x}">${x.toUpperCase()}</i>`; }).join("")}</span>` : '<span class="muted">no games yet</span>'; };
async function signedUrl(path, bucket = "avatars"){
  const key = bucket + ":" + path;
  if (SIGNED[key]) return SIGNED[key];
  const { data } = await sb.storage.from(bucket).createSignedUrl(path, 3600);
  if (data && data.signedUrl) { SIGNED[key] = data.signedUrl; return data.signedUrl; }
  return null;
}
function avatar(p, size){
  const key = "avatars:" + p.photo_path;
  if (p.photo_path && SIGNED[key]) return `<div class="av" style="width:${size}px;height:${size}px"><img src="${SIGNED[key]}" alt=""></div>`;
  if (p.photo_path) signedUrl(p.photo_path).then(u => { if (u) render(); });
  return `<div class="av" style="width:${size}px;height:${size}px;font-size:${Math.round(size/2.6)}px">${initials(pname(p))}</div>`;
}
function familySessions(fromD, toD){
  const out = [];
  myTeams().forEach(t => {
    let M = monday(fromD);
    while (M <= toD) {
      (t.train || []).forEach((s,i) => { const date = addD(M, s.dow - 1);
        if (date >= fromD && date <= toD && date >= (D.org.season.start || date) && date <= (D.org.season.end || date) && !(t.created && date < t.created))
          out.push({key:`${t.id}|${date}|T${i}`, team:t.id, type:"T", date, start:s.start, end:s.end, venue:s.venue, court:s.court}); });
      M = addD(M, 7);
    }
    D.fixtures.filter(f => f.team_id === t.id && f.date >= fromD && f.date <= toD).forEach(f => out.push({key:`${t.id}|${f.date}|G`, team:t.id, type:"G", date:f.date, start:f.time, end:mt(tm(f.time)+50), venue:f.venue_id, court:f.court, opp:f.opp, fx:f}));
  });
  return out.sort((a,b) => a.date.localeCompare(b.date) || tm(a.start) - tm(b.start));
}
const isPastS = s => { const T = todayISO(); return s.date < T || (s.date === T && tm(s.end) <= new Date().getHours()*60 + new Date().getMinutes()); };
const nextGame = tid => D.fixtures.filter(f => f.team_id === tid && f.date >= todayISO() && f.us == null).sort((a,b) => a.date.localeCompare(b.date))[0];

  const tabs = [["home","Home",I.home],["sched","Schedule",I.cal],["chat","Chat",I.chat],["club","Club",I.club],["more","More",I.more]];
  $("#tabin").innerHTML = tabs.map(([k,l,i]) => `<a href="#/${k}" class="${VIEW.r === k ? "on" : ""}">${i}${l}${k === "chat" && unread ? `<span class="ct">${unread}</span>` : ""}</a>`).join("");
  $("#whoami").innerHTML = isKid() ? `${esc(KID ? KID.first_name : "")}<br>player` : `${esc(ME.full_name.split(" ")[0])}<br>parent`;
}
function parseHash(){ const h = location.hash.replace(/^#\/?/, "").split("/")[0]; return ["home","sched","chat","club","more"].includes(h) ? h : "home"; }
addEventListener("hashchange", () => { if (!D) return; VIEW.r = parseHash(); VIEW.conv = null; render(); scrollTo(0,0);
  if (VIEW.r === "club") refreshClub();
  if (VIEW.r === "chat") (async () => { try { const c = await q("conversations"); D.convs = c; render(); } catch (e) {} })(); });
function render(){
  if (!D || !ME) return;
  shell();
  $("#main").innerHTML = {home:vHome, sched:vSched, chat:vChat, club:vClub, more:vMore}[VIEW.r]();

/* ---------- chat ---------- */
async function ensureConvs(){
  const fid = myKids()[0] ? myKids()[0].family_id : (ME.guardian_id ? (D.guardians.find(g => g.id === ME.guardian_id) || {}).family_id : null);
  if (!fid) return;
  const want = [["family", null]];
  if (!isKid()) want.push(["club", null]);
  myTeams().forEach(t => { if (!isKid() || (KID && KID.team_id === t.id)) want.push(["coach", t.id]); });
  for (const [kind, tid] of want) {
    const have = D.convs.find(c => c.kind === kind && c.family_id === fid && (kind !== "coach" || c.team_id === tid));
    if (!have) { try { const { data } = await sb.rpc("open_conversation", {p_kind:kind, p_family:fid, p_team:tid}); if (data) { const { data: c } = await sb.from("conversations").select("*").eq("id", data).single(); if (c) D.convs.push(c); } } catch (e) {} }
  }
}
function convTitle(c){
  if (c.kind === "family") return "Family chat";
  if (c.kind === "club") return "Clutch admins";
  const t = team(c.team_id); return "Coach · " + (t ? tname(t) : "team");
}
function convSub(c){

  shareCard:() => run(async () => { const p = KID, t = team(p.team_id), st = statsOf(p);

  const f = Object.fromEntries(new FormData(el).entries());

function shrink(file, max){ return new Promise(res => { const img = new Image(); img.onload = () => { const k = Math.min(1, max / Math.max(img.width, img.height));
  const c = document.createElement("canvas"); c.width = Math.round(img.width*k); c.height = Math.round(img.height*k);
  c.getContext("2d").drawImage(img, 0, 0, c.width, c.height); c.toBlob(b => res(b), "image/jpeg", .86); }; img.src = URL.createObjectURL(file); }); }
function uploadAvatar(pid, file){ run(async () => {
  const blob = await shrink(file, 512); const path = `players/${pid}.jpg`;
  const { error } = await sb.storage.from("avatars").upload(path, blob, {upsert:true, contentType:"image/jpeg"}); if (error) throw error;
  const { error: e2 } = await sb.rpc("set_player_profile", {p_player:pid, p_photo:path, p_socials:null, p_phone:null}); if (e2) throw e2;
  D.players.find(p => p.id === pid).photo_path = path; delete SIGNED["avatars:" + path]; render(); toast("Photo saved"); }); }
function uploadMedia(file){ run(async () => {
  const isVideo = file.type.startsWith("video");
  if (file.size > 50*1024*1024) { toast("Keep clips under 50MB"); return; }
  const blob = isVideo ? file : await shrink(file, 1600);
  const path = `gallery/${Date.now()}-${Math.random().toString(36).slice(2,8)}${isVideo ? ".mp4" : ".jpg"}`;
  const { error } = await sb.storage.from("media").upload(path, blob, {contentType:isVideo ? file.type : "image/jpeg"}); if (error) throw error;
  const { data, error: e2 } = await sb.from("media").insert({path, kind:isVideo ? "video" : "image", caption:""}).select().single(); if (e2) throw e2;
  D.media.unshift(data); render(); toast("Sent — an admin approves it before the club sees it"); }); }

function markRead(cid){ D.reads[cid] = new Date().toISOString(); sb.from("conversation_reads").upsert({conversation_id:cid, profile_id:ME.id, last_read_at:D.reads[cid]}).then(() => shell()); }
function startRealtime(){
  sb.channel("family")
    .on("postgres_changes", {event:"INSERT", schema:"public", table:"messages"}, pl => { const m = pl.new;
      if (D.msgs[m.conversation_id] && !D.msgs[m.conversation_id].some(x => x.id === m.id)) D.msgs[m.conversation_id].push(m);
      const c = D.convs.find(x => x.id === m.conversation_id);
      if (c) { c.last_message_at = m.created_at; c.last_preview = m.body.slice(0,120); if (VIEW.conv === m.conversation_id) markRead(c.id); }
      render(); })
    .on("postgres_changes", {event:"*", schema:"public", table:"posts"}, () => refreshClub())
    .on("postgres_changes", {event:"*", schema:"public", table:"comments"}, () => refreshClub())
    .on("postgres_changes", {event:"*", schema:"public", table:"media"}, () => refreshClub())
    .subscribe();
}
let clubT = null;
function refreshClub(){ clearTimeout(clubT); clubT = setTimeout(async () => {
  try { const [p, c, m, l] = await Promise.all([q("posts", "*", {c:"created_at", a:false}), q("comments", "*", {c:"created_at"}), q("media", "*", {c:"created_at", a:false}), q("post_likes")]);
    D.posts = p; D.comments = c; D.media = m; D.likes = l; render(); } catch (e) {} }, 400); }

    const j = await r.json().catch(() => ({}));
    if (!r.ok) { gate("join", j.error || "That didn't work."); return; }
    JOIN = null;
    const { error } = await sb.auth.signInWithPassword({email:j.email, password:v.password});
    if (error) { gate("signin", error.message); return; }
    boot(); return;
  }
  if (f.dataset.g === "activate") {
    const r = await fetch(`${SUPA_URL}/functions/v1/activate`, {method:"POST", headers:{"Content-Type":"application/json", apikey:SUPA_KEY}, body:JSON.stringify(v)});
    const j = await r.json().catch(() => ({}));
    if (!r.ok) { gate("activate", j.error || "That didn't work."); return; }
    if (!["parent"].includes(j.role)) { gate("signin", "That code is a staff code — use clutch-hq.netlify.app instead."); return; }
  }
  const { error } = await sb.auth.signInWithPassword({email:v.email, password:v.password});
  if (error) { gate("signin", error.message === "Invalid login credentials" ? "Wrong email or password." : error.message); return; }
  boot();
});

/* ---------- boot ---------- */
// A family invite link (clutch-basketball.netlify.app/#join=TOKEN): the parent
// fills in their own details. The token is lifted out of the URL first.
let JOIN = null;
{ const m = location.hash.match(/^#join=([A-Za-z0-9_-]{16,64})$/); if (m) { JOIN = m[1]; history.replaceState(null, "", location.pathname + location.search); } }
async function boot(){
  if (JOIN) { $("#loading").hidden = true; gate("join"); return; }
  $("#gate").hidden = true; $("#loading").hidden = false;
  const { data: { session } } = await sb.auth.getSession();
  if (!session) { gate("pick"); return; }
  const { data: prof } = await sb.from("profiles").select("*").eq("id", session.user.id).single();
  if (!prof) { gate("pick", ""); return; }
  ME = prof;
  if (["admin","coach"].includes(ME.role)) { $("#loading").hidden = true; $("#gate").hidden = false;
    $("#gbox").innerHTML = `<img class="logo" src="logo.png" alt=""><h1>Clutch</h1><div class="tag">This is the family app — staff sign in at</div>
    <a class="btn pri" href="https://clutch-hq.netlify.app">clutch-hq.netlify.app</a><div style="height:10px"></div><button class="btn" data-act="signout">Sign out</button>`; return; }
  if (ME.role === "pending") { $("#loading").hidden = true; gate("pick"); toast("This account isn't linked to a family yet — ask Clutch for a code."); return; }
  try { await fetchAll(); await ensureConvs(); } catch (e) { console.error(e); $("#loading").hidden = true; gate("pick", "Couldn't load: " + e.message); return; }
  $("#loading").hidden = true; $("#apptop").hidden = false; $("#main").hidden = false; $("#tabbar").hidden = false;
  VIEW.r = parseHash(); render(); startRealtime();
}
if ("serviceWorker" in navigator) { addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
boot();
</script>
