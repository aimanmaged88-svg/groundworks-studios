# Netlify config for this monorepo.
# Each Sonics site deploys from its own folder; swap `publish` before deploying:
#   southwest-sonics-app      -> southwest-sonics-app.netlify.app  (the club app)
#   southwest-sonics-register -> sonics-register.netlify.app       (public rego form)
#   southwest-sonics-inbox    -> sonics-inbox.netlify.app          (private inbox + functions)
[build]
  publish = "southwest-sonics-site"
  command = ""
