<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0A0E14">
<title>Sonics App — Sydney Southwest Sonics</title>
<meta name="description" content="Member portal + admin control centre for the Sydney Southwest Sonics basketball association. Prototype.">
<link rel="icon" href="logo.png" type="image/png">
<link rel="apple-touch-icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Black&family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0A0E14; --bg2:#070A0F;
  --card:#121A24; --card2:#0E151E; --card3:#172230;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.14);
  --ink:#EEF3F9; --muted:#8B97A7; --dim:#5C6675;
  --green:#16E37F; --green-deep:#0BB866; --green-ink:#052a19;
  --gold:#FFC63D; --amber:#FFB020; --red:#FF5D5D; --blue:#3DA5FF;
  --sky:#3FC5EC; --sky-deep:#1C9BC6; --grad:linear-gradient(120deg,#E7369B,#F5821F,#FCC21A);
  --disp:'Archivo Black','Arial Black',system-ui,sans-serif;
  --sans:'Inter',system-ui,-apple-system,sans-serif;
  --rad:18px; --rad2:20px;
  --shadow:0 20px 60px rgba(0,0,0,.5);
  --maxw:520px;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:var(--sans);background:var(--bg);color:var(--ink);font-size:15px;line-height:1.45;
  overflow:hidden;display:flex;flex-direction:column;
  background-image:radial-gradient(120% 60% at 50% -10%,rgba(63,197,236,.13),transparent 60%);}
button{font-family:var(--sans);cursor:pointer;border:none;background:none;color:inherit}
img{max-width:100%}
::-webkit-scrollbar{width:8px}
::-webkit-scrollbar-thumb{background:#22303f;border-radius:6px}
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
@keyframes pagein{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes pop{0%{transform:scale(.94);opacity:0}100%{transform:scale(1);opacity:1}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
@keyframes shine{0%,60%{transform:translateX(-110%)}90%,100%{transform:translateX(110%)}}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes spinlogo{to{transform:rotate(360deg)}}
@keyframes stamp{to{opacity:1;transform:scale(1) rotate(-2deg)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- demo strip ---- */
.demostrip{flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:8px;
  padding:7px 14px;background:var(--bg2);border-bottom:1px solid var(--line);z-index:50}
.demostrip .dt{font-family:var(--disp);font-size:11px;letter-spacing:2px;color:#6C7A89;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demostrip .dt b{color:#cfd8e2}
.roleswitch{display:inline-flex;background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;flex:0 0 auto}
.roleswitch button{font-size:11px;font-weight:700;letter-spacing:.3px;padding:5px 9px;border-radius:999px;color:var(--muted)}
.roleswitch button.on{background:var(--sky);color:#03202b}

/* ---- app frame ---- */
.app{flex:1 1 auto;display:flex;flex-direction:column;min-height:0;position:relative;max-width:var(--maxw);width:100%;margin:0 auto}
.scroll{flex:1 1 auto;overflow-y:auto;overflow-x:hidden;padding:16px 16px 96px}
.scroll>*{animation:pagein .38s cubic-bezier(.2,.7,.3,1) both}
.scroll>*:nth-child(1){animation-delay:.02s}
.scroll>*:nth-child(2){animation-delay:.06s}
.scroll>*:nth-child(3){animation-delay:.10s}
.scroll>*:nth-child(4){animation-delay:.14s}
.scroll>*:nth-child(5){animation-delay:.18s}
.scroll>*:nth-child(n+6){animation-delay:.22s}

/* ---- topbar ---- */
.topbar{flex:0 0 auto;display:flex;align-items:center;gap:11px;padding:12px 16px;z-index:40;
  border-bottom:1px solid var(--line);background:rgba(10,14,20,.78);
  backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
.logo{width:44px;height:44px;border-radius:50%;flex:0 0 auto;overflow:hidden;display:block}
.logo img{width:100%;height:100%;display:block}
.brandtxt .n{font-family:var(--disp);font-weight:400;letter-spacing:.04em;font-size:15px;line-height:1;text-transform:uppercase}
.brandtxt .s{font-size:9.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted-2,var(--dim));font-weight:700;margin-top:3px}
.topbar .who{margin-left:auto;text-align:right}
.topbar .who .nm{font-size:12.5px;font-weight:700}
.topbar .who .rl{font-size:10px;letter-spacing:1px;text-transform:uppercase;color:var(--sky);font-weight:700}

/* ---- headings ---- */
.h{font-family:var(--disp);font-weight:400;letter-spacing:.02em;font-size:18px;line-height:1.04;text-transform:uppercase;
  color:var(--ink);margin:24px 2px 11px;display:flex;align-items:center;gap:9px}
.h:first-child{margin-top:6px}
.h .pill{margin-left:auto;font-family:var(--sans);font-weight:700;text-transform:uppercase;
  font-size:10px;letter-spacing:.14em;color:var(--dim)}
/* LOTG-style kicker + hero title */
.kicker{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.kicker.sky{color:var(--sky)}
.htitle{font-family:var(--disp);font-weight:400;font-size:29px;line-height:.96;letter-spacing:.2px;
  text-transform:uppercase;margin-top:7px}
.grad{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent}

/* ---- cards ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:14px;box-shadow:var(--shadow)}
.card+.card{margin-top:10px}
.hero{background:linear-gradient(155deg,#14202c,#0d1620);border:1px solid var(--line2);border-radius:var(--rad2);padding:18px;position:relative;overflow:hidden}
.hero:before{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:radial-gradient(circle,rgba(63,197,236,.20),transparent 70%)}

/* KPI grid */
.kpis{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px}
.kpi .v{font-family:var(--disp);font-weight:400;font-size:28px;line-height:1;letter-spacing:.2px;
  animation:pop .34s cubic-bezier(.2,.7,.3,1) both}
.kpi .l{font-size:9.5px;color:var(--muted);margin-top:6px;letter-spacing:.13em;text-transform:uppercase;font-weight:700}
.kpi .sub{font-size:10.5px;margin-top:4px;font-weight:700;letter-spacing:.02em}
.kpi.green .v{color:var(--green)} .kpi.gold .v{color:var(--gold)}
.kpi.red .v{color:var(--red)} .kpi.blue .v{color:var(--blue)}

/* rows */
.row{display:flex;align-items:center;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:none}
.av{width:38px;height:38px;border-radius:11px;flex:0 0 auto;display:grid;place-items:center;font-family:var(--disp);
  font-weight:700;font-size:15px;color:#03202b;background:linear-gradient(150deg,var(--sky),var(--sky-deep))}
.av.g2{background:linear-gradient(150deg,#5AA9FF,#2b6fd0)} .av.g3{background:linear-gradient(150deg,var(--gold),#e0a01f)}
.av.g4{background:linear-gradient(150deg,#C77DFF,#8b47d6)}
.rmain{flex:1 1 auto;min-width:0}
.rmain .t{font-weight:800;font-size:14px;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rmain .m{font-size:11.5px;color:var(--muted);margin-top:3px;font-weight:500}
.rside{flex:0 0 auto;text-align:right;display:flex;flex-direction:column;align-items:flex-end;gap:5px}

/* tags */
.tag{display:inline-flex;align-items:center;gap:5px;font-size:9.5px;font-weight:800;letter-spacing:.08em;
  text-transform:uppercase;padding:5px 10px;border-radius:980px;white-space:nowrap}
.tag.ok{background:rgba(22,227,127,.14);color:var(--green)}
.tag.warn{background:rgba(255,176,32,.15);color:var(--amber)}
.tag.bad{background:rgba(255,93,93,.14);color:var(--red)}
.tag.info{background:rgba(61,165,255,.14);color:var(--blue)}
.tag.mut{background:rgba(255,255,255,.06);color:var(--muted)}
.dot{width:7px;height:7px;border-radius:50%;display:inline-block}
.dot.ok{background:var(--green)} .dot.warn{background:var(--amber)} .dot.mut{background:var(--dim)}
.dot.bad{background:var(--red);animation:pulse 2s ease-in-out infinite}

/* buttons */
.btn{position:relative;overflow:hidden;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  font-weight:800;font-size:13px;letter-spacing:.04em;text-transform:uppercase;
  padding:14px 20px;border-radius:980px;background:var(--sky);color:#03202b;
  transition:transform .12s ease,opacity .12s ease;width:100%}
.btn:active{transform:scale(.97)}
.btn:after{content:"";position:absolute;top:0;bottom:0;width:38%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.42),transparent);
  animation:shine 4.5s ease-in-out infinite}
.btn.gh{background:rgba(255,255,255,.07);color:var(--ink);border:1px solid var(--line2)}
.btn.gh:after{display:none}
.btn.sm{width:auto;padding:8px 14px;font-size:11px;letter-spacing:.06em}
.btn.sm:after{display:none}
.btn{white-space:nowrap}
/* icon system */
.nav button .i svg{width:21px;height:21px;display:block}
.banner .ic svg{width:23px;height:23px}
.av svg{width:19px;height:19px}
.av.soft{background:rgba(63,197,236,.13);color:var(--sky);border:1px solid rgba(63,197,236,.22)}
.btn svg{width:16px;height:16px;flex:0 0 auto}
.btn.gold{background:var(--gold);color:#241a00}
.btn.red{background:rgba(255,93,93,.15);color:var(--red);border:1px solid rgba(255,93,93,.3)}
.btnrow{display:flex;gap:8px;margin-top:12px}

/* schedule slot */
.slot{display:flex;gap:12px;padding:12px;border:1px solid var(--line);border-radius:14px;background:var(--card2);align-items:center}
.slot+.slot{margin-top:9px}
.slot .time{font-family:var(--disp);font-weight:400;font-size:17px;text-align:center;flex:0 0 auto;width:58px;line-height:1.05}
.slot .time span{display:block;font-size:8.5px;color:var(--dim);letter-spacing:.14em;font-weight:800;margin-top:3px}
.slot .info{flex:1 1 auto;min-width:0}
.slot .info .tt{font-family:var(--disp);font-weight:400;font-size:14px;text-transform:uppercase;letter-spacing:.02em;line-height:1.12}
.slot .info .mm{font-size:11.5px;color:var(--muted);margin-top:4px;font-weight:500}
.barleft{width:4px;align-self:stretch;border-radius:4px;background:var(--sky);flex:0 0 auto}
.barleft.game{background:var(--gold)} .barleft.train{background:var(--blue)}

/* bignum banner */
.banner{border-radius:var(--rad2);padding:16px 18px;display:flex;align-items:center;gap:14px}
.banner.yes{background:linear-gradient(150deg,rgba(22,227,127,.16),rgba(22,227,127,.05));border:1px solid rgba(22,227,127,.3)}
.banner.no{background:linear-gradient(150deg,rgba(255,93,93,.14),rgba(255,93,93,.04));border:1px solid rgba(255,93,93,.28)}
.banner .ic{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:24px;flex:0 0 auto}
.banner.yes .ic{background:rgba(22,227,127,.2)} .banner.no .ic{background:rgba(255,93,93,.18)}
.banner .bt{font-family:var(--disp);font-weight:400;font-size:19px;letter-spacing:.01em;text-transform:uppercase;line-height:1.08}
.banner .bm{font-size:12px;color:var(--muted);margin-top:4px;font-weight:500}

/* progress */
.meter{height:8px;border-radius:6px;background:rgba(255,255,255,.08);overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:6px;background:linear-gradient(90deg,var(--sky),var(--gold))}

/* bottom nav */
.nav{position:absolute;left:0;right:0;bottom:0;display:flex;background:rgba(10,14,20,.92);
  backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 6px calc(8px + env(safe-area-inset-bottom));z-index:30}
.nav button{flex:1 1 0;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--dim);font-size:8.5px;
  font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:4px 2px;border-radius:12px}
.nav button .i{font-size:19px;line-height:1}
.nav button.on{color:var(--sky)}

/* login */
.login{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;padding:30px 24px;max-width:var(--maxw);margin:0 auto;width:100%}
.login .biglogo{width:126px;height:126px;margin:0 auto 20px;border-radius:50%;
  box-shadow:0 22px 50px rgba(0,0,0,.45)}
.login .biglogo img{width:100%;height:100%;display:block;animation:spinlogo 18s linear infinite;transform-origin:50% 50%}
.login .biglogo:active img{animation-duration:1.2s}
.login h1{font-family:var(--disp);font-weight:400;font-size:38px;text-align:center;letter-spacing:.02em;
  text-transform:uppercase;line-height:.94}
.login .sub{text-align:center;color:var(--dim);font-size:10.5px;margin-top:9px;letter-spacing:.16em;
  text-transform:uppercase;font-weight:700}
.field{margin-top:14px}
.field label{display:block;font-size:11px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.field input{width:100%;padding:13px 14px;border-radius:12px;background:var(--card2);border:1px solid var(--line2);color:var(--ink);font-size:15px;font-family:var(--sans)}
.field input:focus{outline:none;border-color:var(--green)}
.invite{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-top:16px;display:flex;gap:10px;align-items:center;text-align:left}
.invite:active{transform:scale(.99)}
.muted{color:var(--muted)} .small{font-size:11.5px} .center{text-align:center}
.b-green{color:var(--green)} .b-gold{color:var(--gold)} .b-red{color:var(--red)} .b-sky{color:var(--sky);font-weight:700;cursor:pointer}

/* toast */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:#05130c;color:var(--green);
  border:1px solid var(--green);border-radius:999px;padding:10px 18px;font-size:13px;font-weight:700;z-index:99;
  box-shadow:0 10px 30px -8px rgba(0,0,0,.6);animation:pop .2s both;white-space:nowrap;max-width:90vw}

/* task */
.task{display:flex;gap:11px;padding:11px 4px;border-bottom:1px solid var(--line);align-items:flex-start}
.task:last-child{border-bottom:none}
.chk{width:22px;height:22px;border-radius:7px;border:2px solid var(--line2);flex:0 0 auto;margin-top:1px;display:grid;place-items:center;font-size:13px;color:#04160d}
.chk.done{background:var(--green);border-color:var(--green)}
.task .tt{font-weight:600;font-size:13.5px}
.task.done .tt{text-decoration:line-through;color:var(--muted)}
.task .mm{font-size:11px;color:var(--muted);margin-top:2px}
.segbar{display:flex;background:var(--card2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px;margin:2px 0 14px}
.segbar button{flex:1;font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:9px 6px;border-radius:980px;color:var(--muted)}
.segbar button.on{color:var(--ink)}
.divchip{display:inline-flex;align-items:center;font-family:var(--disp);font-weight:400;font-size:10.5px;letter-spacing:.06em;
  padding:4px 10px;border-radius:980px;background:rgba(255,255,255,.07);color:var(--muted);text-transform:uppercase}
.avirow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.miniav{width:26px;height:26px;border-radius:8px;display:grid;place-items:center;font-size:10px;font-weight:700;color:#03202b;background:linear-gradient(150deg,var(--sky),var(--sky-deep))}
.miniav.out{background:#33404e;color:var(--muted)} .miniav.q{background:#2a3644;color:var(--dim)}
hr.sep{border:none;border-top:1px solid var(--line);margin:14px 0}
.note{background:rgba(61,165,255,.08);border:1px solid rgba(61,165,255,.2);border-radius:12px;padding:11px 13px;font-size:12px;color:#bcd8f5;margin-top:12px}

/* ================== SHEET / DETAIL ================== */
.sheetwrap{position:fixed;inset:0;z-index:200;display:none}
.sheetwrap.on{display:block}
.sheetbg{position:absolute;inset:0;background:rgba(3,6,10,.64);-webkit-backdrop-filter:blur(7px);
  backdrop-filter:blur(7px);opacity:0;transition:opacity .32s var(--ease)}
.sheetwrap.in .sheetbg{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:var(--maxw);margin:0 auto;
  background:linear-gradient(180deg,#151f2c,#0c131c);border-top:1px solid var(--line2);
  border-radius:26px 26px 0 0;box-shadow:0 -24px 70px rgba(0,0,0,.65);
  padding:10px 16px calc(26px + env(safe-area-inset-bottom));
  transform:translateY(102%);transition:transform .46s var(--spring);max-height:90%;overflow-y:auto}
.sheetwrap.in .sheet{transform:none}
.grab{width:44px;height:4px;border-radius:99px;background:rgba(255,255,255,.2);margin:4px auto 16px}
.sh-head{display:flex;align-items:center;gap:13px}
.sh-name{font-family:var(--disp);font-weight:400;font-size:22px;text-transform:uppercase;line-height:1.04}
.sh-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-top:14px}
.sh-item{background:rgba(255,255,255,.04);border:1px solid var(--line);border-radius:14px;padding:11px 12px}
.sh-item .k{font-size:9px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--dim)}
.sh-item .v{font-size:13.5px;font-weight:700;margin-top:5px;letter-spacing:-.01em}
.sh-full{grid-column:1/-1}
input.fld,textarea.fld{width:100%;padding:12px 13px;border-radius:13px;background:var(--card2);
  border:1px solid var(--line2);color:var(--ink);font-family:var(--sans);font-size:14px;resize:none}
input.fld:focus,textarea.fld:focus{outline:none;border-color:var(--sky)}
.audsel{display:flex;gap:6px;flex-wrap:wrap;margin-top:9px}
.audsel button{padding:7px 12px;border-radius:980px;border:1px solid var(--line2);font-size:10px;font-weight:800;
  letter-spacing:.08em;text-transform:uppercase;color:var(--muted);transition:all .28s var(--spring)}
.audsel button.on{background:var(--sky);color:#03202b;border-color:var(--sky)}
/* roll call chips */
.rollrow{display:flex;flex-wrap:wrap;gap:8px}
.rollchip{display:inline-flex;align-items:center;gap:8px;padding:8px 13px;border-radius:980px;
  border:1px solid var(--line2);background:rgba(255,255,255,.04);font-size:12px;font-weight:700;
  color:var(--muted);transition:all .28s var(--spring)}
.rollchip:active{transform:scale(.94)}
.rollchip.on{background:rgba(22,227,127,.15);border-color:rgba(22,227,127,.42);color:var(--green)}
.rollchip .n{min-width:20px;height:20px;padding:0 5px;border-radius:99px;display:grid;place-items:center;
  font-size:10px;background:rgba(255,255,255,.1);font-family:var(--disp);font-weight:400}
.rollchip.on .n{background:rgba(22,227,127,.28)}
/* notice */
.nt{border-left:3px solid var(--sky);padding:2px 0 2px 13px}
.nt .ntt{font-weight:800;font-size:14px;letter-spacing:-.01em}
.nt .ntb{font-size:12.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.nt .ntm{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);margin-top:7px}

/* ================== FLUIDITY / MOTION LAYER ================== */
:root{--spring:cubic-bezier(.22,1,.36,1);--ease:cubic-bezier(.4,0,.2,1)}

/* ambient drifting brand glow */
.amb{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.amb i{position:absolute;display:block;border-radius:50%;filter:blur(70px);opacity:.26}
.amb i.a{width:330px;height:330px;left:-100px;top:-70px;background:rgba(63,197,236,.5);animation:drift1 24s ease-in-out infinite}
.amb i.b{width:290px;height:290px;right:-110px;top:28%;background:rgba(231,54,155,.3);animation:drift2 28s ease-in-out infinite}
.amb i.c{width:310px;height:310px;left:8%;bottom:-130px;background:rgba(252,194,26,.2);animation:drift3 32s ease-in-out infinite}
@keyframes drift1{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(44px,64px) scale(1.16)}}
@keyframes drift2{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(-54px,44px) scale(1.12)}}
@keyframes drift3{0%,100%{transform:translate(0,0) scale(1)}50%{transform:translate(44px,-54px) scale(1.14)}}
.app{position:relative;z-index:1}

/* view swap */
.scroll{transition:opacity .15s var(--ease),transform .15s var(--ease)}
.scroll.out{opacity:0;transform:translateY(10px) scale(.993)}
.scroll.nofx>*{animation:none!important}

/* scroll reveal for below-the-fold blocks */
.scroll>*.rv{animation:none!important;opacity:0;transform:translateY(20px);
  transition:opacity .55s var(--spring),transform .55s var(--spring)}
.scroll>*.rv.in{opacity:1;transform:none}

/* tap ripple */
.rip{position:absolute;border-radius:50%;transform:translate(-50%,-50%) scale(0);pointer-events:none;z-index:0;
  background:radial-gradient(circle,rgba(255,255,255,.4),rgba(255,255,255,0) 70%);
  animation:ripple .6s var(--ease) forwards}
@keyframes ripple{to{transform:translate(-50%,-50%) scale(1);opacity:0}}
.btn,.row,.task,.slot,.invite,.kpi{position:relative;overflow:hidden}

/* press feedback */
.row,.task,.slot,.invite{transition:transform .18s var(--spring),background .22s ease}
.row:active,.task:active,.slot:active,.invite:active{transform:scale(.986)}
.kpi{transition:transform .4s var(--spring),border-color .3s ease}
.kpi:active{transform:scale(.965)}
.btn:active{transform:scale(.96)}
.nav button{transition:color .25s var(--ease),transform .3s var(--spring)}
.nav button:active{transform:scale(.9)}
.nav button.on .i{animation:pop .4s var(--spring) both}

/* sliding nav indicator */
.navind{position:absolute;left:0;top:6px;bottom:calc(6px + env(safe-area-inset-bottom));width:0;border-radius:14px;
  background:rgba(63,197,236,.12);border:1px solid rgba(63,197,236,.22);pointer-events:none;
  transition:transform .45s var(--spring),width .45s var(--spring),opacity .3s ease}
.nav button{position:relative;z-index:1}

/* sliding segmented pill */
.segbar{position:relative;border-radius:980px}
.segind{position:absolute;left:0;top:3px;bottom:3px;width:0;border-radius:980px;background:var(--card3);
  box-shadow:0 2px 10px rgba(0,0,0,.35);transition:transform .42s var(--spring),width .42s var(--spring);z-index:0}
.segbar button{position:relative;z-index:1;background:transparent!important}

/* card depth + top highlight */
.card:before{content:"";position:absolute;left:16px;right:16px;top:0;height:1px;pointer-events:none;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.16),transparent)}
.card{position:relative}

/* hero sheen sweep */
.hero:after{content:"";position:absolute;top:0;bottom:0;left:-60%;width:45%;pointer-events:none;
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.06),transparent);
  animation:sheen 8s ease-in-out infinite}
@keyframes sheen{0%,70%{transform:translateX(0)}100%{transform:translateX(430%)}}

/* meters fill */
.meter i{transition:width 1.1s var(--spring)}

/* toast */
.toast{animation:toastin .45s var(--spring) both}
@keyframes toastin{0%{opacity:0;transform:translateX(-50%) translateY(20px) scale(.9)}
  100%{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}}
.toast.bye{animation:toastout .3s var(--ease) both}
@keyframes toastout{to{opacity:0;transform:translateX(-50%) translateY(12px) scale(.94)}}

/* role switch */
.roleswitch button{transition:background .3s var(--spring),color .3s var(--ease),transform .3s var(--spring)}
.roleswitch button:active{transform:scale(.92)}
/* banners breathe in */
.banner{transition:transform .4s var(--spring)}
.banner:active{transform:scale(.99)}

:root{
  --bg:#0B0B0D; --bg2:#050506;
  --card:#161619; --card2:#1E1E22; --card3:#2A2A30;
  --line:rgba(255,255,255,.08); --line2:rgba(255,255,255,.16);
  --ink:#F5F5F7; --muted:#A1A1A6; --dim:#6E6E73;
  --disp:'Archivo Black','Arial Black',system-ui,sans-serif;
  --sans:'Inter',-apple-system,system-ui,sans-serif;
  --rad:18px; --rad2:20px;
  --skygrad:linear-gradient(180deg,#5AD4F7 0%,#2FB4E0 100%);
  --shadow:0 20px 60px rgba(0,0,0,.5);
}
body{font-size:15px;letter-spacing:0;

   text-transform:uppercase;color:var(--ink);margin:30px 2px 13px}
.h .pill{font-family:var(--sans);font-weight:700;font-size:10px;letter-spacing:.16em;
   text-transform:uppercase;color:var(--dim)}
.kicker{font-size:11px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:var(--dim)}
.kicker.sky{color:var(--sky)}
.htitle{font-family:var(--disp);font-weight:400;font-size:31px;line-height:1;letter-spacing:.2px;
   text-transform:uppercase;margin-top:9px}

/* photo hero — the LOTG signature */
.phero{position:relative;border-radius:20px;overflow:hidden;background:#0d0d10;
  border:1px solid var(--line);box-shadow:var(--shadow);aspect-ratio:3/4}
.phero>img{width:100%;height:100%;object-fit:cover;display:block;
  animation:kenburns 16s ease-in-out infinite alternate}
@keyframes kenburns{from{transform:scale(1.06)}to{transform:scale(1)}}
.phero .scrim{position:absolute;inset:0;
  background:linear-gradient(to top,rgba(5,5,7,.92) 0%,rgba(5,5,7,.34) 38%,transparent 64%)}
.phero .ptxt{position:absolute;left:18px;right:18px;bottom:17px;z-index:2}
.phero .a,.phero .b{font-family:var(--disp);font-weight:400;font-size:25px;line-height:1.03;
  text-transform:uppercase;letter-spacing:.2px}
.phero .a{color:#fff}
.phero .b{color:rgba(255,255,255,.52)}
.phero .c{font-size:10px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;
  color:rgba(255,255,255,.62);margin-top:10px}
.phero .badge{position:absolute;top:14px;left:14px;z-index:2;display:inline-flex;align-items:center;gap:7px;
  padding:7px 12px;border-radius:980px;background:rgba(6,6,8,.6);border:1px solid rgba(255,255,255,.16);
  -webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);
  font-size:9.5px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:#fff}
.phero .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--sky);animation:pulse 2s ease-in-out infinite}

/* stats */
.kpi{border-radius:16px;padding:14px;background:var(--card)}
.kpi .v{font-family:var(--disp);font-weight:400;font-size:30px;line-height:1;letter-spacing:.2px}
.kpi .l{font-size:10px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.kpi .sub{font-size:11px;font-weight:700;letter-spacing:.02em;margin-top:5px}

/* controls — LOTG pills */
.btn{font-family:var(--sans);font-weight:800;font-size:13.5px;letter-spacing:.04em;text-transform:uppercase;
  padding:15px 22px;border-radius:980px;background:var(--skygrad);color:#042230}

.btn.sm{font-size:11px;letter-spacing:.06em;padding:9px 15px}
.segbar{border-radius:980px;padding:4px;background:var(--card2)}

.tag{font-size:9.5px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;padding:5px 10px}
.divchip{font-family:var(--disp);font-weight:400;font-size:10.5px;letter-spacing:.06em;text-transform:uppercase;padding:5px 11px}

/* rows */
.rmain .t{font-weight:700;font-size:14.5px;letter-spacing:-.005em}
.rmain .m{font-size:12px;font-weight:500;color:var(--muted);margin-top:3px}
.card{background:var(--card);border-radius:var(--rad)}
.av{border-radius:12px}

/* brand */
.brandtxt .n{font-family:var(--disp);font-weight:400;font-size:15px;letter-spacing:.05em;text-transform:uppercase}
.brandtxt .s{font-size:9.5px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin-top:3px}

.topbar .who .rl{font-size:9.5px;font-weight:800;letter-spacing:.13em;text-transform:uppercase;color:var(--sky);margin-top:2px}
.topbar{background:rgba(11,11,13,.78)}

/* login — LOTG hero */
.login h1{font-family:var(--disp);font-weight:400;font-size:40px;letter-spacing:.3px;text-transform:uppercase;line-height:.94}
.login .sub{font-size:11px;font-weight:700;letter-spacing:.17em;text-transform:uppercase;color:var(--dim);margin-top:11px}
.field label{font-size:10px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}

/* schedule + banners */
.slot{border-radius:16px}
.slot .time{font-family:var(--disp);font-weight:400;font-size:17px;letter-spacing:.2px}
.slot .time span{font-size:8.5px;font-weight:800;letter-spacing:.14em;text-transform:uppercase}
.slot .info .tt{font-family:var(--disp);font-weight:400;font-size:14px;letter-spacing:.02em;text-transform:uppercase}
.banner{border-radius:18px}

.banner .bm{font-size:12px;font-weight:500;margin-top:5px}

/* sheet */
.sheet{background:linear-gradient(180deg,#17171b,#0c0c0f);border-radius:26px 26px 0 0}
.sh-name{font-family:var(--disp);font-weight:400;font-size:24px;letter-spacing:.2px;text-transform:uppercase;line-height:1.05}
.sh-item{border-radius:15px;background:var(--card2)}
.sh-item .k{font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;color:var(--dim)}
.sh-item .v{font-size:14.5px;font-weight:700;margin-top:5px}

/* notices + tab bar */
.nt .ntt{font-size:14.5px;font-weight:700}
.nt .ntb{font-size:12.5px;margin-top:5px}
.nt .ntm{font-size:9px;font-weight:800;letter-spacing:.15em;text-transform:uppercase;margin-top:8px}
.nav{background:rgba(11,11,13,.92)}
.nav button{font-size:8.5px;font-weight:800;letter-spacing:.11em;text-transform:uppercase;gap:4px}
.demostrip{background:var(--bg2)}
.demostrip .dt{font-family:var(--disp);font-weight:400;font-size:10px;letter-spacing:.12em;text-transform:uppercase}
.amb i{opacity:.2}
.rollchip{font-size:12px;font-weight:800;letter-spacing:.04em;text-transform:uppercase}
.audsel button{font-size:10px;font-weight:800;letter-spacing:.1em;text-transform:uppercase}

/* ==================== PARENT EXPERIENCE ==================== */
.childcard{border:1px solid rgba(63,197,236,.24);
  background:linear-gradient(135deg,rgba(63,197,236,.10),rgba(63,197,236,.02))}

/* next game card */
.nx{background:linear-gradient(160deg,#1b1b20,#121215);border:1px solid var(--line2)}
.nxtop{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}

  margin-top:14px;color:var(--sky)}
.nxmeta{font-size:12.5px;color:var(--muted);margin-top:5px;font-weight:500}
.nxnote{display:flex;align-items:center;gap:8px;margin-top:12px;padding:10px 12px;border-radius:12px;
  background:rgba(255,255,255,.04);font-size:12.5px;color:var(--muted);font-weight:500}
.nxnote svg{width:15px;height:15px;color:var(--green);flex:0 0 auto}
.cd{flex:0 0 auto;font-size:9.5px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;
  padding:6px 11px;border-radius:980px;background:rgba(255,255,255,.08);color:var(--muted);white-space:nowrap}
.cd.ok{background:rgba(22,227,127,.16);color:var(--green)}
.cd.no{background:rgba(255,93,93,.15);color:var(--red)}

/* progress ring */
.ring{width:68px;height:68px;flex:0 0 auto}
.ring .rbg{fill:none;stroke:rgba(255,255,255,.09);stroke-width:7}
.ring .rfg{fill:none;stroke-width:7;stroke-linecap:round;transform:rotate(-90deg);transform-origin:50% 50%;
  transition:stroke-dashoffset 1.2s var(--spring)}
.ring .rtx{font-family:var(--disp);font-weight:400;font-size:19px;fill:#fff;letter-spacing:.2px}
.sortedtop{display:flex;align-items:center;gap:15px;padding:4px 2px 2px}

/* checklist */
.ck{width:27px;height:27px;border-radius:50%;flex:0 0 auto;display:grid;place-items:center;
  border:2px solid var(--line2);color:transparent;transition:all .35s var(--spring)}
.ck.on{background:var(--green);border-color:var(--green);color:#04160d}
.ck svg{width:15px;height:15px}
</style>

// derived
function stats(){
  const P=S.players;
  const registered=P.filter(p=>p.reg==="registered").length;
  const notReg=P.length-registered;
  const paid=P.filter(p=>p.pay==="paid").length;
  const outstanding=sum(P,p=>p.owe);
  const collected=sum(P,p=>FEE-p.owe>0?FEE-p.owe:0);
  const playing=P.filter(p=>p.avail==="in").length;
  const attRate=Math.round(sum(P,p=>p.att)/Math.max(1,sum(P,p=>p.sess))*100);
  const noResp=P.filter(p=>p.avail==="unset").length;
  return {total:P.length,registered,notReg,paid,outstanding,collected,playing,noResp,attRate};
}

/* swap the content: soft = in-place (keeps scroll, no re-animation) */
function paint(html,o={}){
  const s=app.querySelector(".scroll");
  if(o.soft){
    const top=s.scrollTop;
    s.classList.add("nofx");
    s.innerHTML=html; s.scrollTop=top;
    requestAnimationFrame(()=>{ s.scrollTop=top; });
    afterPaint(s,true);
    return;
  }
  s.classList.add("out");
  setTimeout(()=>{
    s.classList.remove("nofx");
    s.innerHTML=html; s.scrollTop=0;
    s.classList.remove("out");
    afterPaint(s,false);
  },150);
}

/* iOS-style scroll response: hero parallaxes away, nav bar firms up */
function bindScroll(){
  const s=app.querySelector(".scroll");
  if(!s || s._bound) return;
  s._bound=true;
  let tick=false;
  s.addEventListener("scroll",()=>{
    if(tick) return; tick=true;
    requestAnimationFrame(()=>{
      const y=s.scrollTop;
      const tb=app.querySelector(".topbar");
      if(tb) tb.classList.toggle("scrolled", y>6);
      const hero=s.querySelector(".hero,.phero");
      if(hero){
        const k=Math.min(1,y/230);
        hero.style.transform=`translate3d(0,${y*0.24}px,0) scale(${1-k*0.035})`;
        hero.style.opacity=String(1-k*0.6);
      }
      tick=false;
    });
  },{passive:true});
}

function afterPaint(s,soft){
  syncSeg(s);
  bindScroll();
  const tb=app.querySelector(".topbar"); if(tb && !soft) tb.classList.remove("scrolled");
  // hand the hero back to inline transforms once its entry animation is done
  const hero=s.querySelector(".hero,.phero");
  if(hero){ hero.style.transform=""; hero.style.opacity="";
    setTimeout(()=>{ if(hero.isConnected) hero.style.animation="none"; }, soft?0:620); }
  // meters grow from zero
  s.querySelectorAll(".meter i").forEach(el=>{
    const w=el.style.width; el.style.width="0%";
    requestAnimationFrame(()=>requestAnimationFrame(()=>{el.style.width=w;}));
  });
  s.querySelectorAll(".ring .rfg").forEach(el=>{
    el.style.strokeDashoffset=el.dataset.c;
    requestAnimationFrame(()=>requestAnimationFrame(()=>{ el.style.strokeDashoffset=el.dataset.off; }));
  });
  if(!soft){ countUps(s); revealBelowFold(s); }
}

/* numbers count up on view entry */
function countUps(root){
  root.querySelectorAll(".kpi .v").forEach(el=>{
    const node=[...el.childNodes].find(n=>n.nodeType===3 && /\d/.test(n.nodeValue));
    if(!node) return;
    const raw=node.nodeValue, m=raw.match(/-?[\d,]*\d/);
    if(!m) return;
    const target=parseFloat(m[0].replace(/,/g,""));
    if(!isFinite(target)||target<=0) return;
    const pre=raw.slice(0,m.index), post=raw.slice(m.index+m[0].length);
    const dur=780, t0=performance.now();
    node.nodeValue=pre+"0"+post;
    const step=t=>{
      const k=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-k,3);
      node.nodeValue=pre+Math.round(target*e).toLocaleString()+post;
      if(k<1) requestAnimationFrame(step);
    };
    requestAnimationFrame(step);
  });
}

/* blocks below the fold slide in as you scroll */
function revealBelowFold(s){
  if(!IO){
    IO=new IntersectionObserver(es=>es.forEach(e=>{
      if(e.isIntersecting){ e.target.classList.add("in"); IO.unobserve(e.target); }
    }),{root:s,rootMargin:"0px 0px -5% 0px",threshold:.05});
  }
  const h=s.clientHeight;
  [...s.children].forEach(el=>{
    if(el.getBoundingClientRect().top > h*0.94){ el.classList.add("rv"); IO.observe(el); }
  });
}

/* sliding indicators */
function syncNav(){
  const nav=app.querySelector(".nav"); if(!nav) return;
  nav.querySelectorAll("button").forEach(b=>b.classList.toggle("on",b.dataset.tab===VIEW.tab));
  let ind=nav.querySelector(".navind");
  if(!ind){ ind=document.createElement("div"); ind.className="navind"; nav.insertBefore(ind,nav.firstChild); }
  const act=nav.querySelector("button.on");
  if(act){ ind.style.width=act.offsetWidth+"px"; ind.style.transform=`translateX(${act.offsetLeft}px)`; ind.style.opacity="1"; }
  else ind.style.opacity="0";
}
function syncSeg(root){
  root.querySelectorAll(".segbar").forEach(sb=>{
    let ind=sb.querySelector(".segind");
    if(!ind){ ind=document.createElement("div"); ind.className="segind"; sb.insertBefore(ind,sb.firstChild); }
    const act=sb.querySelector("button.on");
    if(act){ ind.style.width=act.offsetWidth+"px"; ind.style.transform=`translateX(${act.offsetLeft}px)`; ind.style.opacity="1"; }
    else ind.style.opacity="0";
  });
}

  <div class="kpis">
    <div class="kpi green"><div class="v">${att}<span style="font-size:15px;color:var(--muted)">%</span></div>
      <div class="l">Attendance</div><div class="sub muted">${p.att} of ${p.sess} sessions</div></div>

  const wk = VIEW.schedWk;
  const dates=[FRI,"Fri 25 Sep","Fri 2 Oct"];
  let teams = S.teams.slice();
  if(onlyDiv) teams=teams.filter(t=>t.div===onlyDiv);
  return `
  <div class="h">Schedule ${isDir?'<span class="pill small b-green">Friday grid</span>':''}</div>
  <div class="segbar">${dates.map((d,i)=>`<button data-wk="${i}" class="${wk===i?'on':''}">${d.replace("Fri ","")}</button>`).join("")}</div>
  <div class="card" style="background:transparent;border:none;padding:0">
    <div class="small muted" style="margin:0 2px 10px">${dates[wk]} · ${VENUE}</div>
    ${teams.map(t=>{
      const inCount=S.players.filter(p=>p.div===t.div&&p.avail==="in").length;
      const cls=t.type==="game"?"game":"train";
      return `<div class="slot">
        <div class="barleft ${cls}"></div>
        <div class="time">${t.time}<span>PM</span></div>
        <div class="info">
          <div class="tt">${t.name} · ${t.type==="game"?"Game":"Training"}</div>
          <div class="mm">${t.court} · ${t.type==="game"?"vs "+t.opp:"Skills & scrimmage"} · Coach ${t.coach}</div>

        </div>
        <div class="rside">${t.type==="game"?'<span class="tag warn">Game</span>':'<span class="tag info">Train</span>'}</div>
      </div>`;}).join("")}
  </div>
  ${isDir?`<div class="card"><button class="btn gh" data-act="edit">✏️ Edit Friday grid</button></div>`:``}
  ${resetBtn()}`;
}

/* tap ripple on anything pressable */
app.addEventListener("pointerdown",e=>{
  const t=e.target.closest(".btn,.row,.task,.slot,.invite,.kpi");
  if(!t) return;
  const r=t.getBoundingClientRect();
  const d=Math.max(r.width,r.height)*1.7;
  const rip=document.createElement("span");
  rip.className="rip";
  rip.style.width=rip.style.height=d+"px";
  rip.style.left=(e.clientX-r.left)+"px";
  rip.style.top=(e.clientY-r.top)+"px";
  t.appendChild(rip);
  setTimeout(()=>rip.remove(),620);
},{passive:true});

app.addEventListener("click",e=>{
  const tabBtn=e.target.closest("[data-tab]");
  if(tabBtn){
    if(VIEW.tab===tabBtn.dataset.tab) return;
    VIEW.tab=tabBtn.dataset.tab; render(); return;
  }
  const a=e.target.closest("[data-act]"); if(!a) return;
  handleAct(a);
});

/* shared by the app and the detail sheet */
function handleAct(a){
  const act=a.dataset.act, id=a.dataset.id;
  if(act==="pl"){ openSheet(playerSheet(id),id); return; }
  if(act==="closesheet"){ closeSheet(); return; }
  if(act==="notice"){ openSheet(noticeComposer()); return; }
  if(act==="postnotice"){
    const w=sheetEl();
    const t=(w.querySelector("#nt").value||"").trim()||"Club update";
    const b=(w.querySelector("#nb").value||"").trim()||"—";
    const sel=w.querySelector(".audsel button.on");
    S.notices.unshift({id:"n"+Date.now(),t,b,aud:sel?sel.dataset.aud:"Everyone",when:"Just now"});
    save(); closeSheet(); toast("Notice posted"); render(SOFT); return;
  }
  if(act==="roll"){ const p=player(id); p.here=!p.here; save(); render(SOFT); return; }
  if(act==="login"||act==="invite"){ VIEW.authed=true; VIEW.role="admin"; VIEW.tab="home"; MOUNTED=false;
    if(act==="invite"){ const d=S.directors.find(x=>x.id===a.dataset.who); if(d){d.activated=true;save();} toast("Welcome — password set"); }
    render(); return; }
  if(act==="task"){ const t=S.tasks.find(x=>x.id===id); t.done=!t.done; save(); render(SOFT); return; }
  if(act==="remind"){ const p=player(id); S.feed.unshift({t:"Reminder sent to "+p.name,m:money(p.owe)+" · "+new Date().toLocaleDateString()}); save(); toast("Payment reminder sent"); render(SOFT); refreshSheet(); return; }
  if(act==="approve"){ const p=player(id); p.reg="registered"; save(); toast(p.name+" registered"); render(SOFT); refreshSheet(); return; }
  if(act==="pay"){ const p=player(id); p.owe=0; p.pay="paid"; save(); toast("Payment complete"); render(SOFT); refreshSheet(); return; }
  if(act==="avail"){ const p=player(id); p.avail=a.dataset.v; save(); toast(a.dataset.v==="in"?"You're in for Friday":"Marked unavailable"); render(SOFT); return; }
  if(act==="nudge"){ toast("Nudge sent to players who haven't replied"); return; }
  if(act==="msg"){ toast("Team message sent"); return; }
  if(act==="clear"){ toast("WWCC request sent to coach"); return; }
  if(act==="addcoach"){ toast("Invite a coach — Phase 2"); return; }
  if(act==="addchild"){ toast("Link another child — Phase 2"); return; }
  if(act==="consent"){ const p=player(id); p.consent=true; save(); toast("Consent form signed"); render(SOFT); refreshSheet(); return; }
  if(act==="uniform"){ const p=player(id); p.uniform=true; save(); toast("Uniform marked as collected"); render(SOFT); refreshSheet(); return; }
  if(act==="directions"){ toast("Opening directions to "+VENUE); return; }
  if(act==="calendar"){ toast("Added to your calendar"); return; }
  if(act==="callcoach"){ toast("Calling your coach"); return; }
  if(act==="edit"){ toast("Schedule editor — Phase 2"); return; }
  if(act==="reset"){ reset(); VIEW.tab="home"; toast("Demo data reset"); render(); return; }
}

/* the sheet lives outside the app frame — give it its own delegate */
sheetEl().addEventListener("click",e=>{
  const au=e.target.closest("[data-aud]");
  if(au){ au.parentNode.querySelectorAll("[data-aud]").forEach(x=>x.classList.remove("on")); au.classList.add("on"); return; }
  const a=e.target.closest("[data-act]"); if(!a) return;
  handleAct(a);
});

/* segmented filters — swap in place so the pill slides */
app.addEventListener("click",e=>{
  const mf=e.target.closest("[data-mf]"); if(mf){VIEW.moneyFilter=mf.dataset.mf;render(SOFT);return;}
  const rf=e.target.closest("[data-rf]"); if(rf){VIEW.regFilter=rf.dataset.rf;render(SOFT);return;}
  const wk=e.target.closest("[data-wk]"); if(wk){VIEW.schedWk=+wk.dataset.wk;render(SOFT);return;}
});

window.addEventListener("resize",()=>{ syncNav(); const s=app.querySelector(".scroll"); if(s) syncSeg(s); });

migrate(); save();
render();
</script>
</body>
</html>
