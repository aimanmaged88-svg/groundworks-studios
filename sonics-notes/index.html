<!DOCTYPE html>
<html lang="en"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#09090B">
<title>Sonics Inbox</title>
<link rel="icon" href="logo.png" type="image/png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#09090B;--card:#141416;--card2:#17171A;--line:rgba(242,239,230,.09);
 --line2:rgba(242,239,230,.18);--ink:#F2EFE6;--muted:#B4B0A7;--dim:#7C786F;
 --sky:#3FC5EC;--green:#16E37F;--gold:#FFC63D;--red:#FF5D5D;--pink:#E7369B;
 --disp:'Archivo',Arial,sans-serif;--sans:'Hanken Grotesk',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;
 -webkit-font-smoothing:antialiased;padding-bottom:70px}
.wrap{max-width:1320px;margin:0 auto;padding:0 20px}
header{padding:32px 0 20px;border-bottom:1px solid var(--line);margin-bottom:22px}
.top{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top img{width:44px;height:44px;border-radius:50%}
h1{font-family:var(--disp);font-weight:900;letter-spacing:-.035em;font-size:26px;line-height:1.05}
.sub{color:var(--dim);font-size:12.5px;margin-top:3px}
.pill{margin-left:auto;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:999px;
 background:rgba(22,227,127,.1);border:1px solid rgba(22,227,127,.28);color:var(--green);
 font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase}

.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(124px,1fr));gap:9px;margin-bottom:11px}
.st{background:var(--card);border:1px solid var(--line);border-radius:13px;padding:14px;cursor:pointer;
 transition:.18s;text-align:left}
.st:hover{border-color:var(--line2)}
.st.on{border-color:var(--sky);background:rgba(63,197,236,.09)}
.st b{font-family:var(--disp);font-weight:900;font-size:25px;display:block;letter-spacing:-.03em}
.st span{font-size:9.5px;font-weight:700;letter-spacing:.13em;text-transform:uppercase;color:var(--dim);
 display:block;margin-top:5px}
.st.boy b{color:var(--sky)} .st.girl b{color:var(--pink)} .st.med b{color:var(--red)}

.grid2{display:grid;grid-template-columns:1fr;gap:11px;margin-bottom:18px}
@media(min-width:900px){.grid2{grid-template-columns:1fr 1fr}}
.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px 18px}
.panel h3{font-family:var(--disp);font-weight:800;font-size:12px;letter-spacing:.14em;text-transform:uppercase;
 color:var(--dim);margin-bottom:12px}
.mx{width:100%;border-collapse:collapse;font-size:13.5px}
.mx th{text-align:left;padding:7px 8px;font-size:9.5px;font-weight:800;letter-spacing:.12em;
 text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line)}
.mx td{padding:8px;border-bottom:1px solid var(--line);color:var(--muted)}
.mx tr:last-child td{border-bottom:none}
.mx td.g{font-weight:700;color:var(--ink);cursor:pointer}
.mx td.g:hover{color:var(--sky)}
.mx td.n{font-family:var(--disp);font-weight:800;color:var(--ink)}
.bar{height:7px;border-radius:5px;background:rgba(255,255,255,.07);overflow:hidden;min-width:60px}
.bar i{display:block;height:100%;border-radius:5px;background:linear-gradient(90deg,var(--sky),var(--gold))}

.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.srch{flex:1;min-width:190px;padding:11px 14px;border-radius:11px;background:var(--card);
 border:1px solid var(--line);color:var(--ink);font-family:var(--sans);font-size:14px}
.srch:focus{outline:none;border-color:var(--sky)}
select{padding:11px 13px;border-radius:11px;background:var(--card);border:1px solid var(--line);
 color:var(--ink);font-family:var(--sans);font-size:13.5px;cursor:pointer;max-width:190px}
select:focus{outline:none;border-color:var(--sky)}
select.on{border-color:var(--sky);background:rgba(63,197,236,.09)}
.btn{border:0;cursor:pointer;font-family:var(--sans);font-weight:700;font-size:13.5px;
 padding:11px 18px;border-radius:11px;background:var(--sky);color:#04202b;transition:.2s}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:scale(.97)}
.btn.g{background:rgba(242,239,230,.06);color:var(--ink);border:1px solid var(--line2)}
.btn[disabled]{opacity:.4;cursor:not-allowed}

.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table.d{border-collapse:collapse;width:100%;font-size:13px;white-space:nowrap}
table.d th{background:var(--card2);text-align:left;padding:12px 13px;font-size:9.5px;font-weight:800;
 letter-spacing:.12em;text-transform:uppercase;color:var(--dim);border-bottom:1px solid var(--line);
 position:sticky;top:0;cursor:pointer;user-select:none}
table.d th:hover{color:var(--sky)}
table.d th .ar{opacity:.5;font-size:9px}
table.d td{padding:12px 13px;border-bottom:1px solid var(--line);color:var(--muted)}
table.d tr:last-child td{border-bottom:none}
table.d tr:hover td{background:rgba(255,255,255,.022)}
td.nm{color:var(--ink);font-weight:700}
td a{color:var(--sky);text-decoration:none}
.chip{display:inline-block;font-size:9px;font-weight:800;letter-spacing:.07em;text-transform:uppercase;
 padding:3px 7px;border-radius:5px}
.chip.dup{background:rgba(255,198,61,.14);color:var(--gold)}
.chip.med{background:rgba(255,93,93,.14);color:var(--red)}
.chip.b{background:rgba(63,197,236,.14);color:var(--sky)}
.chip.gl{background:rgba(231,54,155,.16);color:#F37FC2}
.note{background:linear-gradient(180deg,var(--card2),var(--card));border:1px solid var(--line);
 border-radius:14px;padding:22px;margin-bottom:18px}
.note.warn{border-color:rgba(255,198,61,.3);background:rgba(255,198,61,.055)}
.note h3{font-family:var(--disp);font-weight:800;font-size:17px;margin-bottom:9px;letter-spacing:-.02em}
.note p{color:var(--muted);font-size:14px;margin-bottom:8px}
.note ol{margin:10px 0 10px 20px;color:var(--muted);font-size:14px}
.note li{margin:6px 0}
.note code{background:rgba(255,255,255,.07);padding:2px 7px;border-radius:5px;font-size:13px;
 font-family:ui-monospace,Menlo,monospace;color:var(--ink)}
.empty{text-align:center;padding:52px 20px;color:var(--dim)}
footer{margin-top:22px;color:var(--dim);font-size:12px}
</style></head><body>
<div class="wrap">

<header><div class="top">
  <img src="logo.png" alt="">
  <div><h1>Sonics Inbox</h1><div class="sub">Tryout registrations · South West Sonics</div></div>
  <div class="pill">Private</div>
</div></header>

<div id="panels"></div>

<div class="filters" id="filters" style="display:none">
  <input class="srch" id="q" placeholder="Search any field — name, parent, school, phone…">
  <select id="fGender"><option value="">All genders</option></select>
  <select id="fAge"><option value="">All age groups</option></select>
  <select id="fExp"><option value="">All experience</option></select>
  <select id="fHear"><option value="">Heard via — all</option></select>
  <select id="fPhoto"><option value="">Photo consent — all</option></select>
  <select id="fMed"><option value="">Medical — all</option><option value="y">Has a note</option><option value="n">None</option></select>
  <button class="btn g" id="clr">Clear</button>
  <button class="btn" id="xls">Excel</button>
  <button class="btn g" id="csv">CSV</button>
  <button class="btn g" id="rf">Refresh</button>
</div>

<div id="mount"><div class="empty">Loading…</div></div>
<footer id="ft"></footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
<script>
const FIELDS=["Player name","Date of birth","Age","Gender","Uniform size","School","Experience",
 "Parent name","Parent mobile","Relationship","Parent email","Emergency contact","Emergency phone",
 "Medical","Ambulance cover","Notes","Consent - medical","Consent - conduct","Consent - photos",
 "How did you hear"];
const COLS=[["Received","_at"],["Player name","Player name"],["Age","Age"],["Group","_grp"],
 ["Gender","Gender"],["School","School"],["Experience","Experience"],["Uniform","Uniform size"],
 ["Parent","Parent name"],["Mobile","Parent mobile"],["Email","Parent email"],["Medical","Medical"]];
const NOMED=['','none','no','nothing','n/a','na','nil','no medical conditions','-'];
let ROWS=[], SORT={k:'_at',dir:-1}, SNAP='';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const syd=iso=>{try{return new Date(iso).toLocaleString('en-AU',{timeZone:'Australia/Sydney',
  day:'numeric',month:'short',hour:'numeric',minute:'2-digit'});}catch(e){return iso||"";}};
const ageOf=r=>{const a=parseInt(r.data['Age'],10); return isNaN(a)?null:a;};
function grpOf(r){const a=ageOf(r); if(a===null) return 'Not stated';
  if(a<=11) return 'U12'; if(a<=13) return 'U14'; if(a<=15) return 'U16'; if(a<=17) return 'U18';
  return 'Over 18';}
const genOf=r=>(r.data['Gender']||'').trim()||'Not stated';
const hasMed=r=>!NOMED.includes((r.data['Medical']||'').trim().toLowerCase());

function prep(){ ROWS.forEach(r=>{ r._at=r.at; r._grp=grpOf(r); }); }
function dupIds(){const seen={},d=new Set();
  ROWS.forEach(r=>{const k=((r.data['Player name']||'')+'|'+(r.data['Date of birth']||'')).toLowerCase().trim();
    if(k.length>1){ if(seen[k]) d.add(r.id); else seen[k]=1; }}); return d;}
function fillSelect(el,vals,label){
  const cur=el.value;
  el.innerHTML=`<option value="">${label}</option>`+vals.map(v=>`<option>${esc(v)}</option>`).join('');
  el.value=cur;
}
function uniq(fn){return [...new Set(ROWS.map(fn).filter(v=>v!==''&&v!=null))].sort();}

function filtered(){
  const q=($('#q').value||'').toLowerCase().trim();
  const g=$('#fGender').value, a=$('#fAge').value, e=$('#fExp').value,
        h=$('#fHear').value, p=$('#fPhoto').value, m=$('#fMed').value;
  return ROWS.filter(r=>{
    if(q && !FIELDS.some(f=>String(r.data[f]||'').toLowerCase().includes(q))) return false;
    if(g && genOf(r)!==g) return false;
    if(a && grpOf(r)!==a) return false;
    if(e && (r.data['Experience']||'')!==e) return false;
    if(h && (r.data['How did you hear']||'')!==h) return false;
    if(p){const v=(r.data['Consent - photos']||'').trim()||'No';
      if((p==='Yes'?'Yes':'No')!==(v==='Yes'?'Yes':'No')) return false;}
    if(m==='y' && !hasMed(r)) return false;
    if(m==='n' &&  hasMed(r)) return false;
    return true;
  });
}
function sortRows(list){
  const {k,dir}=SORT;
  return list.slice().sort((x,y)=>{
    let a = k==='_at'?new Date(x._at):(k==='_grp'?x._grp:(x.data[k]||''));
    let b = k==='_at'?new Date(y._at):(k==='_grp'?y._grp:(y.data[k]||''));
    if(k==='Age'){a=ageOf(x)??-1;b=ageOf(y)??-1;}
    return a<b?-dir:a>b?dir:0;
  });
}
function render(){
  const list=sortRows(filtered()), dups=dupIds();
  const GRPS=['U12','U14','U16','U18','Over 18','Not stated'];
  const gens=uniq(genOf);
  // stat tiles
  const boys=ROWS.filter(r=>/^boy|^male|^m$/i.test(genOf(r))).length;
  const girls=ROWS.filter(r=>/^girl|^female|^f$/i.test(genOf(r))).length;
  $('#panels').innerHTML=`
   <div class="stats">
     <button class="st ${!$('#fGender')?.value&&!$('#fAge')?.value?'on':''}" data-clear="1">
       <b>${ROWS.length}</b><span>Total regos</span></button>
     <button class="st boy" data-g="Boy"><b>${boys}</b><span>Boys</span></button>
     <button class="st girl" data-g="Girl"><b>${girls}</b><span>Girls</span></button>
     <button class="st"><b>${ROWS.length-dups.size}</b><span>Unique players</span></button>
     <button class="st med" data-med="y"><b>${ROWS.filter(hasMed).length}</b><span>Medical notes</span></button>
     <button class="st"><b>${ROWS.filter(r=>(r.data['Consent - photos']||'').trim()!=='Yes').length}</b>
       <span>No photo consent</span></button>
   </div>
   <div class="grid2">
     <div class="panel"><h3>Age group &times; gender</h3>
       <table class="mx"><thead><tr><th>Group</th>${gens.map(g=>`<th>${esc(g)}</th>`).join('')}<th>Total</th><th></th></tr></thead>
       <tbody>${GRPS.filter(gp=>ROWS.some(r=>grpOf(r)===gp)).map(gp=>{
         const inG=ROWS.filter(r=>grpOf(r)===gp);
         return `<tr><td class="g" data-a="${esc(gp)}">${esc(gp)}</td>
           ${gens.map(g=>`<td>${inG.filter(r=>genOf(r)===g).length}</td>`).join('')}
           <td class="n">${inG.length}</td>
           <td style="width:32%"><div class="bar"><i style="width:${Math.round(inG.length/Math.max(1,ROWS.length)*100)}%"></i></div></td></tr>`;
       }).join('')}</tbody></table></div>
     <div class="panel"><h3>Experience &amp; how they heard</h3>
       <table class="mx"><tbody>
       ${uniq(r=>r.data['Experience']||'').map(v=>`<tr><td class="g" data-e="${esc(v)}">${esc(v)}</td>
         <td class="n" style="text-align:right">${ROWS.filter(r=>(r.data['Experience']||'')===v).length}</td></tr>`).join('')}
       ${uniq(r=>r.data['How did you hear']||'').map(v=>`<tr><td class="g" data-h="${esc(v)}" style="color:var(--muted)">${esc(v)}</td>
         <td class="n" style="text-align:right">${ROWS.filter(r=>(r.data['How did you hear']||'')===v).length}</td></tr>`).join('')}
       </tbody></table></div>
   </div>`;
  // table
  $('#mount').innerHTML = !list.length ? '<div class="empty">Nothing matches those filters.</div>' :
   `<div class="tblwrap"><table class="d"><thead><tr>${COLS.map(([lab,k])=>
     `<th data-k="${esc(k)}">${esc(lab)} <span class="ar">${SORT.k===k?(SORT.dir>0?'▲':'▼'):''}</span></th>`).join('')}
    </tr></thead><tbody>${list.map(r=>{const d=r.data;
      return `<tr>${COLS.map(([lab,k])=>{
        if(k==='_at') return `<td>${esc(syd(r.at))} ${dups.has(r.id)?'<span class="chip dup">dup</span>':''}</td>`;
        if(k==='_grp') return `<td><span class="chip b">${esc(grpOf(r))}</span></td>`;
        let v=d[k]||'';
        if(k==='Player name') return `<td class="nm">${esc(v)}</td>`;
        if(k==='Gender') return `<td>${v?`<span class="chip ${/girl|female/i.test(v)?'gl':'b'}">${esc(v)}</span>`:'—'}</td>`;
        if(k==='Parent mobile') return `<td><a href="tel:${esc(String(v).replace(/\s/g,''))}">${esc(v)}</a></td>`;
        if(k==='Parent email') return `<td><a href="mailto:${esc(v)}">${esc(v)}</a></td>`;
        if(k==='Medical') return `<td>${hasMed(r)?'<span class="chip med">check</span> ':''}${esc(v||'—')}</td>`;
        return `<td>${esc(v||'—')}</td>`;}).join('')}</tr>`;}).join('')}
    </tbody></table></div>`;
  $('#ft').textContent=`Showing ${list.length} of ${ROWS.length} · exports follow your filters · times in Sydney`
    + (SNAP?` · snapshot taken ${syd(SNAP)} — ask Aiman to refresh`:'');
  document.querySelectorAll('table.d th').forEach(th=>th.onclick=()=>{
    const k=th.dataset.k; SORT = SORT.k===k?{k,dir:-SORT.dir}:{k,dir:1}; render();});
  document.querySelectorAll('.st[data-g]').forEach(b=>b.onclick=()=>{$('#fGender').value=b.dataset.g;sync();});
  document.querySelectorAll('.st[data-med]').forEach(b=>b.onclick=()=>{$('#fMed').value='y';sync();});
  document.querySelectorAll('.st[data-clear]').forEach(b=>b.onclick=()=>clearAll());
  document.querySelectorAll('.mx td.g').forEach(td=>td.onclick=()=>{
    if(td.dataset.a) $('#fAge').value=td.dataset.a;
    if(td.dataset.e) $('#fExp').value=td.dataset.e;
    if(td.dataset.h) $('#fHear').value=td.dataset.h;
    sync();});
  ['fGender','fAge','fExp','fHear','fPhoto','fMed'].forEach(id=>
    $('#'+id).classList.toggle('on', !!$('#'+id).value));
}
function sync(){render();}
function clearAll(){['q','fGender','fAge','fExp','fHear','fPhoto','fMed'].forEach(id=>$('#'+id).value='');render();}

function sheet(){return sortRows(filtered()).map(r=>{
  const o={'Received':syd(r.at),'Age group':grpOf(r)};
  FIELDS.forEach(f=>o[f]=r.data[f]||''); return o;});}
$('#xls').onclick=()=>{const rows=sheet(); if(!rows.length) return;
  const ws=XLSX.utils.json_to_sheet(rows);
  ws['!cols']=Object.keys(rows[0]).map(k=>({wch:Math.min(Math.max(k.length+4,12),40)}));
  const wb=XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb,ws,'Registrations');
  XLSX.writeFile(wb,`Sonics-registrations-${new Date().toISOString().slice(0,10)}.xlsx`);};
$('#csv').onclick=()=>{const rows=sheet(); if(!rows.length) return;
  const blob=new Blob([XLSX.utils.sheet_to_csv(XLSX.utils.json_to_sheet(rows))],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob);
  a.download=`Sonics-registrations-${new Date().toISOString().slice(0,10)}.csv`; a.click();};
['q','fGender','fAge','fExp','fHear','fPhoto','fMed'].forEach(id=>{
  const el=$('#'+id); el.addEventListener(id==='q'?'input':'change',render);});
$('#clr').onclick=clearAll; $('#rf').onclick=load;

function boot(rows){
  ROWS=rows.sort((a,b)=>new Date(b.at)-new Date(a.at)); prep();
  fillSelect($('#fGender'),uniq(genOf),'All genders');
  fillSelect($('#fAge'),[...new Set(ROWS.map(grpOf))].sort(),'All age groups');
  fillSelect($('#fExp'),uniq(r=>r.data['Experience']||''),'All experience');
  fillSelect($('#fHear'),uniq(r=>r.data['How did you hear']||''),'Heard via — all');
  fillSelect($('#fPhoto'),['Yes','No'],'Photo consent — all');
  $('#filters').style.display='flex';
  render();
}
async function load(){
  $('#rf').disabled=true;
  let j=null;
  /* live feed first; fall back to the deployed snapshot, which sits behind
     this site's password just like the page does */
  try{ const r=await fetch('/.netlify/functions/registrations',{cache:'no-store'});
       const t=await r.json(); if(t&&t.ok) j=t; }catch(e){}
  if(!j){ try{ const r2=await fetch('data.json?t='+Date.now(),{cache:'no-store'});
       if(r2.ok){ const t2=await r2.json(); if(t2&&t2.ok){ j=t2; SNAP=t2.snapshot||''; } } }catch(e){} }
  try{
    if(j&&j.ok){ boot(j.rows||[]); }
    else{
      $('#filters').style.display='none'; $('#panels').innerHTML='';
      $('#mount').innerHTML=`<div class="note warn"><h3>One step left to switch it on</h3>
        <p>Everything here is built and waiting — it just needs a key so it can pull the
           registrations in. Nothing is lost meanwhile; every submission is safely stored on Netlify.</p>
        <ol>
          <li>Netlify &rarr; <b style="color:var(--ink)">User settings</b> &rarr; Applications &rarr;
              <b style="color:var(--ink)">New access token</b> &rarr; copy it</li>
          <li>Netlify &rarr; this site (<b style="color:var(--ink)">sonics-notes</b>) &rarr;
              Site configuration &rarr; Environment variables &rarr; <b style="color:var(--ink)">Add a variable</b></li>
          <li>Key <code>NETLIFY_API_TOKEN</code>, value = the token you copied, then
              <b style="color:var(--ink)">Deploys &rarr; Trigger deploy</b></li>
        </ol>
        <p style="margin-bottom:0">Doing it that way means the token stays between you and Netlify.
           Or export from <a href="https://app.netlify.com/projects/sonics-register/forms" style="color:var(--sky)">Netlify &rarr; Forms</a> in the meantime.</p></div>`;
    }
  }catch(e){ $('#mount').innerHTML='<div class="note warn"><h3>Could not reach the inbox</h3><p>'+esc(e.message)+'</p></div>'; }
  $('#rf').disabled=false;
}
if(window.__SEED){ boot(window.__SEED); } else { load(); }
</script></body></html>
