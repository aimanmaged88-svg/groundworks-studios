<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#0B0E14">
<title>Apex MMA — Member OS</title>
<link rel="icon" href="https://www.apexmma.com.au/wp-content/uploads/cropped-apex_mma_favicon-32x32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Inter+Tight:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F2F5F8;
  --card:#FFFFFF;
  --card2:#F7FAFC;
  --line:rgba(13,30,45,.09);
  --line2:rgba(13,30,45,.16);
  --ink:#0D1520;
  --muted:#5D6B79;
  --dim:#93A0AD;
  --blue:#279DD7;
  --blue-deep:#1479AD;
  --blue-ink:#0B3B5E;
  --navy:#0B0E14;
  --navy2:#11161F;
  --green:#1FA262;
  --red:#D64545;
  --mt:#1479AD;
  --ng:#279DD7;
  --mma:#0B3B5E;
  --kids:#54B6E8;
  --disp:'Rajdhani',system-ui,sans-serif;
  --sans:'Inter Tight',system-ui,sans-serif;
  --mono:'Rajdhani',sans-serif;
  --rad:16px;
  --shadow:0 1px 2px rgba(13,30,45,.05),0 8px 24px -12px rgba(13,30,45,.12);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--sans);background:var(--bg);color:var(--ink);
  display:flex;flex-direction:column;overflow:hidden;
  font-size:15px;line-height:1.45;
}
button{font-family:var(--sans)}
img{max-width:100%}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:#C4CFD9;border-radius:6px;border:3px solid var(--bg)}
::-webkit-scrollbar-track{background:transparent}

/* ---------- entrance animations ---------- */
@keyframes fadeUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
@keyframes growW{from{width:0}}
@keyframes kenburns{from{transform:scale(1.02) translateX(0)}to{transform:scale(1.13) translateX(-2%)}}
@keyframes chevFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.wrap>*{animation:fadeUp .5s cubic-bezier(.2,.7,.3,1) both}
.meter i{animation:growW .9s cubic-bezier(.2,.7,.3,1) both;animation-delay:.15s}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- demo strip ---------- */
.demostrip{
  flex:0 0 auto;display:flex;align-items:center;justify-content:space-between;gap:10px;
  padding:7px 16px;background:var(--navy);border-bottom:1px solid rgba(255,255,255,.08);z-index:40;position:relative;
}
.demostrip .dt{font-family:var(--disp);font-size:12px;letter-spacing:2.5px;color:#7E8A96;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.demostrip .dt b{color:#fff;font-weight:700}
.demostrip .dt b i{color:var(--blue);font-style:normal}
.modeswitch{display:inline-flex;background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.12);border-radius:999px;padding:3px;gap:2px;flex:0 0 auto}
.modeswitch button{
  font-family:var(--disp);font-size:11px;letter-spacing:1.5px;font-weight:700;color:#96A2AE;
  background:transparent;border:none;padding:5px 14px;border-radius:999px;cursor:pointer;transition:.18s;
}
.modeswitch button.active{background:var(--blue);color:#fff;box-shadow:0 3px 10px rgba(39,157,215,.45)}

/* ---------- shell ---------- */
.shell{flex:1;display:flex;min-height:0;position:relative;z-index:1}
.sidebar{
  flex:0 0 256px;display:flex;flex-direction:column;min-height:0;
  background:var(--navy);border-right:1px solid rgba(255,255,255,.06);
  padding:26px 18px 18px;color:#E8EDF2;
}
.side-brand{display:flex;align-items:center;gap:12px;padding:0 6px 24px}
.mark{
  width:44px;height:44px;flex:0 0 auto;border-radius:12px;display:flex;align-items:center;justify-content:center;
  background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.35);
}
.mark svg{animation:chevFloat 4s ease-in-out infinite}
.side-brand .bt h1{font-family:var(--disp);font-size:22px;font-weight:700;letter-spacing:1.5px;line-height:1;text-transform:uppercase}
.side-brand .bt h1 span{color:var(--blue)}
.side-brand .bt small{display:block;font-family:var(--disp);font-size:9.5px;letter-spacing:3px;color:#5F6C79;margin-top:3px;font-weight:600}
.snav{display:flex;flex-direction:column;gap:3px;flex:1;overflow-y:auto}
.snav .lbl{font-family:var(--disp);font-size:10px;letter-spacing:3px;color:#4E5A66;font-weight:700;padding:16px 10px 8px}
.snav button{
  display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:11px;border:1px solid transparent;
  background:transparent;color:#96A2AE;font-size:13.5px;font-weight:500;cursor:pointer;text-align:left;transition:.15s;
}
.snav button svg{width:17px;height:17px;flex:0 0 auto;opacity:.8}
.snav button:hover{color:#fff;background:rgba(255,255,255,.05)}
.snav button.active{
  background:linear-gradient(135deg,rgba(39,157,215,.25),rgba(39,157,215,.1));
  border-color:rgba(39,157,215,.45);color:#fff;font-weight:600;
}
.snav button.active svg{opacity:1;color:var(--blue)}
.side-foot{border-top:1px solid rgba(255,255,255,.08);padding-top:14px;margin-top:14px}
.side-me{display:flex;align-items:center;gap:11px;padding:6px;border-radius:12px;cursor:pointer}
.side-me:hover{background:rgba(255,255,255,.05)}
.avatar{
  width:36px;height:36px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;
  font-weight:700;font-size:13px;color:#fff;
  background:linear-gradient(135deg,var(--blue),var(--blue-deep));
}
.side-me .nm{font-size:13px;font-weight:600;line-height:1.15;color:#fff}
.side-me .pl{font-family:var(--disp);font-size:10px;letter-spacing:2px;color:#7E8A96;font-weight:600}

/* ---------- main ---------- */
.main{flex:1;min-width:0;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;scroll-behavior:smooth}
.wrap{max-width:1060px;margin:0 auto;padding:34px 38px 70px}

.mobilebar{display:none}

/* ---------- tabbar (mobile) ---------- */
.tabbar{
  display:none;flex:0 0 auto;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);
  border-top:1px solid var(--line);padding:8px 4px calc(10px + env(safe-area-inset-bottom));z-index:40;
}
.tabbar button{
  flex:1;background:none;border:none;display:flex;flex-direction:column;align-items:center;gap:4px;
  color:var(--dim);cursor:pointer;font-size:9.5px;font-weight:600;letter-spacing:.4px;padding:3px 0;
}
.tabbar button svg{width:21px;height:21px}
.tabbar button.active{color:var(--blue-deep)}

/* ---------- typography / generic ---------- */
.eyebrow{font-family:var(--disp);font-size:12px;letter-spacing:3.5px;color:var(--blue-deep);font-weight:700;text-transform:uppercase}
.h-page{font-family:var(--disp);font-weight:700;font-size:40px;line-height:1;margin:6px 0 6px;text-transform:uppercase;letter-spacing:.5px}
.h-page em{color:var(--blue);font-style:normal}
.sub{color:var(--muted);font-size:14px;max-width:560px}
.sect{display:flex;align-items:baseline;justify-content:space-between;margin:34px 0 14px}
.sect h3{font-family:var(--disp);font-weight:700;font-size:21px;letter-spacing:1px;text-transform:uppercase}
.sect a{font-family:var(--disp);font-size:12px;letter-spacing:1.5px;color:var(--blue-deep);cursor:pointer;text-decoration:none;font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--rad);padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)}
.mono{font-family:var(--disp);font-weight:600}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:1fr 1fr}
.g3{grid-template-columns:repeat(3,1fr)}
.g4{grid-template-columns:repeat(4,1fr)}
.pill{display:inline-flex;align-items:center;gap:5px;font-family:var(--disp);font-size:10.5px;font-weight:700;letter-spacing:1.2px;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--muted);white-space:nowrap}
.pill.gold{background:rgba(39,157,215,.1);border-color:rgba(39,157,215,.4);color:var(--blue-deep)}
.pill.green{background:rgba(31,162,98,.08);border-color:rgba(31,162,98,.35);color:var(--green)}
.pill.red{background:rgba(214,69,69,.07);border-color:rgba(214,69,69,.3);color:var(--red)}
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:12px;cursor:pointer;
  font-size:13px;font-weight:600;padding:11px 20px;border:1px solid var(--line2);
  background:#fff;color:var(--ink);transition:.16s;white-space:nowrap;
}
.btn:hover{border-color:var(--blue);color:var(--blue-deep);transform:translateY(-1px)}
.btn.primary{
  background:linear-gradient(135deg,#3FB1E8,var(--blue) 55%,var(--blue-deep));
  color:#fff;border-color:transparent;box-shadow:0 6px 18px rgba(39,157,215,.35);
}
.btn.primary:hover{filter:brightness(1.06);color:#fff;transform:translateY(-1px)}
.btn.ghost{background:transparent}
.btn.sm{padding:7px 14px;font-size:12px;border-radius:10px}
.btn.danger{color:var(--red);border-color:rgba(214,69,69,.35)}
.btn.danger:hover{color:var(--red);border-color:var(--red)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.hair{height:1px;background:var(--line);margin:16px 0}

/* ---------- home hero (website-style) ---------- */
.hero{
  position:relative;border-radius:22px;overflow:hidden;margin-top:22px;
  background:var(--navy);box-shadow:0 24px 50px -20px rgba(11,25,40,.55);
  min-height:340px;display:flex;align-items:flex-end;
}
.hero .hero-img{
  position:absolute;inset:0;background-size:cover;background-position:center 30%;
  animation:kenburns 22s ease-in-out infinite alternate;will-change:transform;
}
.hero .hero-shade{position:absolute;inset:0;background:linear-gradient(75deg,rgba(6,14,24,.92) 20%,rgba(6,14,24,.55) 55%,rgba(6,14,24,.18));}
.hero .hin{position:relative;padding:34px 36px;color:#fff;max-width:600px}
.hero .tag{font-family:var(--disp);font-size:12px;letter-spacing:4px;color:var(--blue);font-weight:700}
.hero h2{font-family:var(--disp);font-weight:700;font-size:46px;line-height:.98;margin:12px 0 10px;text-transform:uppercase;letter-spacing:1px}
.hero h2 em{color:var(--blue);font-style:normal}
.hero p{color:rgba(255,255,255,.75);font-size:14px;max-width:460px;margin-bottom:22px}
.hero .hrow{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn:not(.primary){background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.25);color:#fff;backdrop-filter:blur(4px)}
.hero .btn:not(.primary):hover{background:rgba(255,255,255,.2);color:#fff}

.next-card{
  display:flex;align-items:center;gap:18px;border-radius:var(--rad);padding:18px;
  background:linear-gradient(135deg,rgba(39,157,215,.1),rgba(39,157,215,.02)),#fff;
  border:1px solid rgba(39,157,215,.35);box-shadow:var(--shadow);
}
.next-card .tblock{flex:0 0 auto;text-align:center;border-right:1px solid rgba(39,157,215,.3);padding-right:18px}
.next-card .tblock .d{font-family:var(--disp);font-size:11px;letter-spacing:2px;color:var(--blue-deep);font-weight:700}
.next-card .tblock .t{font-family:var(--disp);font-weight:700;font-size:26px;line-height:1.1;margin-top:2px}
.next-card .info{flex:1;min-width:0}
.next-card .info .n{font-weight:700;font-size:15.5px}
.next-card .info .c{color:var(--muted);font-size:12.5px;margin-top:2px}
.statgrid .card{padding:16px}
.stat .k{font-family:var(--disp);font-size:11px;letter-spacing:2px;color:var(--dim);font-weight:700;text-transform:uppercase}
.stat .v{font-family:var(--disp);font-weight:700;font-size:32px;line-height:1.05;margin-top:6px;color:var(--blue-ink)}
.stat .v small{font-size:15px;color:var(--muted);font-family:var(--sans);font-weight:600}
.stat .d{font-size:11.5px;color:var(--muted);margin-top:3px}
.qa{display:flex;flex-direction:column;align-items:flex-start;gap:10px;padding:16px;border-radius:var(--rad);cursor:pointer;background:var(--card);border:1px solid var(--line);transition:.16s;color:var(--ink);text-align:left;box-shadow:var(--shadow)}
.qa:hover{border-color:var(--blue);transform:translateY(-2px);box-shadow:0 12px 28px -12px rgba(39,157,215,.35)}
.qa .ic{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;background:rgba(39,157,215,.12);color:var(--blue-deep)}
.qa .ic svg{width:17px;height:17px}
.qa b{font-size:13px}
.qa span{font-size:11px;color:var(--muted)}
.ann{display:flex;gap:13px;padding:14px 4px;border-bottom:1px solid var(--line)}
.ann:last-child{border-bottom:none}
.ann .dot{width:7px;height:7px;border-radius:50%;background:var(--blue);margin-top:7px;flex:0 0 auto}
.ann .at{font-weight:600;font-size:13.5px}
.ann .ab{color:var(--muted);font-size:12.5px;margin-top:2px}
.ann .ad{font-family:var(--disp);font-weight:600;font-size:10px;color:var(--dim);letter-spacing:1.5px;margin-top:5px}

/* pathway */
.path{display:flex;align-items:center;gap:0;margin-top:16px}
.pstep{flex:1;text-align:center;position:relative}
.pstep .pdot{width:30px;height:30px;border-radius:50%;margin:0 auto;display:flex;align-items:center;justify-content:center;border:1px solid var(--line2);background:#fff;color:var(--dim);font-family:var(--disp);font-size:12px;font-weight:700;position:relative;z-index:2}
.pstep.done .pdot{background:linear-gradient(135deg,var(--blue),var(--blue-deep));border-color:transparent;color:#fff}
.pstep.now .pdot{border-color:var(--blue);color:var(--blue-deep);box-shadow:0 0 0 4px rgba(39,157,215,.18)}
.pstep .pl2{font-size:10.5px;font-weight:600;margin-top:8px;color:var(--muted)}
.pstep.now .pl2{color:var(--blue-deep)}
.pstep::after{content:'';position:absolute;top:15px;left:50%;width:100%;height:1px;background:var(--line2);z-index:1}
.pstep:last-child::after{display:none}
.pstep.done::after{background:var(--blue)}
.meter{height:6px;border-radius:99px;background:rgba(13,30,45,.07);overflow:hidden}
.meter i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--blue-deep),var(--blue))}

/* ---------- timetable ---------- */
.daytabs{display:flex;gap:6px;overflow-x:auto;padding:2px;margin:18px 0 4px}
.daytabs::-webkit-scrollbar{display:none}
.daytabs button{
  flex:1;min-width:76px;border-radius:13px;border:1px solid var(--line);background:#fff;
  color:var(--muted);cursor:pointer;padding:10px 6px;text-align:center;transition:.15s;box-shadow:var(--shadow);
}
.daytabs button:hover{border-color:var(--blue)}
.daytabs button .dw{font-family:var(--disp);font-size:10.5px;letter-spacing:2px;font-weight:700}
.daytabs button .dn{font-family:var(--disp);font-weight:700;font-size:20px;margin-top:2px;color:var(--ink)}
.daytabs button.active{background:var(--navy);border-color:var(--navy)}
.daytabs button.active .dw{color:var(--blue)}
.daytabs button.active .dn{color:#fff}
.filters{display:flex;gap:7px;flex-wrap:wrap;margin:14px 0 18px}
.fchip{
  font-family:var(--disp);font-size:11px;letter-spacing:1.2px;font-weight:700;padding:7px 14px;border-radius:999px;
  border:1px solid var(--line2);background:#fff;color:var(--muted);cursor:pointer;transition:.15s;
}
.fchip:hover{border-color:var(--blue);color:var(--blue-deep)}
.fchip.active{background:var(--blue);color:#fff;border-color:var(--blue);box-shadow:0 3px 10px rgba(39,157,215,.35)}
.cls{
  display:flex;align-items:center;gap:16px;padding:16px 18px;border-radius:var(--rad);
  background:var(--card);border:1px solid var(--line);margin-bottom:10px;position:relative;overflow:hidden;
  box-shadow:var(--shadow);transition:.16s;animation:fadeUp .4s cubic-bezier(.2,.7,.3,1) both;
}
.cls:hover{border-color:rgba(39,157,215,.5);transform:translateX(2px)}
.cls::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--dc,var(--blue))}
.cls .when{flex:0 0 78px;text-align:left}
.cls .when .st{font-family:var(--disp);font-weight:700;font-size:17px}
.cls .when .en{font-family:var(--disp);font-weight:600;font-size:11px;color:var(--dim);margin-top:1px}
.cls .cinfo{flex:1;min-width:0}
.cls .cinfo .cn{font-weight:700;font-size:14.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cls .cinfo .cc{color:var(--muted);font-size:12px;margin-top:3px}
.cls .cap{flex:0 0 auto;text-align:right;margin-right:4px}
.cls .cap .cn2{font-family:var(--disp);font-weight:600;font-size:11px;color:var(--dim);letter-spacing:.5px}
.cls .cap .meter{width:64px;margin-top:5px}
.lvl{font-family:var(--disp);font-size:9.5px;letter-spacing:1.2px;font-weight:700;padding:3px 8px;border-radius:6px;background:rgba(13,30,45,.06);color:var(--muted)}
.restday{padding:60px 20px;text-align:center;border:1px dashed var(--line2);border-radius:var(--rad);background:rgba(255,255,255,.5)}
.restday h4{font-family:var(--disp);font-size:26px;font-weight:700;color:var(--blue-deep);text-transform:uppercase;letter-spacing:1px}
.restday p{color:var(--muted);font-size:13px;margin-top:6px}

/* ---------- training ---------- */
.disc-row{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.disc-row .dn2{flex:0 0 110px;font-size:12.5px;font-weight:700}
.disc-row .meter{flex:1}
.disc-row .dv{flex:0 0 44px;text-align:right;font-family:var(--disp);font-weight:700;font-size:13px;color:var(--muted)}
.hist{display:flex;align-items:center;gap:14px;padding:13px 4px;border-bottom:1px solid var(--line)}
.hist:last-child{border-bottom:none}
.hist .hd2{flex:0 0 46px;text-align:center;border:1px solid var(--line2);border-radius:10px;padding:6px 0;background:var(--card2)}
.hist .hd2 .m{font-family:var(--disp);font-size:9px;letter-spacing:1.5px;color:var(--blue-deep);font-weight:700}
.hist .hd2 .d{font-family:var(--disp);font-weight:700;font-size:17px;line-height:1}
.hist .hn{flex:1;min-width:0}
.hist .hn b{font-size:13.5px}
.hist .hn span{display:block;font-size:11.5px;color:var(--muted);margin-top:1px}

/* ---------- membership ---------- */
.membercard{
  position:relative;border-radius:20px;padding:26px;overflow:hidden;color:#fff;
  background:url('https://www.apexmma.com.au/wp-content/uploads/apex_footer_bg-1.jpg') center/cover,var(--blue-deep);
  box-shadow:0 24px 50px -18px rgba(20,121,173,.6);
}
.membercard::before{
  content:'';position:absolute;inset:0;pointer-events:none;
  background:linear-gradient(120deg,rgba(6,25,40,.55),rgba(6,25,40,.15) 60%,rgba(6,25,40,.35));
}
.membercard>*{position:relative}
.membercard .mc-top{display:flex;justify-content:space-between;align-items:flex-start}
.membercard .mc-top .mark{width:40px;height:40px;border-radius:11px}
.membercard .mc-top .pill{background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.4);color:#fff;backdrop-filter:blur(4px)}
.membercard .mc-name{font-family:var(--disp);font-weight:700;font-size:27px;margin-top:26px;text-transform:uppercase;letter-spacing:1px}
.membercard .mc-plan{font-family:var(--disp);font-size:11px;letter-spacing:3px;color:rgba(255,255,255,.85);font-weight:700;margin-top:2px}
.membercard .mc-bot{display:flex;justify-content:space-between;align-items:flex-end;margin-top:24px}
.membercard .mc-id{font-family:var(--disp);font-weight:600;font-size:12px;letter-spacing:2px;color:rgba(255,255,255,.85)}
.membercard .mc-id span{font-size:10px;color:rgba(255,255,255,.55)}
.barcode{display:flex;gap:2px;align-items:flex-end;height:34px}
.barcode i{display:block;width:2px;background:#fff;opacity:.9}
.planrow{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:15px 4px;border-bottom:1px solid var(--line)}
.planrow:last-child{border-bottom:none}
.planrow .pn{font-weight:700;font-size:13.5px}
.planrow .pd{font-size:11.5px;color:var(--muted);margin-top:1px}
.planrow .pp{font-family:var(--disp);font-weight:700;font-size:22px;white-space:nowrap;color:var(--blue-ink)}
.planrow .pp small{font-size:11px;color:var(--muted);font-family:var(--sans);font-weight:600}

/* ---------- coaches / club ---------- */
.coach{display:flex;gap:16px;align-items:flex-start}
.coach .cav{
  width:58px;height:58px;flex:0 0 auto;border-radius:16px;display:flex;align-items:center;justify-content:center;

const $ = s=>document.querySelector(s);
function fmt(m){ let h=Math.floor(m/60), mm=m%60; const ap=h>=12?'PM':'AM'; h=h%12||12; return h+':'+String(mm).padStart(2,'0')+' '+ap; }
function hash(s){ let x=0; for(const ch of s) x=(x*31+ch.charCodeAt(0))>>>0; return x; }
function booked(c){ const base = 6+(hash(c.id)% (c.cap-9)); return Math.min(c.cap, base + (isBooked(c.id)?1:0)); }
function isBooked(id){ return S.bookings.includes(id); }
function canBook(c){
  if(c.lvl==='invite') return false;
  if(c.dis==='kids') return false;
  const rank={beg:0,all:0,int:1,intadv:1,adv:2,comp:3};
  const mine={beg:0,int:1,adv:2,comp:3}[S.level];
  return rank[c.lvl]<=mine;
}
function initials(n){ return n.split(' ').map(w=>w[0]).join('').slice(0,2).toUpperCase(); }
function planName(id){ return (PLANS.find(p=>p.id===id)||{}).n||id; }
function toast(msg){ const t=$('#toast'); t.innerHTML=msg; t.classList.add('on'); clearTimeout(t._to); t._to=setTimeout(()=>t.classList.remove('on'),2600); }
function lvlPill(l){ return `<span class="lvl">${LVL[l]}</span>`; }
function esc(s){ return String(s).replace(/[&<>"]/g, ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch])); }
/* count-up animation for stat numbers */
function animateCounts(){
  document.querySelectorAll('[data-count]').forEach(el=>{
    const target=parseFloat(el.dataset.count), dec=+(el.dataset.dec||0);
    const pre=el.dataset.pre||'', suf=el.dataset.suf||'';
    const t0=performance.now(), dur=850;
    function step(t){
      const p=Math.min(1,(t-t0)/dur), e=1-Math.pow(1-p,3);
      el.textContent=pre+(target*e).toFixed(dec)+suf;
      if(p<1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  });
}

  else if(c.lvl==='invite') action = `<span class="pill gold">${LVL.invite}</span>`;
  else if(lock) action = `<span class="pill" title="Unlocks at ${LVL[c.lvl]}">${I.lock.replace('<svg','<svg width="11" height="11"')} LOCKED</span>`;
  else if(full) action = `<span class="pill red">FULL</span>`;

  return `<div class="cls" style="--dc:${DIS[c.dis].c}">

/* =============== ACTIONS =============== */
function book(id){
  const c=TT.find(x=>x.id===id);
  if(!S.bookings.includes(id)){ S.bookings.push(id); save(); }
  toast(`<b>Booked.</b> ${esc(c.name)} — ${DAYS[c.d]} ${fmt(c.m)}`);
  render();
}
function unbook(id){
  const c=TT.find(x=>x.id===id);
  S.bookings=S.bookings.filter(b=>b!==id); save();
  toast(`Booking cancelled — ${esc(c.name)}.`);
  render();
}
function switchPlan(id){
  S.plan=id; save();
  toast(`<b>Plan updated.</b> You're now on ${planName(id)} — applies from your next billing cycle.`);
  render();
}
function postAnn(){
  const t=$('#bc-title').value.trim(), b=$('#bc-body').value.trim();
  if(!t){ toast('Give it a headline first.'); return; }
  S.anns.unshift({t, b:b||'—', d:'JUST NOW'}); save();
  toast('<b>Posted.</b> Live on every member home screen.');
  render();
}
function delAnn(i){ S.anns.splice(i,1); save(); render(); }

/* =============== MODALS =============== */
function modal(html){
  $('#modal-root').innerHTML=`<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal">${html}</div></div>`;
}
function closeModal(){ $('#modal-root').innerHTML=''; }

function qrSvg(){
  const h1=hash(S.name), h2=hash(S.memberId);
  let cells='';
  for(let r=0;r<21;r++)for(let c=0;c<21;c++){
    const finder=(r<7&&c<7)||(r<7&&c>13)||(r>13&&c<7);
    let f;
    if(finder){ const rr=r%14>6?r-14:r, cc=c%14>6?c-14:c; f=(rr===0||rr===6||cc===0||cc===6||(rr>1&&rr<5&&cc>1&&cc<5)); }
    else f=((h1>>((r*3+c)%31))^(h2>>((r+c*5)%29)))&1;
    cells+=`<i class="${f?'f':''}"></i>`;
  }
  return `<div class="qr">${cells}</div>`;
}
function openCheckin(){
  if(S.checkedInToday){
    modal(`<h3>Already checked in ✓</h3><div class="msub">You're on the mats today — nice work. Streak safe at ${S.streak} weeks.</div>
    <button class="btn" style="width:100%" onclick="closeModal()">Close</button>`);
    return;
  }
  modal(`<h3>Check in</h3><div class="msub">Scan at the front desk kiosk, or tap the button if reception waves you through.</div>
  ${qrSvg()}
  <div class="mono" style="text-align:center;font-size:12px;letter-spacing:2.5px;color:var(--muted);margin-bottom:18px">${S.memberId} · ${esc(S.name.toUpperCase())}</div>
  <button class="btn primary" style="width:100%" onclick="doCheckin()">I'm through — check me in</button>
  <button class="btn ghost" style="width:100%;margin-top:8px" onclick="closeModal()">Cancel</button>`);
}
function doCheckin(){
  S.checkedInToday=true;
  const d=todayD(); const nowM=new Date().getHours()*60+new Date().getMinutes();
  const cls = TT.filter(c=>c.d===d && isBooked(c.id)).sort((a,b)=>Math.abs(a.m-nowM)-Math.abs(b.m-nowM))[0]
           || TT.filter(c=>c.d===d && canBook(c)).sort((a,b)=>Math.abs(a.m-nowM)-Math.abs(b.m-nowM))[0];
  S.history.push({date:new Date().toISOString().slice(0,10), name:cls?cls.name:'Open training', dis:cls?cls.dis:'ng', coach:cls?cls.coach:'—'});
  save(); closeModal();
  toast(`<b>Checked in.</b> Enjoy the session, ${esc(S.name.split(' ')[0])}.`);
  render();
}
function openTrial(){
  modal(`<h3>Free 7-day trial</h3><div class="msub">Every class, every program, at their level — free for a full week. No card needed to start.</div>
  <input class="search" id="tr-name" placeholder="Their name">
  <input class="search" id="tr-phone" placeholder="Mobile number">

function openProfile(){

  <div class="mono" style="font-size:10.5px;letter-spacing:2px;margin-bottom:6px;color:var(--dim)">FULL NAME</div>

    ${[['beg','Beginner'],['int','Intermediate'],['adv','Advanced'],['comp','Competition']].map(([k,l])=>
      `<button class="fchip ${S.level===k?'active':''}" onclick="S.level='${k}';save();openProfile()">${l.toUpperCase()}</button>`).join('')}

}
function saveProfile(){
  const n=$('#pf-name').value.trim();
  if(n) S.name=n;
  save(); closeModal(); toast('<b>Saved.</b>'); render();

function resetDemo(){ localStorage.removeItem(LSKEY); location.reload(); }
function openRoster(id){
  const c=TT.find(x=>x.id===id); const b=booked(c);
  const names=[...STAFF_MEMBERS.map(m=>m[0])].sort((a,b2)=>hash(a+id)-hash(b2+id)).slice(0, Math.min(b, STAFF_MEMBERS.length));
  modal(`<h3>${esc(c.name)}</h3><div class="msub">${DAYS[c.d]} ${fmt(c.m)}–${fmt(c.m+c.dur)} · ${c.coach} · ${b}/${c.cap} booked</div>
  <div style="max-height:300px;overflow-y:auto">
    ${names.map((n,i)=>`<div class="feed"><div class="fa">${initials(n)}</div><div class="fb"><b>${n}</b></div><div class="ft">${i<Math.ceil(b/2)?'CHECKED IN':'BOOKED'}</div></div>`).join('')}
    ${b>names.length?`<div class="muted" style="font-size:12px;padding:10px 4px">+ ${b-names.length} more members</div>`:''}
  </div>
  <button class="btn" style="width:100%;margin-top:14px" onclick="closeModal()">Close</button>`);
}

/* =============== RENDER =============== */
function renderKeepFocus(el){
  const pos=el.selectionStart;
  render();
  const n=$('.search'); if(n){ n.focus(); n.setSelectionRange(pos,pos); }
}
function render(){
  renderNav();
  const views={home:vHome, timetable:vTimetable, train:vTrain, membership:vMembership, club:vClub,
               hq:vHQ, roster:vTimetable, members:vMembers, broadcast:vBroadcast};
  $('#main').innerHTML = `<div class="wrap">${(views[VIEW]||vHome)()}</div>`;
  /* staggered entrance */
  document.querySelectorAll('.wrap > *').forEach((el,i)=>{ el.style.animationDelay=(i*50)+'ms'; });
  animateCounts();
}

document.getElementById('side-mark').innerHTML = chevron(26,false);
loadState();
render();
</script>
