<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Words — Behaviour Log</title>
<meta name="description" content="Log behaviours of concern in seconds. The data becomes patterns the whole support team can see.">
<meta name="theme-color" content="#5B3FA8">
<meta property="og:title" content="My Words — Behaviour Log">
<meta property="og:description" content="See a behaviour of concern? Log it in seconds — it goes straight to the family and therapist.">
<link rel="icon" type="image/svg+xml" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512"><rect width="512" height="512" rx="112" fill="%235B3FA8"/><path d="M136 148h240a36 36 0 0 1 36 36v132a36 36 0 0 1-36 36H256l-64 52v-52h-56a36 36 0 0 1-36-36V184a36 36 0 0 1 36-36z" fill="%23fff"/><rect x="162" y="208" width="52" height="52" rx="12" fill="%23D9B83E"/><rect x="230" y="208" width="52" height="52" rx="12" fill="%234E9C57"/><rect x="298" y="208" width="52" height="52" rx="12" fill="%234C7FD0"/></svg>'>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF8F3; --card:#ffffff; --ink:#241e38; --muted:#6d6786; --line:#e8e2d6;
  --purple:#5B3FA8; --purple2:#4a3390; --soft:#efeaf9; --gold:#D9B83E; --green:#4E9C57; --blue:#4C7FD0;
  --danger:#b3402f; --ok:#2e7d4f;
  --c1:#5B3FA8; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100; --c5:#e87ba4; --c6:#2a78d6;
}
*{box-sizing:border-box} html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:"Atkinson Hyperlegible",Verdana,system-ui,sans-serif;font-size:17px;line-height:1.45;-webkit-font-smoothing:antialiased}
.wrap{max-width:720px;margin:0 auto;padding:16px 16px 90px}
header.top{display:flex;align-items:center;gap:12px;padding:14px 2px 10px}
header.top svg{flex:0 0 auto}
.brand{font-weight:700;letter-spacing:.1em;color:var(--purple);font-size:15px}
.sub{color:var(--muted);font-size:13px;margin-top:1px}
h1{font-size:26px;margin:10px 0 4px}
h2{font-size:19px;margin:0 0 10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 1px 2px rgba(36,30,56,.04)}
.q{font-weight:700;margin:2px 0 10px;font-size:17px}
.q .req{color:var(--danger);margin-left:4px}
.hint{color:var(--muted);font-size:14px;margin:-6px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:9px}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;font-size:16px;font-family:inherit;color:var(--ink);cursor:pointer;transition:all .12s ease;min-height:44px;text-align:left}
.chip.on{background:var(--purple);border-color:var(--purple);color:#fff;font-weight:700}
.chip:active{transform:scale(.97)}
textarea,input[type=text],input[type=email],input[type=password],input[type=datetime-local]{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:16px;font-family:inherit;background:#fff;color:var(--ink)}
textarea{min-height:92px;resize:vertical}
input:focus,textarea:focus,.chip:focus-visible{outline:3px solid #c9bcf0;outline-offset:1px}
.stars{display:flex;gap:8px}
.star{font-size:34px;background:none;border:none;cursor:pointer;color:#d8d2c4;padding:2px 4px;line-height:1}
.star.on{color:var(--gold)}
.starword{color:var(--muted);font-size:14px;min-height:20px;margin-top:4px}
.btn{display:block;width:100%;background:var(--purple);color:#fff;border:none;border-radius:14px;padding:16px;font-size:18px;font-weight:700;font-family:inherit;cursor:pointer;margin:6px 0}
.btn:active{background:var(--purple2)}
.btn.sec{background:#fff;color:var(--purple);border:1.5px solid var(--purple)}
.btn.small{width:auto;display:inline-block;padding:9px 16px;font-size:15px;margin:4px 6px 0 0}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--muted)}
.btn.danger{background:#fff;color:var(--danger);border:1.5px solid #e4b7ae}
.btn[disabled]{opacity:.55;pointer-events:none}
.err{background:#fbeae6;border:1px solid #e4b7ae;color:var(--danger);border-radius:12px;padding:12px 14px;margin:10px 0;display:none}
.okbox{background:#e8f4ec;border:1px solid #bcd9c6;color:var(--ok);border-radius:12px;padding:12px 14px;margin:10px 0;display:none}
.hide{display:none!important}
.center{text-align:center}
.bigtick{font-size:64px;margin:18px 0 6px}
.tabs{display:flex;gap:6px;background:#efe9df;padding:5px;border-radius:14px;margin:12px 0;position:sticky;top:8px;z-index:5}
.tab{flex:1;border:none;background:transparent;border-radius:10px;padding:10px 4px;font-family:inherit;font-size:15px;font-weight:700;color:var(--muted);cursor:pointer}
.tab.on{background:#fff;color:var(--purple);box-shadow:0 1px 3px rgba(36,30,56,.12)}
.entry{border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:10px 0;background:#fff}
.entry .when{font-size:13px;color:var(--muted)}
.entry .bchips{margin:6px 0 2px;display:flex;flex-wrap:wrap;gap:6px}
.bchip{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;color:#fff;background:var(--purple)}
.entry .meta{font-size:14px;color:var(--muted);margin-top:4px}
.entry .more{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.entry.open .more{display:block}
.entry .more b{display:block;font-size:13px;color:var(--muted);margin-top:8px}
.newdot{display:inline-block;background:var(--c2);color:#fff;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;vertical-align:2px;margin-left:6px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:12px 0}
.tile{background:#fff;border:1px solid var(--line);border-radius:14px;padding:13px}
.tile .n{font-size:26px;font-weight:700;color:var(--purple)}
.tile .l{font-size:13px;color:var(--muted)}
.chart{margin:16px 0}
.chart h3{font-size:15px;margin:0 0 8px;color:var(--ink)}
.brow{display:flex;align-items:center;gap:8px;margin:5px 0}
.brow .bl{flex:0 0 118px;font-size:13px;color:var(--muted);text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brow .bt{flex:1;height:22px;background:#f1ede4;border-radius:5px;position:relative}
.brow .bf{height:100%;border-radius:4px;background:var(--purple);min-width:2px}
.brow .bv{font-size:13px;font-weight:700;margin-left:8px;position:absolute;left:100%;top:1px;white-space:nowrap}
.cols{display:flex;align-items:flex-end;gap:5px;height:120px;padding-top:18px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}
.col .cf{width:100%;max-width:34px;background:var(--purple);border-radius:4px 4px 0 0;min-height:2px;position:relative}
.col .cv{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:700}
.col .cl{font-size:10.5px;color:var(--muted);white-space:nowrap}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}
.fchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;font-size:14px;font-family:inherit;cursor:pointer}
.fchip.on{background:var(--ink);border-color:var(--ink);color:#fff;font-weight:700}
.sharecard{border:1px solid var(--line);border-radius:14px;padding:14px;margin:10px 0;background:#fff}
.sharecard .code{font-size:22px;font-weight:700;letter-spacing:.18em;color:var(--purple)}
.qr{margin:10px 0}
.qr svg{width:150px;height:150px;border:1px solid var(--line);border-radius:10px;padding:6px;background:#fff}
.mini{font-size:13px;color:var(--muted)}
.rowline{display:flex;justify-content:space-between;align-items:center;gap:10px}
a{color:var(--purple)}
footer{color:var(--muted);font-size:12.5px;text-align:center;margin-top:26px}
@media print{ body *{display:none!important} #poster, #poster *{display:block!important} #poster{position:fixed;inset:0;background:#fff;text-align:center;padding-top:60px} #poster svg{width:300px;height:300px} }
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:11px 18px;border-radius:999px;font-size:15px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:50;max-width:90vw}
#toast.show{opacity:1}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

<script type="module">
import { createClient } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

const SB_URL = "https://ymuwuhvqqftgpxwhzoub.supabase.co";
const SB_KEY = "sb_publishable_-j-P1TcLeGZ6lGspru2YwA_3RxAlucJ";
const FN = SB_URL + "/functions/v1/mywords-log-api";
const sb = createClient(SB_URL, SB_KEY);

const DEFAULT_CONFIG = {
  relations: ["Mother","Father","School","Family","Carer","Therapist"],
  behaviours: ["Physical Aggression","Task Refusal","Excessive Eating","Absconding"],
  locations: ["At home","At school","Out in the community","In the car"],
  durations: ["1-5 minutes","5-10 minutes","10-30 minutes","30 minutes - 1 hr","1hr+"],
  antecedents: ["Access to preferred item was denied","Preferred activity ended","Asked to complete a non-preferred task","Transition between activities","Change in routine","Waiting for a preferred item or activity","Communication breakdown / unable to express needs","Sensory overload (noise, crowding, busy environment)","Unfamiliar person present","Told “No”","Food or snack request denied","Required to share or take turns","Demand placed by caregiver, teacher, or support worker","Access to phone/iPad restricted","Hair touched or personal space invaded","Asked to stop a preferred activity","Community outing or unfamiliar environment"],
  responses: ["Provided verbal reassurance","Used calm tone of voice","Reduced verbal demands","Provided processing time","Used visual supports","Used First-Then strategy","Offered choices","Redirected to preferred activity","Prompted AAC use","Prompted functional communication","Offered a break","Allowed space to regulate","Removed audience / reduced attention","Reduced environmental stimulation","Provided sensory support","Used distraction or redirection","Modified task demands","Broke task into smaller steps"]
};
const STARWORDS = {1:"Didn’t help this time",2:"Helped a little",3:"Helped",4:"Helped a lot",5:"Worked straight away"};
const COLORS = ["#5B3FA8","#eb6834","#1baf7a","#eda100","#e87ba4","#2a78d6"];
const TOD = [["Early",5,8],["Morning",8,11],["Midday",11,14],["Aftrnoon",14,17],["Evening",17,20],["Night",20,29]];
const DOW = ["Mon","Tue","Wed","Thu","Fri","Sat","Sun"];

const $ = (s,r=document)=>r.querySelector(s);
const view = $("#view");
const esc = s => String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const toast = m => { const t=$("#toast"); t.textContent=m; t.classList.add("show"); clearTimeout(t._h); t._h=setTimeout(()=>t.classList.remove("show"),2600); };
const fnCall = async (payload) => {
  const r = await fetch(FN,{method:"POST",headers:{"content-type":"application/json"},body:JSON.stringify(payload)});
  const d = await r.json().catch(()=>({ok:false,message:"Network problem — try again."}));
  return d;
};
const ago = ts => { const s=(Date.now()-new Date(ts).getTime())/1e3;
  if(s<90) return "just now"; if(s<3600) return Math.round(s/60)+" min ago";
  if(s<86400) return Math.round(s/3600)+" h ago"; if(s<86400*7) return Math.round(s/86400)+" d ago";
  return new Date(ts).toLocaleDateString(undefined,{day:"numeric",month:"short"}); };
const fmtWhen = ts => new Date(ts).toLocaleString(undefined,{weekday:"short",day:"numeric",month:"short",hour:"numeric",minute:"2-digit"});
const mkcode = n => { const A="ABCDEFGHJKMNPQRSTUVWXYZ23456789"; let s=""; const r=crypto.getRandomValues(new Uint8Array(n)); for(const b of r) s+=A[b%A.length]; return s; };
const mergeCfg = c => { const out={...DEFAULT_CONFIG}; for(const k in out){ if(Array.isArray(c?.[k]) && c[k].length) out[k]=c[k].map(String); } return out; };

/* ---------- router ---------- */
const qsParams = new URLSearchParams(location.search);
const formCode = qsParams.get("p") || qsParams.get("code");
if (formCode) formMode(formCode.trim()); else dashMode();

/* =================================================================
   FORM MODE — anyone with the link / QR, no account
================================================================= */
async function formMode(code){
  view.innerHTML = `<div class="card center"><div class="mini">Opening the log…</div></div>`;
  const cfgRes = await fnCall({action:"form_config", code});
  if(!cfgRes.ok){ view.innerHTML = `<div class="card"><h2>This link isn’t active</h2><p class="mini">${esc(cfgRes.message||"Ask the family for a fresh link.")}</p></div>`; return; }
  const cfg = mergeCfg(cfgRes.config);
  const name = cfgRes.person || "the child";
  $("#subTitle").textContent = `${name}’s behaviour log`;
  renderForm(code, name, cfg);
}

function chipGroup(id, items, multi=true){
  return `<div class="chips" id="${id}" data-multi="${multi?1:0}">` +
    items.map(x=>`<button type="button" class="chip" data-v="${esc(x)}">${esc(x)}</button>`).join("") + `</div>`;
}
function wireChips(root){
  root.querySelectorAll(".chips").forEach(g=>{
    g.addEventListener("click",e=>{
      const b=e.target.closest(".chip"); if(!b) return;
      if(g.dataset.multi==="1"){ b.classList.toggle("on"); }
      else { g.querySelectorAll(".chip").forEach(c=>c.classList.toggle("on",c===b)); }
    });
  });
}
const picked = id => [...document.querySelectorAll(`#${id} .chip.on`)].map(b=>b.dataset.v);
const localDT = d => { const p=n=>String(n).padStart(2,"0"); return `${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`; };

function renderForm(code, name, cfg){
  const savedName = localStorage.getItem("mwb_name")||"";
  view.innerHTML = `
  <h1>Log a behaviour</h1>
  <p class="hint">Takes under a minute. Everything you log goes straight to ${esc(name)}’s family and support team — thank you for helping us see the patterns.</p>
  <div class="card"><div class="q">When did it happen?<span class="req">*</span></div>
    <input type="datetime-local" id="fWhen" value="${localDT(new Date())}">
  </div>
  <div class="card"><div class="q">What is your relation to ${esc(name)}?<span class="req">*</span></div>
    ${chipGroup("fRel", cfg.relations, false)}
    <div style="margin-top:12px"><div class="q" style="font-size:15px">Your name <span class="mini">(optional)</span></div>
    <input type="text" id="fName" maxlength="80" placeholder="So the team knows who saw it" value="${esc(savedName)}"></div>
  </div>
  <div class="card"><div class="q">Which behaviour of concern did ${esc(name)} engage in?<span class="req">*</span></div>
    ${chipGroup("fBeh", cfg.behaviours)}
  </div>
  <div class="card"><div class="q">Where did this occur?<span class="req">*</span></div>
    ${chipGroup("fLoc", cfg.locations)}
  </div>
  <div class="card"><div class="q">What did ${esc(name)} do?<span class="req">*</span></div>
    <textarea id="fWhat" maxlength="2000" placeholder="Describe what happened, in your own words"></textarea>
  </div>
  <div class="card"><div class="q">How long did the behaviour continue?</div>
    ${chipGroup("fDur", cfg.durations, false)}
  </div>
  <div class="card"><div class="q">What happened BEFORE the incident?<span class="req">*</span></div>
    <p class="hint">Pick everything that applies — this is how the triggers show up.</p>
    ${chipGroup("fAnt", cfg.antecedents)}
  </div>
  <div class="card"><div class="q">How did you respond?<span class="req">*</span></div>
    ${chipGroup("fRes", cfg.responses)}
  </div>
  <div class="card"><div class="q">How effective was your response?<span class="req">*</span></div>
    <div class="stars" id="fEff">${[1,2,3,4,5].map(i=>`<button type="button" class="star" data-v="${i}" aria-label="${i} star">★</button>`).join("")}</div>
    <div class="starword" id="fEffW"></div>
  </div>
  <div class="card"><div class="q">Anything else about the incident? <span class="mini">(optional)</span></div>
    <textarea id="fNotes" maxlength="2000" placeholder="Anything that might matter — sleep, food, meds, environment…"></textarea>
  </div>
  <input type="text" id="fWeb" autocomplete="off" tabindex="-1" style="position:absolute;left:-5000px" aria-hidden="true">
  <div class="err" id="fErr"></div>
  <button class="btn" id="fGo">Send it to the team</button>`;
  wireChips(view);
  let eff = 0;
  $("#fEff").addEventListener("click",e=>{ const b=e.target.closest(".star"); if(!b) return; eff=+b.dataset.v;
    [...$("#fEff").children].forEach(s=>s.classList.toggle("on",+s.dataset.v<=eff)); $("#fEffW").textContent=STARWORDS[eff]||""; });
  $("#fGo").addEventListener("click", async ()=>{
    const err = $("#fErr"); err.style.display="none";
    const need = [];
    const rel = picked("fRel")[0]||"";
    const beh = picked("fBeh"); const loc = picked("fLoc"); const ant = picked("fAnt"); const res = picked("fRes");
    const what = $("#fWhat").value.trim();
    if(!$("#fWhen").value) need.push("when it happened");
    if(!rel) need.push("your relation");
    if(!beh.length) need.push("the behaviour");
    if(!loc.length) need.push("where it occurred");
    if(!what) need.push("what "+name+" did");
    if(!ant.length) need.push("what happened before");
    if(!res.length) need.push("how you responded");
    if(!eff) need.push("how effective it was");
    if(need.length){ err.textContent = "Still needed: " + need.join(", ") + "."; err.style.display="block"; err.scrollIntoView({block:"center"}); return; }
    const btn = $("#fGo"); btn.disabled = true; btn.textContent = "Sending…";
    localStorage.setItem("mwb_name", $("#fName").value.trim());
    const out = await fnCall({action:"log_submit", code, website:$("#fWeb").value, entry:{
      occurred_at: new Date($("#fWhen").value).toISOString(),
      reporter_name: $("#fName").value.trim(), reporter_relation: rel,
      behaviours: beh, locations: loc, antecedents: ant, what,
      duration: picked("fDur")[0]||"", responses: res, effectiveness: eff, notes: $("#fNotes").value.trim()
    }});
    if(!out.ok){ btn.disabled=false; btn.textContent="Send it to the team"; err.textContent = out.message || "Couldn’t send — please try again."; err.style.display="block"; return; }
    view.innerHTML = `<div class="card center"><div class="bigtick">✅</div><h2>Logged. Thank you.</h2>
      <p class="hint">It’s with ${esc(name)}’s family and support team now. Every entry helps the patterns show up.</p>
      <button class="btn sec" id="again">Log another</button></div>`;
    $("#again").addEventListener("click",()=>renderForm(code,name,cfg));
    window.scrollTo(0,0);
  });
}

    ? "Same login as the My Words talking app — one account for everything."
    : "One account runs the talking board AND the behaviour log. Therapists: create an account here, then enter the code the family gave you."}</p>
  <div class="card">
    <div class="q">Email</div><input type="email" id="aEmail" autocomplete="email">
    <div class="q" style="margin-top:12px">Password</div><input type="password" id="aPass" autocomplete="${mode==="in"?"current-password":"new-password"}">
    <div class="err" id="aErr"></div>
    <button class="btn" id="aGo">${mode==="in"?"Sign in":"Create account"}</button>
    <button class="btn ghost" id="aSwap">${mode==="in"?"First time? Create an account":"Already got an account? Sign in"}</button>
  </div>`;
  $("#aSwap").addEventListener("click",()=>renderAuth(mode==="in"?"up":"in"));
  $("#aGo").addEventListener("click", async ()=>{
    const email=$("#aEmail").value.trim(), password=$("#aPass").value;
    const err=$("#aErr"); err.style.display="none";
    if(!email||!password){ err.textContent="Email and password, please."; err.style.display="block"; return; }
    $("#aGo").disabled=true;
    const r = mode==="in" ? await sb.auth.signInWithPassword({email,password}) : await sb.auth.signUp({email,password});
    if(r.error){ $("#aGo").disabled=false; err.textContent=r.error.message; err.style.display="block"; return; }
    SESSION = r.data.session;
    if(!SESSION){ err.textContent="Check your email to confirm the account, then sign in."; err.style.display="block"; $("#aGo").disabled=false; return; }
    if(mode==="up"){ await sb.from("mw_profiles").upsert({id:SESSION.user.id, role:"carer"}); }
    await loadPerson();
  });
}

async function loadPerson(){
  view.innerHTML = `<div class="card center"><div class="mini">Loading…</div></div>`;
  const { data: people, error } = await sb.from("mw_people").select("id,name,owner,created_at").order("created_at");
  if(error){ view.innerHTML=`<div class="card">Couldn’t load. <button class="btn small sec" onclick="location.reload()">Retry</button></div>`; return; }
  if(!people || !people.length) return renderSetup();
  PERSON = people[0]; OWNED = PERSON.owner === SESSION.user.id;
  $("#subTitle").textContent = `${PERSON.name}’s behaviour log`;
  const { data: cfgRow } = await sb.from("mw_behaviour_config").select("config").eq("person_id",PERSON.id).maybeSingle();
  if(cfgRow) CFG = mergeCfg(cfgRow.config);
  else if(OWNED){ await sb.from("mw_behaviour_config").insert({person_id:PERSON.id, owner:SESSION.user.id, config:DEFAULT_CONFIG}); CFG = {...DEFAULT_CONFIG}; }
  await loadLogs();
  renderDash("inbox");
}

function renderSetup(){
  view.innerHTML = `
  <h1>Set things up</h1>
  <div class="card">
    <h2>I’m the family</h2>
    <p class="hint">Add your child — this creates their board in the My Words talking app too.</p>
    <div class="q">Child’s first name</div><input type="text" id="sName" maxlength="40" placeholder="e.g. Asiya">
    <div class="err" id="sErr"></div>
    <button class="btn" id="sGo">Create</button>
  </div>
  <div class="card">
    <h2>I’m a therapist / support worker</h2>
    <p class="hint">Enter the access code the family gave you.</p>
    <div class="q">Access code</div><input type="text" id="tCode" maxlength="16" placeholder="e.g. QK7M2PX3" style="letter-spacing:.15em;text-transform:uppercase">
    <div class="err" id="tErr"></div>
    <button class="btn sec" id="tGo">Link me to the family</button>
  </div>
  <div class="card center"><button class="btn ghost" id="sOut">Sign out</button></div>`;
  $("#sOut").addEventListener("click", async()=>{ await sb.auth.signOut(); location.reload(); });
  $("#sGo").addEventListener("click", async ()=>{
    const name=$("#sName").value.trim(); const err=$("#sErr"); err.style.display="none";
    if(!name){ err.textContent="What’s their name?"; err.style.display="block"; return; }
    $("#sGo").disabled=true;
    const { data, error } = await sb.from("mw_people").insert({owner:SESSION.user.id, name, settings:{}}).select().single();
    if(error){ err.textContent=error.message; err.style.display="block"; $("#sGo").disabled=false; return; }
    await sb.from("mw_behaviour_config").insert({person_id:data.id, owner:SESSION.user.id, config:DEFAULT_CONFIG});
    await sb.from("mw_shares").insert([
      {owner:SESSION.user.id, person_id:data.id, role:"logger", code:mkcode(8), label:"Family & school"},
      {owner:SESSION.user.id, person_id:data.id, role:"therapist", code:mkcode(8), label:"Therapist"}
    ]);
    await loadPerson();
  });
  $("#tGo").addEventListener("click", async ()=>{
    const code=$("#tCode").value.trim().toUpperCase(); const err=$("#tErr"); err.style.display="none";
    if(!code){ err.textContent="Enter the code."; err.style.display="block"; return; }
    $("#tGo").disabled=true;
    const out = await fnCall({action:"share_claim", code, token:SESSION.access_token});
    if(!out.ok){ err.textContent=out.message; err.style.display="block"; $("#tGo").disabled=false; return; }
    toast(`Linked to ${out.person}’s log`);
    await loadPerson();
  });
}

async function loadLogs(){
  const { data } = await sb.from("mw_behaviour_logs").select("*").eq("person_id",PERSON.id).order("occurred_at",{ascending:false}).limit(1000);
  LOGS = data || [];
}
async function loadShares(){
  if(!OWNED){ SHARES=[]; return; }
  const { data } = await sb.from("mw_shares").select("*").eq("person_id",PERSON.id).order("created_at");
  SHARES = (data||[]).filter(s=>!s.revoked);
}

function renderDash(tab){
  const seenKey = "mwb_seen_"+PERSON.id;
  const lastSeen = localStorage.getItem(seenKey) || "1970-01-01";
  const unread = LOGS.filter(l=>l.created_at>lastSeen).length;
  view.innerHTML = `
  <div class="rowline"><h1 style="margin:6px 0">${esc(PERSON.name)}</h1>
    <button class="btn small sec" id="dLog">＋ Log now</button></div>
  <div class="tabs" role="tablist">
    <button class="tab ${tab==="inbox"?"on":""}" data-t="inbox" role="tab">Inbox${unread?` <span class="newdot">${unread}</span>`:""}</button>
    <button class="tab ${tab==="patterns"?"on":""}" data-t="patterns" role="tab">Patterns</button>
    ${OWNED?`<button class="tab ${tab==="share"?"on":""}" data-t="share" role="tab">Share</button>`:""}
    <button class="tab ${tab==="settings"?"on":""}" data-t="settings" role="tab">Set-up</button>
  </div>
  <div id="tabBody"></div>`;
  view.querySelector(".tabs").addEventListener("click",e=>{ const b=e.target.closest(".tab"); if(b) renderDash(b.dataset.t); });
  $("#dLog").addEventListener("click", async ()=>{
    await loadShares();
    const lg = SHARES.find(s=>s.role==="logger");
    if(lg) location.href = "?p="+lg.code;
    else toast("Make a logging link in Share first");
  });
  if(tab==="inbox") renderInbox(lastSeen, seenKey);
  if(tab==="patterns") renderPatterns();
  if(tab==="share") renderShare();
  if(tab==="settings") renderSettings();
}

function entryHTML(l, lastSeen){
  const bcols = Object.fromEntries(CFG.behaviours.map((b,i)=>[b,COLORS[i%COLORS.length]]));
  const isNew = l.created_at>lastSeen;
  return `<div class="entry" data-id="${l.id}">
    <div class="rowline"><div class="when">${fmtWhen(l.occurred_at)} · ${ago(l.occurred_at)}${isNew?'<span class="newdot">NEW</span>':""}</div>
      <div class="when">${l.effectiveness?'★'.repeat(l.effectiveness):""}</div></div>
    <div class="bchips">${l.behaviours.map(b=>`<span class="bchip" style="background:${bcols[b]||"#5B3FA8"}">${esc(b)}</span>`).join("")}</div>
    <div class="meta">${esc([l.reporter_relation,l.reporter_name].filter(Boolean).join(" · "))}${l.locations.length?" · "+esc(l.locations.join(", ")):""}${l.duration?" · "+esc(l.duration):""}</div>
    <div class="more">
      <b>What happened</b>${esc(l.what)||"—"}
      <b>Before the incident</b>${l.antecedents.map(esc).join(" · ")||"—"}
      <b>Response</b>${l.responses.map(esc).join(" · ")||"—"}${l.effectiveness?` <span class="mini">(${STARWORDS[l.effectiveness]||l.effectiveness+"★"})</span>`:""}
      ${l.notes?`<b>Notes</b>${esc(l.notes)}`:""}
      ${OWNED?`<button class="btn small danger" data-del="${l.id}" style="margin-top:10px">Delete entry</button>`:""}
    </div>
  </div>`;
}

function renderInbox(lastSeen, seenKey){
  const b = $("#tabBody");
  if(!LOGS.length){ b.innerHTML = `<div class="card center"><h2>No entries yet</h2><p class="hint">Share the logging link (Share tab) with school and carers — entries land here the second they’re sent.</p></div>`; return; }
  b.innerHTML = `
    <div class="rowline" style="margin:4px 0 2px">
      <span class="mini">${LOGS.length} entr${LOGS.length===1?"y":"ies"}</span>
      <span><button class="btn small ghost" id="markRead">Mark all read</button>
      <button class="btn small ghost" id="csv">⬇ Spreadsheet</button></span>
    </div>
    ${LOGS.map(l=>entryHTML(l,lastSeen)).join("")}`;
  b.addEventListener("click", async e=>{
    const del = e.target.closest("[data-del]");
    if(del){ if(!confirm("Delete this entry for good?")) return;
      await sb.from("mw_behaviour_logs").delete().eq("id",del.dataset.del);
      LOGS = LOGS.filter(x=>String(x.id)!==String(del.dataset.del)); toast("Deleted"); renderDash("inbox"); return; }
    const en = e.target.closest(".entry"); if(en) en.classList.toggle("open");
  });
  $("#markRead").addEventListener("click",()=>{ localStorage.setItem(seenKey,new Date().toISOString()); renderDash("inbox"); });
  $("#csv").addEventListener("click",()=>{
    const cols=["occurred_at","reporter_name","reporter_relation","behaviours","locations","antecedents","what","duration","responses","effectiveness","notes"];
    const cell=v=>Array.isArray(v)?`"${v.join("; ").replace(/"/g,'""')}"`:`"${String(v??"").replace(/"/g,'""')}"`;
    const csv=[cols.join(","),...LOGS.map(l=>cols.map(c=>cell(l[c])).join(","))].join("\r\n");
    const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));
    a.download=`${PERSON.name.toLowerCase().replace(/\W+/g,"-")}-behaviour-log.csv`; a.click();
  });
}

/* ---------- patterns ---------- */
let F_RANGE = 84, F_BEH = null;
function renderPatterns(){
  const b=$("#tabBody");
  if(!LOGS.length){ b.innerHTML=`<div class="card center"><h2>No data yet</h2><p class="hint">Patterns appear as entries come in — frequency, triggers, time of day, what works.</p></div>`; return; }
  const now=Date.now();
  const inRange = LOGS.filter(l=> (F_RANGE===0 || now-new Date(l.occurred_at).getTime() < F_RANGE*864e5));
  const rows = inRange.filter(l=> !F_BEH || l.behaviours.includes(F_BEH));
  const weekMs=7*864e5;
  const thisW = rows.filter(l=>now-new Date(l.occurred_at)<weekMs).length;
  const lastW = rows.filter(l=>{const d=now-new Date(l.occurred_at);return d>=weekMs&&d<2*weekMs}).length;
  const count = (list)=>{ const m={}; list.forEach(x=>m[x]=(m[x]||0)+1); return Object.entries(m).sort((a,b)=>b[1]-a[1]); };
  const antTop = count(rows.flatMap(l=>l.antecedents));
  const behTop = count(inRange.flatMap(l=>l.behaviours));
  const effBy = {}; rows.forEach(l=>{ if(!l.effectiveness) return; l.responses.forEach(r=>{ (effBy[r]=effBy[r]||[]).push(l.effectiveness); }); });
  const works = Object.entries(effBy).filter(([,v])=>v.length>=2).map(([k,v])=>[k,v.reduce((a,b)=>a+b,0)/v.length,v.length]).sort((a,b)=>b[1]-a[1]);
  const trendArrow = lastW ? (thisW>lastW?"↑":(thisW<lastW?"↓":"→")) : "";
  const bcols = Object.fromEntries(CFG.behaviours.map((x,i)=>[x,COLORS[i%COLORS.length]]));
  const hbar = (rows2,color)=>rows2.map(([k,v,n])=>{
    const max=rows2[0][1]||1;
    const val = n!==undefined ? v.toFixed(1)+"★ <span class='mini'>×"+n+"</span>" : v;
    return `<div class="brow" title="${esc(k)}: ${n!==undefined?v.toFixed(2)+" avg of "+n:v}"><div class="bl">${esc(k)}</div><div class="bt"><div class="bf" style="width:${Math.max(3,v/max*100)}%;background:${color||"var(--purple)"}"></div><span class="bv">${val}</span></div></div>`; }).join("");
  // weekly columns (last 10 weeks)
  const weeks=[]; for(let i=9;i>=0;i--){ const start=now-(i+1)*weekMs, end=now-i*weekMs;
    const n=rows.filter(l=>{const t=new Date(l.occurred_at).getTime();return t>=start&&t<end}).length;
    const d=new Date(end); weeks.push([`${d.getDate()}/${d.getMonth()+1}`,n]); }
  const wmax=Math.max(1,...weeks.map(w=>w[1]));
  const todC=TOD.map(([lab,a,z])=>[lab,rows.filter(l=>{let h=new Date(l.occurred_at).getHours(); if(h<5)h+=24; return h>=a&&h<z}).length]);
  const tmax=Math.max(1,...todC.map(t=>t[1]));
  const dowC=DOW.map((d,i)=>[d,rows.filter(l=>(new Date(l.occurred_at).getDay()+6)%7===i).length]);
  const dmax=Math.max(1,...dowC.map(t=>t[1]));
  const cols = (data,max)=>`<div class="cols">`+data.map(([l,v])=>`<div class="col" title="${esc(l)}: ${v}"><div class="cf" style="height:${Math.max(2,v/max*96)}px"><span class="cv">${v||""}</span></div><span class="cl">${esc(l)}</span></div>`).join("")+`</div>`;
  b.innerHTML = `
  <div class="filters">
    ${[["4 weeks",28],["12 weeks",84],["All time",0]].map(([l,v])=>`<button class="fchip ${F_RANGE===v?"on":""}" data-r="${v}">${l}</button>`).join("")}
    <span style="flex-basis:100%"></span>
    <button class="fchip ${!F_BEH?"on":""}" data-b="">All behaviours</button>
    ${CFG.behaviours.map(x=>`<button class="fchip ${F_BEH===x?"on":""}" data-b="${esc(x)}">${esc(x)}</button>`).join("")}
  </div>
  <div class="tiles">
    <div class="tile"><div class="n">${rows.length}</div><div class="l">incidents in this period</div></div>
    <div class="tile"><div class="n">${thisW} <span style="font-size:16px">${trendArrow}</span></div><div class="l">this week (last week: ${lastW})</div></div>
    <div class="tile"><div class="n" style="font-size:16px;line-height:1.3">${esc(antTop[0]?.[0]||"—")}</div><div class="l">most common trigger</div></div>
    <div class="tile"><div class="n" style="font-size:16px;line-height:1.3">${esc(works[0]?.[0]||"—")}</div><div class="l">most effective response</div></div>
  </div>
  <div class="card chart"><h3>Behaviours · how often</h3>${behTop.length?behTop.map(([k,v])=>{const max=behTop[0][1]||1;return `<div class="brow" title="${esc(k)}: ${v}"><div class="bl">${esc(k)}</div><div class="bt"><div class="bf" style="width:${Math.max(3,v/max*100)}%;background:${bcols[k]||"var(--purple)"}"></div><span class="bv">${v}</span></div></div>`}).join(""):"<p class='mini'>Nothing in this period.</p>"}</div>
  <div class="card chart"><h3>Week by week${F_BEH?` · ${esc(F_BEH)}`:""}</h3>${cols(weeks,wmax)}</div>
  <div class="card chart"><h3>Time of day</h3>${cols(todC,tmax)}</div>
  <div class="card chart"><h3>Day of the week</h3>${cols(dowC,dmax)}</div>
  <div class="card chart"><h3>What sets it off${F_BEH?` · ${esc(F_BEH)}`:""}</h3><p class="mini" style="margin-top:-4px">What happened right before, most common first.</p>${hbar(antTop.slice(0,8))||"<p class='mini'>—</p>"}</div>
  <div class="card chart"><h3>What works${F_BEH?` · ${esc(F_BEH)}`:""}</h3><p class="mini" style="margin-top:-4px">Average effectiveness of each response (used at least twice).</p>${works.length?hbar(works.slice(0,8).map(([k,v,n])=>[k,v,n]),"var(--c3)"):"<p class='mini'>Needs a few more rated entries.</p>"}</div>`;
  b.querySelector(".filters").addEventListener("click",e=>{
    const r=e.target.closest("[data-r]"); const bb=e.target.closest("[data-b]");
    if(r){ F_RANGE=+r.dataset.r; renderPatterns(); }
    else if(bb){ F_BEH=bb.dataset.b||null; renderPatterns(); }
  });
}

/* ---------- share ---------- */
async function renderShare(){
  const b=$("#tabBody"); b.innerHTML=`<div class="card center mini">Loading…</div>`;
  await loadShares();
  const base = location.origin + location.pathname;
  const qrSvg = (txt)=>{ try{ const q=qrcode(0,"M"); q.addData(txt); q.make(); return q.createSvgTag({cellSize:4,margin:2,scalable:true}); }catch(e){ return ""; } };
  const card = s => {
    const link = base+"?p="+s.code;
    if(s.role==="logger") return `<div class="sharecard">
      <div class="rowline"><b>📝 ${esc(s.label||"Logging link")}</b><button class="btn small danger" data-rev="${s.id}">Revoke</button></div>
      <p class="mini">Anyone with this link or QR can log a behaviour — no account needed. Give it to school, carers, family.</p>
      <div class="qr">${qrSvg(link)}</div>
      <button class="btn small sec" data-copy="${esc(link)}">Copy link</button>
      <button class="btn small ghost" data-print="${esc(link)}" data-label="${esc(s.label)}">🖨 Print QR poster</button>
    </div>`;
    return `<div class="sharecard">
      <div class="rowline"><b>🩺 ${esc(s.label||"Therapist access")}</b><button class="btn small danger" data-rev="${s.id}">Revoke</button></div>
      <p class="mini">${s.claimed_by?"✅ Claimed — they can see the inbox and patterns live.":"Give the therapist this code. They create an account at "+esc(base)+" and enter it."}</p>
      <div class="code">${esc(s.code)}</div>
      <button class="btn small sec" data-copy="${esc(s.code)}">Copy code</button>
    </div>`;
  };
  b.innerHTML = `
    <p class="hint">Two kinds of access: a <b>logging link</b> (anyone can report, nobody can read) and a <b>therapist code</b> (full read access to inbox + patterns).</p>
    ${SHARES.map(card).join("")||""}
    <div class="card"><h2>New access</h2>
      <input type="text" id="shLabel" maxlength="40" placeholder="Label — e.g. School, Nan’s house, OT">
      <button class="btn small sec" id="mkLog">＋ Logging link</button>
      <button class="btn small sec" id="mkTher">＋ Therapist code</button>
    </div>`;
  const mint = async (role)=>{
    const label=$("#shLabel").value.trim()||(role==="logger"?"Logging link":"Therapist");
    const { error } = await sb.from("mw_shares").insert({owner:SESSION.user.id, person_id:PERSON.id, role, code:mkcode(8), label});
    if(error) toast("Couldn’t create it"); else { toast("Created"); renderShare(); }
  };
  $("#mkLog").addEventListener("click",()=>mint("logger"));
  $("#mkTher").addEventListener("click",()=>mint("therapist"));
  b.addEventListener("click", async e=>{
    const c=e.target.closest("[data-copy]"); const r=e.target.closest("[data-rev]"); const p=e.target.closest("[data-print]");
    if(c){ try{ await navigator.clipboard.writeText(c.dataset.copy); toast("Copied"); }catch{ prompt("Copy this:",c.dataset.copy); } }
    if(r){ if(!confirm("Revoke this access? The link/code stops working immediately.")) return;
      await sb.from("mw_shares").update({revoked:true}).eq("id",r.dataset.rev); toast("Revoked"); renderShare(); }
    if(p){ $("#poster").innerHTML = `<h1 style="font-family:inherit">${esc(PERSON.name)}’s Behaviour Log</h1>
      <p>See a behaviour of concern? Scan and log it — takes under a minute.</p>${qrSvg(p.dataset.print)}<p>${esc(p.dataset.label||"")}</p>`;
      window.print(); }
  });
}

/* ---------- settings ---------- */
function renderSettings(){
  const b=$("#tabBody");
  const lists=[["behaviours","Behaviours of concern"],["antecedents","What happened before (triggers)"],["responses","Response strategies"],["locations","Places"],["durations","Durations"],["relations","Relations"]];
  b.innerHTML = `
    ${OWNED?`<div class="card"><h2>${esc(PERSON.name)}</h2>
      <div class="q">Name</div><input type="text" id="pName" value="${esc(PERSON.name)}" maxlength="40">
      <button class="btn small sec" id="pSave">Save name</button></div>
    <div class="card"><h2>The form’s options</h2>
      <p class="hint">One per line. These update the logging form for everyone instantly — add new behaviours or strategies as ${esc(PERSON.name)}’s plan evolves.</p>
      ${lists.map(([k,l])=>`<div class="q" style="margin-top:12px">${l}</div><textarea data-cfg="${k}" rows="4">${esc(CFG[k].join("\n"))}</textarea>`).join("")}
      <button class="btn" id="cfgSave">Save options</button></div>`
    :`<div class="card"><p class="hint">You have therapist access: live inbox and patterns, spreadsheet export. Only the family can change the form or share access.</p></div>`}
    <div class="card"><button class="btn ghost" id="dOut">Sign out</button></div>`;
  if(OWNED){
    $("#pSave").addEventListener("click", async ()=>{
      const name=$("#pName").value.trim(); if(!name) return;
      await sb.from("mw_people").update({name}).eq("id",PERSON.id); PERSON.name=name; toast("Saved"); renderDash("settings");
    });
    $("#cfgSave").addEventListener("click", async ()=>{
      const cfg={}; b.querySelectorAll("[data-cfg]").forEach(t=>{ cfg[t.dataset.cfg]=t.value.split("\n").map(s=>s.trim()).filter(Boolean).slice(0,40); });
      const { error } = await sb.from("mw_behaviour_config").upsert({person_id:PERSON.id, owner:SESSION.user.id, config:cfg, updated_at:new Date().toISOString()});
      if(error){ toast("Couldn’t save"); return; }
      CFG=mergeCfg(cfg); toast("Options saved");
    });
  }
  $("#dOut").addEventListener("click", async ()=>{ await sb.auth.signOut(); location.href=location.pathname; });
}
</script>
</body>
</html>
