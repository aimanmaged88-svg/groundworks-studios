<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0B0A08">
<title>Clutch HQ</title>
<link rel="icon" href="favicon.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --disp:"Big Shoulders Display","IBM Plex Sans",sans-serif;
  color-scheme:dark;
  --bg:#0B0A08; --side:#0F0D0B; --panel:#15130F; --panel-2:#1B1814; --hover:#221E18;
  --line:rgba(255,240,220,.07); --line-2:rgba(255,240,220,.14);
  --ink:#F6F1E9; --ink-2:#BAB1A4; --muted:#857B6F;
  --accent:#FF8A1E; --accent-2:#E36F00; --accent-ink:#1A0C00; --accent-wash:rgba(255,138,30,.12); --accent-line:rgba(255,138,30,.38);
  --gold:#E8C21C;
  --good:#46C272; --warn:#F2B01E; --crit:#F2584B;
  --good-wash:rgba(70,194,114,.12); --warn-wash:rgba(242,176,30,.12); --crit-wash:rgba(242,88,75,.12);
  --shadow:0 24px 60px -20px rgba(0,0,0,.75);
  --r:10px;
}
:root[data-theme="light"]{
  color-scheme:light;
  --bg:#F5F2EC; --side:#EEE9E1; --panel:#FFFFFF; --panel-2:#FAF8F4; --hover:#F3EFE8;
  --line:rgba(40,25,10,.08); --line-2:rgba(40,25,10,.16);
  --ink:#17120C; --ink-2:#544A3E; --muted:#85796B;
  --accent:#C35803; --accent-2:#A34700; --accent-ink:#FFFFFF; --accent-wash:rgba(195,88,3,.08); --accent-line:rgba(195,88,3,.35);
  --gold:#A88400;
  --good:#1E8A47; --warn:#A86A00; --crit:#C8372D;
  --good-wash:rgba(30,138,71,.09); --warn-wash:rgba(168,106,0,.09); --crit-wash:rgba(200,55,45,.08);
  --shadow:0 24px 50px -24px rgba(40,25,10,.35);
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:400 14px/1.45 var(--sans);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:inherit}
svg{display:block}
.mono{font-family:var(--mono)}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)} .ink2{color:var(--ink-2)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:5px}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 18px;text-decoration:none}
.brand img{width:44px;height:44px;object-fit:contain;flex:none}
.brand b{display:block;font:800 24px/1 var(--disp);letter-spacing:.01em;text-transform:uppercase}
.brand span{display:block;font:500 11px var(--mono);color:var(--muted);margin-top:3px;letter-spacing:.04em}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:11px;height:38px;padding:0 10px;border-radius:8px;text-decoration:none;color:var(--ink-2);font-weight:500}
.nav a svg{width:18px;height:18px;flex:none}
.nav a:hover{background:var(--hover);color:var(--ink)}
.nav a.on{background:var(--accent-wash);color:var(--accent)}
.nav a .ct{margin-left:auto;font:600 11px var(--mono);background:var(--accent);color:var(--accent-ink);border-radius:10px;padding:1px 7px}
.side .foot{margin-top:auto;padding:12px 8px 0;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
.demo{font-size:12px;color:var(--muted);line-height:1.4}
.demo b{color:var(--warn);font-weight:600}
.side .row{display:flex;gap:6px}

main{min-width:0;padding:26px 32px 60px}
.ph{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.ph h1{margin:0;font:800 40px/0.95 var(--disp);letter-spacing:.005em;text-transform:uppercase}
.ph .sub{color:var(--ink-2);font-size:13.5px;margin-top:6px}
.ph .acts{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center}

.btn{height:36px;padding:0 13px;border-radius:8px;border:1px solid var(--line-2);background:var(--panel);cursor:pointer;display:inline-flex;align-items:center;gap:7px;
  font-size:13px;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn svg{width:16px;height:16px;flex:none}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.pri:hover{background:var(--accent-2);border-color:var(--accent-2)}
.btn.sm{height:30px;padding:0 10px;font-size:12.5px}
.btn.icon{width:36px;padding:0;justify-content:center}
.btn.ghost{background:none;border-color:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--crit)}
.seg{display:inline-flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;background:var(--panel)}
.seg button{border:0;background:none;height:34px;padding:0 12px;cursor:pointer;font-size:13px;color:var(--ink-2)}
.seg button.on{background:var(--accent-wash);color:var(--accent);font-weight:600}
.seg button+button{border-left:1px solid var(--line)}

.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c12{grid-column:span 12}.c8{grid-column:span 8}.c7{grid-column:span 7}.c6{grid-column:span 6}.c5{grid-column:span 5}.c4{grid-column:span 4}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 20px;min-width:0}
.card.flush{padding:0}
.ch{display:flex;align-items:baseline;gap:4px 12px;flex-wrap:wrap;margin-bottom:12px}
.card.flush .ch{padding:16px 20px 0}
.ch h2{margin:0;font-size:14px;font-weight:600}
.ch .sub{font-size:12.5px;color:var(--muted)}
.ch .right{margin-left:auto;font:500 11.5px var(--mono);color:var(--muted)}

.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px;margin-bottom:16px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;min-width:0;text-align:left;cursor:default}
button.kpi{cursor:pointer}
button.kpi:hover{border-color:var(--line-2)}
.kpi .l{font-size:12.5px;color:var(--ink-2)}
.kpi .v{font-size:26px;font-weight:600;letter-spacing:-.02em;line-height:1.15;margin-top:6px}
.kpi .v small{font-size:13px;color:var(--muted);font-weight:500;letter-spacing:0}
.kpi .s{font-size:12px;color:var(--muted);margin-top:3px}
.kpi.hot .v{color:var(--accent)}

/* alerts */
.alerts{display:flex;flex-direction:column}
.al{display:grid;grid-template-columns:22px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.al:first-child{border-top:0;padding-top:2px}
.al svg{width:16px;height:16px}
.al.crit svg{color:var(--crit)} .al.warn svg{color:var(--warn)} .al.info svg{color:var(--accent)}
.al .t{font-size:13.5px}
.al .t b{font-weight:600}
.al.done{opacity:.65} .al.done svg{color:var(--good)}
.stepn{width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font:600 11px var(--mono);background:var(--accent-wash);color:var(--accent);border:1px solid var(--accent-line)}
.al .m{font-size:12px;color:var(--muted);margin-top:1px}

/* week board */
.board{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.day{min-width:0;display:flex;flex-direction:column;gap:8px}
.dh{padding:8px 10px;border-radius:8px;background:var(--panel);border:1px solid var(--line)}
.dh b{display:block;font:800 20px/1 var(--disp);text-transform:uppercase;letter-spacing:.02em}
.dh span{display:block;font:400 11px var(--mono);color:var(--muted);margin-top:4px}
.day.today .dh{border-color:var(--accent-line);background:var(--accent-wash)}
.day.today .dh b{color:var(--accent)}
.day.past{opacity:.72}
.sess{text-align:left;width:100%;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 10px 10px;cursor:pointer;position:relative;
  border-left:3px solid var(--line-2);display:block}
.sess:hover{border-color:var(--line-2);background:var(--panel-2)}
.sess.G{border-left-color:var(--accent)}
.sess .tm{font:500 11.5px var(--mono);color:var(--ink-2)}
.sess .tn{font-weight:600;font-size:13.5px;margin-top:2px;line-height:1.25}
.sess .sm{font-size:12px;color:var(--muted);margin-top:2px;line-height:1.35}
.sess .flag{display:inline-flex;align-items:center;gap:4px;margin-top:6px;font:600 10.5px var(--mono);letter-spacing:.03em;text-transform:uppercase;border-radius:4px;padding:2px 6px}
.flag.crit{color:var(--crit);background:var(--crit-wash)} .flag.warn{color:var(--warn);background:var(--warn-wash)} .flag.good{color:var(--good);background:var(--good-wash)}
.avb{display:flex;height:4px;border-radius:2px;overflow:hidden;background:var(--line-2);margin-top:8px;gap:2px}
.avb i{display:block;height:100%}
.avb .in{background:var(--good)} .avb .out{background:var(--crit)}
.empty{color:var(--muted);font-size:12.5px;padding:8px 2px}
.dayempty{font-size:12px;color:var(--muted);padding:6px 10px}
.mg{font:500 11px var(--mono);color:var(--gold);display:flex;align-items:center;gap:5px;margin-top:5px}
.mg svg{width:12px;height:12px}

/* teams */
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
.team{border:1px solid var(--line);background:var(--panel);border-radius:var(--r);padding:16px 18px;cursor:pointer;text-align:left;width:100%;display:block}
.team:hover{border-color:var(--line-2);background:var(--panel-2)}
.team .tt{display:flex;align-items:baseline;gap:8px}
.team .tt b{font:800 28px/1 var(--disp);text-transform:uppercase}
.team .tt span{font-size:12.5px;color:var(--muted)}
.team .cm{font-size:12.5px;color:var(--ink-2);margin-top:6px}
.team dl{display:grid;grid-template-columns:auto 1fr;gap:5px 12px;margin:12px 0 0;font-size:12.5px}
.team dt{color:var(--muted)} .team dd{margin:0;text-align:right}
.meter{height:5px;border-radius:3px;background:var(--line-2);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:3px}
.meter.low i{background:var(--warn)}
.team .flags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.team.squad{border-style:dashed}
.team.add{display:grid;place-items:center;min-height:180px;color:var(--ink-2);border-style:dashed}
.team.add svg{width:22px;height:22px;margin:0 auto 6px}

/* tables */
.tw{overflow:auto}
table{width:100%;border-collapse:collapse}
th{text-align:left;font:500 11px var(--mono);letter-spacing:.03em;color:var(--muted);padding:9px 12px;border-bottom:1px solid var(--line-2);white-space:nowrap;background:var(--panel);position:sticky;top:0;z-index:1}
th.r,td.r{text-align:right}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--hover)}
.who{display:flex;align-items:center;gap:10px;min-width:0}
.av{width:30px;height:30px;border-radius:7px;display:grid;place-items:center;font:600 11px var(--sans);flex:none;background:var(--accent-wash);color:var(--accent);border:1px solid var(--accent-line)}
.who b{display:block;font-weight:500;line-height:1.2;white-space:nowrap}
.who small{display:block;font-size:11.5px;color:var(--muted);white-space:nowrap}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border-radius:5px;font-size:12px;border:1px solid var(--line-2);color:var(--ink-2);white-space:nowrap}
.chip.acc{border-color:var(--accent-line);color:var(--accent);background:var(--accent-wash)}
.chip.crit{border-color:transparent;color:var(--crit);background:var(--crit-wash)}
.chip.warn{border-color:transparent;color:var(--warn);background:var(--warn-wash)}
.chip.good{border-color:transparent;color:var(--good);background:var(--good-wash)}
.st{display:inline-flex;align-items:center;gap:5px;white-space:nowrap}
.st svg{width:14px;height:14px}
.st.good svg{color:var(--good)} .st.warn svg{color:var(--warn)} .st.crit svg{color:var(--crit)}
.strip{display:flex;gap:2px}
.strip i{width:7px;height:14px;border-radius:2px;background:var(--line-2)}
.strip i.p{background:var(--accent)} .strip i.a{background:transparent;box-shadow:inset 0 0 0 1.5px var(--line-2)}
.fbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:14px}
.fbar select,.fbar input{height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 10px;font-size:13px}
.fbar input{min-width:220px}
.fbar .ct{margin-left:auto;font:500 12px var(--mono);color:var(--muted)}

/* pipeline */
.pipe{display:grid;grid-template-columns:repeat(5,minmax(230px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--panel-2);border:1px solid var(--line);border-radius:var(--r);padding:10px;min-width:0;display:flex;flex-direction:column;gap:8px}
.col h3{margin:2px 4px 4px;font:600 12px var(--mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between}
.col h3 span{color:var(--muted)}
.rc{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:11px 12px}
.rc b{font-weight:600}
.rc .m{font-size:12px;color:var(--muted);margin-top:2px}
.rc q{display:block;font-size:12.5px;color:var(--ink-2);margin-top:7px;quotes:none;border-left:2px solid var(--line-2);padding-left:8px}
.rc .acts{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.rc select{height:30px;border:1px solid var(--line-2);border-radius:7px;background:var(--panel);font-size:12.5px;padding:0 6px}

/* tasks */
.task{display:grid;grid-template-columns:22px 1fr auto auto;gap:10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.task input[type=checkbox]{width:17px;height:17px;accent-color:var(--accent)}
.task.done .tx{color:var(--muted);text-decoration:line-through}
.task .who2{font:500 11px var(--mono);color:var(--muted)}
.addtask{display:flex;gap:6px;margin-top:10px}
.addtask input{flex:1;height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 10px;min-width:0}
.addtask select{height:34px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel);padding:0 6px}

/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:opacity .18s;z-index:40}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(580px,100vw);background:var(--panel);border-left:1px solid var(--line-2);z-index:41;
  transform:translateX(100%);transition:transform .22s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;box-shadow:var(--shadow)}
.drawer.on{transform:none}
.dhd{display:flex;align-items:flex-start;gap:12px;padding:20px 22px 14px;border-bottom:1px solid var(--line)}
.dhd h2{margin:0;font:800 30px/1 var(--disp);text-transform:uppercase}
.dhd .sub{color:var(--ink-2);font-size:13px;margin-top:6px}
.dhd .x{margin-left:auto}
.dbd{overflow:auto;padding:16px 22px 40px;flex:1}
.sec{margin-top:20px}
.sec:first-child{margin-top:0}
.sec h3{margin:0 0 10px;font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);display:flex;align-items:center;gap:8px}
.sec h3 .right{margin-left:auto;text-transform:none;letter-spacing:0}
dl.kv{display:grid;grid-template-columns:auto 1fr;gap:7px 16px;margin:0;font-size:13.5px}
dl.kv dt{color:var(--muted)} dl.kv dd{margin:0;min-width:0}
dl.kv a{color:var(--accent);text-decoration:none}
.plist{display:flex;flex-direction:column}
.pr{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.pr:first-child{border-top:0}
.tog{display:inline-flex;border:1px solid var(--line-2);border-radius:7px;overflow:hidden}
.tog button{border:0;background:none;height:30px;min-width:46px;padding:0 10px;cursor:pointer;font-size:12.5px;color:var(--ink-2)}
.tog button+button{border-left:1px solid var(--line)}
.tog button.on.in{background:var(--good-wash);color:var(--good);font-weight:600}
.tog button.on.out{background:var(--crit-wash);color:var(--crit);font-weight:600}
.tl .ev{display:grid;grid-template-columns:92px 1fr;gap:10px;padding:7px 0;border-top:1px solid var(--line);font-size:13px}
.tl .ev:first-child{border-top:0}
.tl .ev .d{font:400 12px var(--mono);color:var(--muted)}
.msg{white-space:pre-wrap;font:400 12.5px/1.5 var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:12px 14px;color:var(--ink-2)}

.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-48%);width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 40px);overflow:auto;
  background:var(--panel);border:1px solid var(--line-2);border-radius:14px;z-index:42;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .16s,transform .16s}
.modal.on{opacity:1;pointer-events:auto;transform:translate(-50%,-50%)}
.modal form{padding:20px 22px 22px}
.modal h2{margin:0 0 4px;font:800 28px/1 var(--disp);text-transform:uppercase}
.modal .sub{color:var(--ink-2);font-size:13px;margin-bottom:16px}
.fg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:12px}
.f{display:flex;flex-direction:column;gap:5px;grid-column:span 6}
.f.h{grid-column:span 3} .f.t{grid-column:span 2}
.f label{font-size:12px;color:var(--ink-2);font-weight:500}
.f input,.f select,.f textarea{height:38px;border:1px solid var(--line-2);border-radius:8px;background:var(--panel-2);padding:0 10px;font-size:13.5px;min-width:0}
.f textarea{height:auto;min-height:74px;padding:9px 10px;resize:vertical}
.f .hint{font-size:11.5px;color:var(--muted)}
.fsec{grid-column:span 6;font:600 11px var(--mono);letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-top:6px;padding-top:12px;border-top:1px solid var(--line)}
.mact{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}

.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:9px;font-size:13px;font-weight:500;z-index:60;
  box-shadow:var(--shadow);animation:tin .18s ease-out}
@keyframes tin{from{opacity:0;transform:translate(-50%,6px)}}

.welcome{position:fixed;inset:0;z-index:70;background:radial-gradient(1200px 600px at 50% -10%,rgba(255,138,30,.16),transparent 60%),var(--bg);display:grid;place-items:center;padding:24px;overflow:auto}
.welcome[hidden]{display:none}
.wbox{width:min(640px,100%);text-align:center}
.wbox img{width:150px;height:150px;object-fit:contain;margin:0 auto 6px}
.wbox h1{margin:0;font:900 64px/0.95 var(--disp);text-transform:uppercase;letter-spacing:.01em}
.wbox>p{color:var(--ink-2);margin:10px 0 26px;font-size:15px}
.wopts{display:grid;grid-template-columns:1fr 1fr;gap:12px;text-align:left}
.wopt{border:1px solid var(--line-2);background:var(--panel);border-radius:12px;padding:18px 18px 16px;cursor:pointer}
.wopt:hover{border-color:var(--accent-line)}
.wopt b{display:block;font:800 26px/1 var(--disp);text-transform:uppercase}
.wopt span{display:block;color:var(--ink-2);font-size:13px;margin-top:8px}
.wopt.pri{border-color:var(--accent);background:var(--accent-wash)}
.wopt.pri b{color:var(--accent)}

const between = (a, b) => Math.round((U(b) - U(a)) / 864e5);

const fd = (s, o = {}) => { if (!s) return "–"; const d = new Date(U(s)); return (o.wd ? DN[dow(s)] + " " : "") + d.getUTCDate() + " " + MON[d.getUTCMonth()] + (o.y ? " " + d.getUTCFullYear() : ""); };
const tm = t => +t.slice(0, 2) * 60 + +t.slice(3, 5);

const t12 = (t, ap = true) => { const m = tm(t), h = Math.floor(m / 60), mm = m % 60; return ((h + 11) % 12 + 1) + ":" + String(mm).padStart(2, "0") + (ap ? (h < 12 ? "am" : "pm") : ""); };
const trange = (a, b) => { const same = (tm(a) < 720) === (tm(b) < 720); return t12(a, !same) + "–" + t12(b); };

/* Maghrib: calculated from Sydney sunset (NOAA method). Mosques differ by a few minutes. */
function sunsetMin(s, lat = -33.95, lon = 151.03){
  const [Y, M, Dd] = s.split("-").map(Number), r = Math.PI / 180;
  const n = Math.floor(Date.UTC(Y, M - 1, Dd) / 864e5) - Math.floor(Date.UTC(Y, 0, 1) / 864e5) + 1;
  const g = 2 * Math.PI / 365 * (n - 1 + (18 - 12) / 24);
  const eq = 229.18 * (0.000075 + 0.001868 * Math.cos(g) - 0.032077 * Math.sin(g) - 0.014615 * Math.cos(2 * g) - 0.040849 * Math.sin(2 * g));
  const dec = 0.006918 - 0.399912 * Math.cos(g) + 0.070257 * Math.sin(g) - 0.006758 * Math.cos(2 * g) + 0.000907 * Math.sin(2 * g) - 0.002697 * Math.cos(3 * g) + 0.00148 * Math.sin(3 * g);
  const ha = Math.acos(Math.cos(90.833 * r) / (Math.cos(lat * r) * Math.cos(dec)) - Math.tan(lat * r) * Math.tan(dec)) / r;
  const utc = new Date(Date.UTC(Y, M - 1, Dd) + (720 - 4 * (lon - ha) - eq) * 60000);
  const p = new Intl.DateTimeFormat("en-GB", {timeZone: TZ, hour: "2-digit", minute: "2-digit", hour12: false}).format(utc).split(":");
  return +p[0] * 60 + +p[1];
}
const maghrib = s => mt(sunsetMin(s) + 3);

/* =========================================================
   Demo data. Deterministic, built around the current week.
   ========================================================= */
function rng(a){ return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// ACMA reserves these mobile numbers for fiction, so none of them reach a real person
const FAKE_MOB = ["0491 570 006","0491 570 156","0491 570 157","0491 570 158","0491 570 159","0491 570 110","0491 570 313","0491 570 737","0491 571 266","0491 571 491","0491 571 804","0491 572 549","0491 572 665","0491 572 983","0491 573 770","0491 573 087","0491 574 118","0491 574 632","0491 575 254","0491 575 789","0491 576 398","0491 576 801","0491 577 426","0491 577 644","0491 578 957","0491 578 148","0491 578 888","0491 579 212","0491 579 760","0491 579 455"];

  const SRC = ["Word of mouth","Instagram","Referral","Tryout day","School","Masjid notice"];
  const POS = ["Guard","Guard","Forward","Forward","Centre"];
  const players = [];
  const mkPlayer = (teamId, age, extra = {}) => {
    const [f, l] = name(), dad = R() < .6, gf = dad ? pick(DADS) : pick(MUMS);

    venues:[], coaches:[{id:"c1", name:"Camille Allam", role:"Head coach · Finance · Admin", phone:"", wwcc:null}],

   Store
   ========================================================= */
let DB;
function load(){ try { const r = localStorage.getItem(KEY); if (r) return JSON.parse(r); } catch (e) {} return null; }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(DB)); } catch (e) {} }
DB = load();
const FIRST_RUN = !DB;
if (!DB) DB = blank();

/* =========================================================
   Derived data
   ========================================================= */
const team = id => DB.teams.find(t => t.id === id);
const coach = id => DB.coaches.find(c => c.id === id);
const venue = id => DB.venues.find(v => v.id === id);
const player = id => DB.players.find(p => p.id === id);
const tname = t => t ? `${t.age} ${t.div}` : "Training squad";
const pname = p => p.first + " " + p.last;
const active = () => DB.players.filter(p => p.status === "active");
const roster = tid => active().filter(p => p.team === tid).sort((a, b) => a.last.localeCompare(b.last));
const ageOn = (dob, on) => { const a = dob.split("-").map(Number), b = on.split("-").map(Number); let y = b[0] - a[0]; if (b[1] < a[1] || (b[1] === a[1] && b[2] < a[2])) y--; return y; };
const ageGroupOf = dob => { const a = DB.org.season.ageYear - +dob.slice(0, 4); return a <= 11 ? "U12" : a <= 13 ? "U14" : a <= 15 ? "U16" : a <= 17 ? "U18" : "Open"; };
const GI = g => ["U12","U14","U16","U18","Open"].indexOf(g);
function eligibility(p, t){
  if (!t) return {ok:true};
  const g = ageGroupOf(p.dob);
  if (GI(g) > GI(t.age)) return {ok:false, level:"crit", text:`${g} age, too old for ${t.age}`};
  if (GI(g) < GI(t.age)) return {ok:true, level:"info", text:`Playing up from ${g}`};
  return {ok:true};
}
const paid = p => p.payments.reduce((s, x) => s + x.amt, 0);
const feeOf = p => { const t = team(p.team); return t ? t.fee : 0; };
const owing = p => Math.max(0, feeOf(p) - paid(p));

function weekSessions(M, db = DB){
  const out = [], end = addD(M, 6);
  db.teams.filter(t => !t.archived).forEach(t => {
    (t.train || []).forEach((s, i) => {
      const date = addD(M, s.dow - 1);
      if (date < db.org.season.start || date > db.org.season.end || (t.created && date < t.created)) return;
      out.push({key:`${t.id}|${date}|T${i}`, team:t.id, type:"T", date, start:s.start, end:s.end, venue:s.venue, court:s.court, coaches:[t.coach, t.asst].filter(Boolean)});
    });
    db.fixtures.filter(f => f.team === t.id && f.date >= M && f.date <= end).forEach(f => {
      out.push({key:`${t.id}|${f.date}|G`, team:t.id, type:"G", date:f.date, start:f.time, end:mt(tm(f.time) + 50), venue:f.venue, court:f.court, opp:f.opp, fx:f.id, coaches:[t.coach, t.asst].filter(Boolean)});
    });
  });
  return out.sort((a, b) => a.date.localeCompare(b.date) || tm(a.start) - tm(b.start));
}
function conflicts(S){
  const C = [];
  for (let i = 0; i < S.length; i++) for (let j = i + 1; j < S.length; j++) {
    const a = S[i], b = S[j];
    if (a.date !== b.date || !(tm(a.start) < tm(b.end) && tm(b.start) < tm(a.end))) continue;
    const shared = a.coaches.filter(c => b.coaches.includes(c));
    shared.forEach(c => C.push({kind:"coach", a, b, coach:c}));
    if (a.venue === b.venue && a.court === b.court) C.push({kind:"court", a, b});
  }
  return C;
}
const sessionFlags = (s, C) => C.filter(c => c.a.key === s.key || c.b.key === s.key);
function availCount(s){
  const r = roster(s.team), a = DB.avail[s.key] || {};
  const inn = r.filter(p => a[p.id] === "in").length, out = r.filter(p => a[p.id] === "out").length;
  return {inn, out, none:r.length - inn - out, n:r.length};
}
function gameShort(s){ const a = availCount(s), d = between(todayISO(), s.date); return a.n > 0 && a.inn < DB.org.minGame && (d <= 2 || a.inn + a.none < DB.org.minGame); }
function rollCount(s){ const r = DB.roll[s.key]; if (!r) return null; const v = Object.values(r); return {here:v.filter(x => x === 1).length, n:v.length}; }
function isPast(s){ const T = todayISO(); return s.date < T || (s.date === T && tm(s.end) <= nowMin()); }
function seasonSessionsUpTo(tid, until){
  const S = []; let M = monday(DB.org.season.start);
  while (M <= until) { weekSessions(M).forEach(s => { if (s.team === tid && s.date <= until) S.push(s); }); M = addD(M, 7); }
  return S;
}
function attendance(p){
  const T = todayISO(), S = p.team ? seasonSessionsUpTo(p.team, T) : [];
  const rec = S.filter(s => DB.roll[s.key] && DB.roll[s.key][p.id] !== undefined).map(s => ({s, v:DB.roll[s.key][p.id]}));
  const here = rec.filter(r => r.v === 1).length;
  return {rec, here, n:rec.length, pct:rec.length ? here / rec.length : null, last:rec.slice(-8)};
}
let ATT_CACHE = null;
function attCache(){ if (!ATT_CACHE) { ATT_CACHE = {}; active().forEach(p => ATT_CACHE[p.id] = attendance(p)); } return ATT_CACHE; }
function teamStats(t){
  const r = roster(t.id), A = attCache();
  const recs = r.map(p => A[p.id]).filter(a => a && a.n);
  const pct = recs.length ? recs.reduce((s, a) => s + a.here, 0) / recs.reduce((s, a) => s + a.n, 0) : null;
  const fx = DB.fixtures.filter(f => f.team === t.id && f.us != null);
  const w = fx.filter(f => f.us > f.them).length;
  return {n:r.length, pct, w, l:fx.length - w, owe:r.reduce((s, p) => s + owing(p), 0), over:r.filter(p => !eligibility(p, t).ok)};
}
function wwcc(c){
  if (!c.wwcc || !c.wwcc.exp) return {level:"crit", text:"Not on file"};
  const d = between(todayISO(), c.wwcc.exp);
  if (d < 0) return {level:"crit", text:"Expired " + fd(c.wwcc.exp, {y:1})};
  if (d <= 60) return {level:"warn", text:`Expires in ${d} days`};
  return {level:"good", text:"Valid to " + fd(c.wwcc.exp, {y:1})};
}
function alerts(M, S, C){
  const A = [], T = todayISO();
  C.forEach(c => {
    if (c.kind === "coach") A.push({lv:"crit", t:`<b>${esc(coach(c.coach).name)}</b> is booked for two sessions at once`, m:`${DN[dow(c.a.date)]}: ${tname(team(c.a.team))} ${trange(c.a.start, c.a.end)} at ${venue(c.a.venue).short}, and ${tname(team(c.b.team))} ${trange(c.b.start, c.b.end)} at ${venue(c.b.venue).short}`, act:"editTeam", id:c.b.team, btn:"Fix times"});
    else A.push({lv:"crit", t:`Court clash at <b>${esc(venue(c.a.venue).short)}</b>, court ${c.a.court}`, m:`${DN[dow(c.a.date)]}: ${tname(team(c.a.team))} ${trange(c.a.start, c.a.end)} and ${tname(team(c.b.team))} ${trange(c.b.start, c.b.end)}`, act:"editTeam", id:c.b.team, btn:"Fix times"});
  });
  S.filter(s => s.type === "G" && !isPast(s) && gameShort(s)).forEach(s => { const a = availCount(s);
    A.push({lv:a.inn + a.none < DB.org.minGame ? "crit" : "warn", t:`<b>${tname(team(s.team))}</b> has ${a.inn} confirmed for ${DN[dow(s.date)]}'s game`,
      m:a.inn + a.none < DB.org.minGame ? `${DB.org.minGame} needed and ${a.out} are out, so even if everyone replies they're short. Borrow from ${roster(s.team).length ? "the training squad or a lower division" : "another team"}.` : `${DB.org.minGame} needed. ${a.none} ${a.none === 1 ? "hasn't" : "haven't"} replied.`, act:"sess", id:s.key, btn:"Open"}); });
  S.filter(s => isPast(s) && !DB.roll[s.key] && s.date >= addD(T, -6) && !(team(s.team).created && s.date <= team(s.team).created)).forEach(s => A.push({lv:"info", t:`Roll not taken: <b>${tname(team(s.team))}</b>, ${DN[dow(s.date)]} ${s.type === "G" ? "game" : "training"}`, m:"Take it now while it's fresh.", act:"sess", id:s.key, btn:"Take roll"}));
  active().forEach(p => { const e = eligibility(p, team(p.team)); if (!e.ok) A.push({lv:"crit", t:`<b>${esc(pname(p))}</b> is ${e.text.replace(", too old", " and too old")}`, m:`Rostered in ${tname(team(p.team))}. Born ${fd(p.dob, {y:1})}.`, act:"player", id:p.id, btn:"Move"}); });
  DB.teams.filter(t => !t.archived).forEach(t => { const n = roster(t.id).length;
    if (n < DB.org.minRoster) A.push({lv:"warn", t:`<b>${tname(t)}</b> has ${n} players`, m:`At least ${DB.org.minRoster} keeps a team safe from forfeits. ${active().filter(p => !p.team).length} in the training squad.`, act:"team", id:t.id, btn:"Roster"});
    if (n > t.cap) A.push({lv:"warn", t:`<b>${tname(t)}</b> is over its cap`, m:`${n} players, cap ${t.cap}.`, act:"team", id:t.id, btn:"Roster"}); });
  DB.coaches.forEach(c => { const w = wwcc(c); if (w.level !== "good" && DB.teams.some(t => !t.archived && (t.coach === c.id || t.asst === c.id)))
    A.push({lv:w.level, t:`Working With Children Check: <b>${esc(c.name)}</b>`, m:w.text + ".", act:"go", id:"coaches", btn:"Coaches"}); });
  const waiting = DB.regs.filter(r => r.stage === "new" && between(r.at, T) >= 3);
  if (waiting.length) A.push({lv:"warn", t:`${plural(waiting.length, "registration")} waiting more than 3 days`, m:waiting.map(r => r.first + " " + r.last).join(", "), act:"go", id:"regos", btn:"Reply"});
  const order = {crit:0, warn:1, info:2};
  return A.sort((a, b) => order[a.lv] - order[b.lv]);
}

let VIEW = {r:"week", week:monday(todayISO()), pf:{team:"all", status:"all", q:""}};

function setupCard(){

function sessCard(s, C, mg){
  const t = team(s.team), v = venue(s.venue), fl = sessionFlags(s, C), past = isPast(s);

    if (gameShort(s)) foot += `<span class="flag warn">Short</span>`; }
  const spans = DB.org.prayer && tm(s.start) < tm(mg) && tm(mg) < tm(s.end);

  </button>`;
}

const dHead = (title, sub, extra = "") => `<div class="dhd"><div style="min-width:0"><h2>${title}</h2><div class="sub">${sub}</div>${extra}</div><button class="btn icon ghost x" data-act="closeAll" aria-label="Close">${I.x}</button></div>`;

function regMsg(r){
  const tr = DB.tryout, v = venue(tr.venue), hi = `Assalamu alaykum ${r.gname.split(" ")[0]},\n\n`;
  if (r.stage === "offered" || r.stage === "tryout") return `${hi}Thanks for bringing ${r.first} to the tryout. We'd love to have him with Clutch this season in our ${ageGroupOf(r.dob)} group.\n\nReply here and we'll send through the team, training times and fees.\n\n${signOff()}`;
  if (!tr.date) return `${hi}Thanks for registering ${r.first} with Clutch Basketball. We're setting the next tryout date now and will send it through in the next few days.\n\n${signOff()}`;
  return `${hi}Thanks for registering ${r.first} with Clutch Basketball. We'd like to see him at our next tryout:\n\n${DL[dow(tr.date)]} ${fd(tr.date)}, ${t12(tr.time)}\n${v ? v.name : "Venue to be confirmed"}\n\nBring a water bottle and runners. Reply here to confirm, or let us know if that time doesn't suit.\n\n${signOff()}`;
}
function feeMsg(p){
  const t = team(p.team);
  return `Assalamu alaykum ${p.guardian.name.split(" ")[0]},\n\nA quick reminder that ${p.first}'s ${tname(t)} fee for ${DB.org.season.name} has ${money(owing(p))} still to pay (${money(t.fee)} for the season).\n\nBank transfer is easiest. Reply here if you'd like to split it into two payments.\n\nJazakAllahu khayran,\n${signOff()}`;
}
function copy(text){
  const done = () => toast("Copied. Paste it into WhatsApp.");
  if (navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(text).then(done, () => fallback());
  else fallback();
  function fallback(){ const ta = document.createElement("textarea"); ta.value = text; document.body.appendChild(ta); ta.select(); try { document.execCommand("copy"); done(); } catch (e) { toast("Couldn't copy on this device"); } ta.remove(); }
}
function toast(m){ const t = document.createElement("div"); t.className = "toast"; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2200); }

/* =========================================================
   Actions
   ========================================================= */
const ACT = {
  go:(el) => { closeAll(); location.hash = "#/" + el.dataset.id; },
  wk:(el) => { const d = +el.dataset.d; VIEW.week = d === 0 ? monday(todayISO()) : addD(VIEW.week, d); render(); },
  scrollTo:(el) => { const x = document.getElementById(el.dataset.id); if (x) x.scrollIntoView({behavior:"smooth", block:"start"}); },
  sess:(el) => openDrawer("sess", el.dataset.id),
  team:(el) => openDrawer("team", el.dataset.id),
  player:(el, e) => { e.preventDefault(); openDrawer("player", el.dataset.id); },
  closeAll:() => closeAll(),
  newTeam:() => teamForm(null),
  editTeam:(el) => teamForm(team(el.dataset.id)),
  newPlayer:(el) => playerForm(el.dataset.team),
  archiveTeam:(el) => { const t = team(el.dataset.id); if (!confirm(`Archive ${tname(t)}? Its players move to the training squad.`)) return;
    t.archived = true; DB.players.forEach(p => { if (p.team === t.id) { p.team = null; p.log.push({d:todayISO(), t:`${tname(t)} archived. Moved to the training squad.`}); } }); save(); closeAll(); render(); toast(tname(t) + " archived"); },
  avail:(el) => { const a = DB.avail[el.dataset.id] = DB.avail[el.dataset.id] || {}; a[el.dataset.p] = a[el.dataset.p] === el.dataset.v ? undefined : el.dataset.v; if (!a[el.dataset.p]) delete a[el.dataset.p]; save(); render(); },
  roll:(el) => { const r = DB.roll[el.dataset.id] = DB.roll[el.dataset.id] || {}; r[el.dataset.p] = +el.dataset.v; save(); render(); },
  rollAll:(el) => { const s = findSession(el.dataset.id), r = DB.roll[s.key] = DB.roll[s.key] || {}; roster(s.team).forEach(p => r[p.id] = 1); save(); render(); toast("Roll saved"); },
  copyMsg:(el) => copy(teamMsg(team(el.dataset.id), el.dataset.w)),
  task:(el) => { const k = DB.tasks.find(x => x.id === el.dataset.id); k.done = el.checked; save(); render(); },
  regStage:(el) => { const r = DB.regs.find(x => x.id === el.dataset.id), to = el.dataset.to;
    if (to === "tryout" && !DB.tryout.date) { toast("Set the tryout date first"); ACT.editTryout(); return; }
    if (to === "tryout") r.tryout = {...DB.tryout};
    r.stage = to; r.log.push({d:todayISO(), t:{contacted:"Contacted.", tryout:`Tryout booked for ${fd(DB.tryout.date, {wd:1})}.`, offered:"Offered a spot.", notnow:"Marked not now.", new:"Reopened."}[to]});
    save(); render(); },
  regMsg:(el) => copy(regMsg(DB.regs.find(x => x.id === el.dataset.id))),
  regJoin:(el) => { const r = DB.regs.find(x => x.id === el.dataset.id), g = ageGroupOf(r.dob);
    const teams = DB.teams.filter(t => !t.archived).sort((a, b) => GI(a.age) - GI(b.age) || a.div.localeCompare(b.div));
    openModal(`<form data-form="join" data-id="${r.id}"><h2>Add ${esc(r.first)}</h2><div class="sub">${ageOn(r.dob, todayISO())} years old, so ${g} this season. Pick a roster, or start him in the training squad.</div>
      <div class="fg"><div class="f"><label>Team</label><select name="team"><option value="">Training squad</option>${teams.map(t => { const e = eligibility({dob:r.dob}, t); return `<option value="${t.id}"${t.age === g && !teams.some(x => x.age === g && x.id < t.id && roster(x.id).length < x.cap) && roster(t.id).length < t.cap ? " selected" : ""}${!e.ok ? " disabled" : ""}>${tname(t)} · ${roster(t.id).length}/${t.cap}${!e.ok ? " · over age" : e.level === "info" ? " · plays up" : ""}</option>`; }).join("")}</select></div>
      <div class="f h"><label>Jersey number</label><input type="number" name="no" min="0" max="99"></div><div class="f h"><label>Found us through</label><select name="source">${opt(["Word of mouth","Instagram","Referral","Tryout day","School","Masjid notice"].map(x => [x, x]), "Tryout day")}</select></div></div>
      <div class="mact"><button type="button" class="btn ghost" data-act="closeAll">Cancel</button><button class="btn pri">Add player</button></div></form>`); },
  editTryout:() => { const tr = DB.tryout;
    openModal(`<form data-form="tryout"><h2>Tryout details</h2><div class="sub">Used in the message families get when you book them in.</div><div class="fg">
      <div class="f t"><label>Date</label><input type="date" name="date" value="${tr.date || ""}" required></div><div class="f t"><label>Time</label><input type="time" name="time" value="${tr.time}" required></div>
      <div class="f t"><label>Venue</label><select name="venue"><option value="">To be confirmed</option>${venueOpts(tr.venue)}</select></div></div>
      <div class="mact"><button type="button" class="btn ghost" data-act="closeAll">Cancel</button><button class="btn pri">Save</button></div></form>`); },
  newRego:() => openModal(`<form data-form="rego"><h2>Add a registration</h2><div class="sub">For a family who called or messaged instead of using the website.</div><div class="fg">
      <div class="f h"><label>Player first name</label><input name="first" required></div><div class="f h"><label>Player last name</label><input name="last" required></div>
      <div class="f h"><label>Date of birth</label><input type="date" name="dob" required></div><div class="f h"><label>Player phone</label><input name="phone"></div>
      <div class="f h"><label>Parent or guardian</label><input name="gname" required></div><div class="f h"><label>Parent phone</label><input name="gphone" required></div>
      <div class="f"><label>Parent email</label><input type="email" name="gemail"></div><div class="f"><label>Message</label><textarea name="msg"></textarea></div></div>
      <div class="mact"><button type="button" class="btn ghost" data-act="closeAll">Cancel</button><button class="btn pri">Add</button></div></form>`),
  pay:(el) => { const p = player(el.dataset.id);
    openModal(`<form data-form="pay" data-id="${p.id}"><h2>Record payment</h2><div class="sub">${esc(pname(p))} · ${tname(team(p.team))} · ${money(owing(p))} owing</div><div class="fg">
      <div class="f t"><label>Amount ($)</label><input type="number" name="amt" value="${owing(p)}" min="1" required></div><div class="f t"><label>Date</label><input type="date" name="d" value="${todayISO()}" required></div>
      <div class="f t"><label>How</label><select name="how"><option>Bank transfer</option><option>Cash</option><option>Card</option></select></div></div>
      <div class="mact"><button type="button" class="btn ghost" data-act="closeAll">Cancel</button><button class="btn pri">Save payment</button></div></form>`); },
  feeMsg:(el) => copy(feeMsg(player(el.dataset.id))),
  newCoach:() => coachForm(null),
  editCoach:(el) => coachForm(DB.coaches.find(c => c.id === el.dataset.id)),
  theme:() => setTheme(document.documentElement.dataset.theme === "light" ? "dark" : "light"),
  reset:() => { if (!confirm("Reset to the demo data? Anything you've changed on this device is lost.")) return; DB = seed(); save(); closeAll(); render(); toast("Demo data reset"); },
  wipe:() => { if (!confirm(DB.demo ? "Start fresh? The demo club is cleared and you begin with an empty one." : "Start fresh? Everything on this device is cleared. Download a backup first if you need it.")) return; DB = blank(); save(); closeAll(); location.hash = "#/week"; render(); toast("Fresh start"); },
  loadDemo:() => { if (!DB.demo && (DB.teams.length || DB.players.length) && !confirm("Load the demo club? Your own teams and players on this device are replaced. Download a backup first if you need it.")) return; DB = seed(); save(); closeAll(); render(); toast("Demo club loaded"); },
  startFresh:() => { DB = blank(); save(); $("#welcome").hidden = true; location.hash = "#/week"; render(); },
  startDemo:() => { DB = seed(); save(); $("#welcome").hidden = true; render(); },
  newVenue:() => venueForm(),
  export:() => exportXlsx(),
  backup:() => { const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([JSON.stringify(DB, null, 1)], {type:"application/json"})); a.download = `clutch-hq-backup-${todayISO()}.json`; a.click(); },
};
function coachForm(c){
  const n = !c; c = c || {name:"", role:"Coach", phone:"", wwcc:{no:"", exp:""}};
  openModal(`<form data-form="coach" data-id="${n ? "" : c.id}"><h2>${n ? "Add coach" : esc(c.name)}</h2><div class="sub">The check number and expiry come from the Office of the Children's Guardian.</div><div class="fg">
    <div class="f h"><label>Name</label><input name="name" value="${esc(c.name)}" required></div><div class="f h"><label>Role</label><input name="role" value="${esc(c.role)}"></div>
    <div class="f h"><label>Mobile</label><input name="phone" value="${esc(c.phone)}"></div><div class="f h"></div>
    <div class="f h"><label>WWCC number</label><input name="no" value="${esc(c.wwcc ? c.wwcc.no : "")}"></div><div class="f h"><label>Expires</label><input type="date" name="exp" value="${c.wwcc ? c.wwcc.exp : ""}"></div></div>
    <div class="mact"><button type="button" class="btn ghost" data-act="closeAll">Cancel</button><button class="btn pri">Save</button></div></form>`);
}
const FORMS = {
  task:(f) => { DB.tasks.push({id:uid("k"), t:f.t, who:f.who, due:null, done:false}); },
  note:(f, el) => { const p = player(el.dataset.id); p.notes.push({d:todayISO(), by:f.by, t:f.t}); },
  team:(f, el) => {
    const train = [{dow:+f.tdow, start:f.tstart, end:f.tend, venue:f.tvenue, court:+f.tcourt || 1}];
    if (tm(f.tend) <= tm(f.tstart)) { toast("Training has to end after it starts"); return false; }
    const base = {age:f.age, div:f.div.trim(), comp:f.comp.trim(), coach:f.coach || null, asst:f.asst && f.asst !== f.coach ? f.asst : null, cap:+f.cap || 10, fee:+f.fee || 0, train};
    if (el.dataset.id) { const t = team(el.dataset.id); Object.assign(t, base); t.game = {dow:+f.gdow, venue:f.gvenue, time:f.gtime};
      DB.fixtures.filter(x => x.team === t.id && x.date >= todayISO()).forEach(x => { x.time = f.gtime; x.venue = f.gvenue; x.date = addD(monday(x.date), +f.gdow - 1); });
      toast(tname(t) + " saved");
    } else {
      const t = {id:uid("t"), ...base, game:{dow:+f.gdow, venue:f.gvenue, time:f.gtime}, created:todayISO()}; DB.teams.push(t);
      let M = monday(todayISO()), round = 0; while (addD(M, +f.gdow - 1) <= DB.org.season.end) { const date = addD(M, +f.gdow - 1); if (date >= todayISO()) DB.fixtures.push({id:uid("f"), team:t.id, date, time:f.gtime, venue:f.gvenue, court:1, opp:"To be drawn", round:++round, us:null, them:null}); M = addD(M, 7); }
      toast(tname(t) + " created");
    }
  },
  player:(f) => {
    const p = {id:uid("p"), first:f.first.trim(), last:f.last.trim(), dob:f.dob, phone:f.phone, guardian:{name:f.gname, rel:f.grel, phone:f.gphone, email:f.gemail},
      team:f.team || null, no:f.no === "" ? null : +f.no, pos:"Position TBC", joined:todayISO(), source:f.source, medical:false, photo:f.photo === "1", payments:[], notes:[], log:[], status:"active"};
    p.log.push({d:todayISO(), t:p.team ? `Added to ${tname(team(p.team))}.` : "Added to the training squad."});
    DB.players.push(p); toast(pname(p) + " added");
  },
  join:(f, el) => {
    const r = DB.regs.find(x => x.id === el.dataset.id);
    const p = {id:uid("p"), first:r.first, last:r.last, dob:r.dob, phone:r.phone, guardian:{name:r.gname, rel:"Parent", phone:r.gphone, email:r.gemail},
      team:f.team || null, no:f.no === "" ? null : +f.no, pos:"Position TBC", joined:todayISO(), source:f.source, medical:false, photo:true, payments:[], notes:[], status:"active",
      log:r.log.concat([{d:todayISO(), t:f.team ? `Joined ${tname(team(f.team))}.` : "Joined the training squad."}])};
    DB.players.push(p); r.stage = "joined"; r.player = p.id; toast(`${r.first} added${f.team ? " to " + tname(team(f.team)) : " to the training squad"}`);
  },
  tryout:(f) => { DB.tryout = {date:f.date, time:f.time, venue:f.venue}; DB.regs.filter(r => r.stage === "tryout").forEach(r => r.tryout = {...DB.tryout}); },
  rego:(f) => { DB.regs.push({id:uid("r"), at:todayISO(), stage:"new", first:f.first, last:f.last, phone:f.phone, dob:f.dob, gname:f.gname, gphone:f.gphone, gemail:f.gemail, msg:f.msg, tryout:null, log:[{d:todayISO(), t:"Added by hand."}]}); },
  pay:(f, el) => { const p = player(el.dataset.id); p.payments.push({d:f.d, amt:+f.amt, how:f.how}); toast(`${money(+f.amt)} recorded for ${p.first}`); },
  coach:(f, el) => { const w = {no:f.no, exp:f.exp}; if (el.dataset.id) Object.assign(DB.coaches.find(c => c.id === el.dataset.id), {name:f.name, role:f.role, phone:f.phone, wwcc:f.exp ? w : null});
    else DB.coaches.push({id:uid("c"), name:f.name, role:f.role || "Coach", phone:f.phone, wwcc:f.exp ? w : null}); },
  org:(f) => { const o = DB.org; o.name = f.name; o.contact = f.contact; o.email = f.email; o.phone = f.phone; o.seasonSet = true; o.season = {...o.season, name:f.sname, start:f.start, end:f.end, ageYear:+f.ageYear}; o.minRoster = +f.minRoster; o.minGame = +f.minGame; o.prayer = f.prayer === "1"; toast("Saved"); },
  venue:(f) => { DB.venues.push({id:uid("v"), name:f.name.trim(), short:f.short.trim(), courts:+f.courts || 1}); if (DB.tryout && !DB.tryout.venue) DB.tryout.venue = DB.venues[0].id; toast(f.short + " added"); },
};
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]"); if (!el || el.tagName === "SELECT" || el.type === "checkbox" || el.type === "file") return;
  const fn = ACT[el.dataset.act]; if (fn) { if (el.tagName === "A") e.preventDefault(); fn(el, e); }
});
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "task") return ACT.task(el);
  if (el.dataset.act === "move" && el.value) { const p = player(el.dataset.id), to = el.value === "squad" ? null : el.value, t = team(to), from = team(p.team);
    const e2 = eligibility(p, t); if (!e2.ok && !confirm(`${pname(p)} is ${e2.text}. Move anyway?`)) { el.value = ""; return; }
    p.team = to; p.log.push({d:todayISO(), t:`Moved ${from ? "from " + tname(from) + " " : ""}to ${tname(t)}.`}); save(); render(); toast(`${p.first} moved to ${tname(t)}`); return; }
  if (el.dataset.act === "restore" && el.files[0]) { const r = new FileReader(); r.onload = () => { try { const d = JSON.parse(r.result); if (!d.teams || !d.players) throw 0; DB = d; save(); render(); toast("Backup restored"); } catch (x) { toast("That file isn't a Clutch HQ backup"); } }; r.readAsText(el.files[0]); return; }
  if (el.dataset.f) { VIEW.pf[el.dataset.f] = el.value; render(); }
});
document.addEventListener("input", e => { const el = e.target; if (el.dataset.f === "q") { VIEW.pf.q = el.value; const pos = el.selectionStart; render(); const n = $('[data-f="q"]'); if (n) { n.focus(); n.setSelectionRange(pos, pos); } } });
document.addEventListener("submit", e => {
  const el = e.target, k = el.dataset.form; if (!FORMS[k]) return; e.preventDefault();
  const f = Object.fromEntries(new FormData(el).entries());
  if (FORMS[k](f, el) === false) return;
  save();
  if (el.closest("#modal")) { $("#modal").classList.remove("on"); if (!DRAWER) $("#scrim").classList.remove("on"); }
  render();
  if (k === "venue" && AFTER_VENUE) { const f2 = AFTER_VENUE; AFTER_VENUE = null; f2(); }
});
document.addEventListener("keydown", e => { if (e.key === "Escape") { if ($("#modal").classList.contains("on")) { $("#modal").classList.remove("on"); if (!DRAWER) $("#scrim").classList.remove("on"); } else closeAll(); } });

function exportXlsx(){
  const A = attCache();
  const rows = active().map(p => ({"First name":p.first, "Last name":p.last, "Born":p.dob, "Age group":ageGroupOf(p.dob), "Team":tname(team(p.team)), "Number":p.no ?? "",
    "Attendance %":A[p.id] && A[p.id].pct != null ? Math.round(A[p.id].pct * 100) : "", "Fee":feeOf(p), "Paid":paid(p), "Owing":owing(p),
    "Parent":p.guardian.name, "Relationship":p.guardian.rel, "Parent mobile":p.guardian.phone, "Parent email":p.guardian.email, "Player mobile":p.phone,
    "Medical note":p.medical ? "Yes" : "No", "Photo consent":p.photo ? "Yes" : "No", "Joined":p.joined, "Found us":p.source}));
  const name = `clutch-players-${todayISO()}`;
  if (window.XLSX) { const wb = XLSX.utils.book_new(), ws = XLSX.utils.json_to_sheet(rows); ws["!cols"] = Object.keys(rows[0] || {}).map(k => ({wch:Math.max(10, k.length + 2)})); XLSX.utils.book_append_sheet(wb, ws, "Players"); XLSX.writeFile(wb, name + ".xlsx"); }
  else { const k = Object.keys(rows[0] || {}); const csv = [k.join(",")].concat(rows.map(r => k.map(x => `"${String(r[x]).replace(/"/g, '""')}"`).join(","))).join("\n"); const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([csv], {type:"text/csv"})); a.download = name + ".csv"; a.click(); }
}

/* theme */
function setTheme(t){ document.documentElement.dataset.theme = t; try { localStorage.setItem(TKEY, t); } catch (e) {} const m = document.querySelector('meta[name="theme-color"]'); if (m) m.content = t === "light" ? "#F5F2EC" : "#0B0A08"; render(); }
(() => { let t = null; try { t = localStorage.getItem(TKEY); } catch (e) {} document.documentElement.dataset.theme = t || "dark"; })();

VIEW.r = parseHash();
render();
if (FIRST_RUN) $("#welcome").hidden = false;
</script>
