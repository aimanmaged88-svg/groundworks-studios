<script>
'use strict';
/* ============ INSIGHTS ENGINE — play-based capability profile ============ */
var DOMAINS = {
  memory:      {name:'Working Memory',        emoji:'🧠', games:['memory','simon','pixel'],
                school:'remembering instructions and sequences',
                tips:['Play Star Memory or Simon Stars together and talk through strategies','Card-matching games and "what’s missing?" tray games','Give 2-step then 3-step instructions during play']},
  attention:   {name:'Focus & Attention',     emoji:'🎯', games:['whack','rocket','catch'],
                school:'staying on task and filtering distractions',
                tips:['Short 10-minute focused activities with a visible timer','Movement breaks between sit-down tasks','"Spot the difference" and I-spy games']},
  coordination:{name:'Hand–Eye Coordination', emoji:'🤾', games:['catch','pop','whack','rocket'],
                school:'handwriting, PE activities and fine-motor tasks',
                tips:['Balloon volleyball and beanbag toss at home','Threading beads, playdough, tweezers games','Ball catch starting big and soft, getting smaller']},
  speed:       {name:'Thinking Speed',        emoji:'⚡', games:['sort','color','numbers'],
                school:'quick recall and keeping pace with class activities',
                tips:['Sorting the laundry by colour as a race','Snap and other fast card games','"Name 3 animals / 3 fruits" quick-fire rounds']},
  spatial:     {name:'Planning & Puzzles',    emoji:'🧩', games:['maze','pixel'],
                school:'maths concepts, puzzles and multi-step planning',
                tips:['Jigsaw puzzles slightly above current level','Lego builds from picture instructions','Treasure Maze together — let them narrate the route']},
  rhythm:      {name:'Rhythm & Timing',       emoji:'🎵', games:['rhythm'],
                school:'music, movement sequencing and speech pacing',
                tips:['Clap-along and copy-the-beat games','Dance videos made for kids','March, stomp and drum on pots to music']},
  routine:     {name:'Routines & Responsibility', emoji:'⭐', games:[],
                school:'organisation, transitions and independent work habits',
                tips:['A visual morning-routine chart in the same order daily','One new small responsibility per week','Celebrate streaks — consistency over perfection']},
  feelings:    {name:'Emotional Balance',     emoji:'💗', games:[],
                school:'self-regulation and expressing needs',
                tips:['Name the feeling out loud when it appears','Bubble Breathing together before tricky moments','A calm-corner with soft items at home']},
};
var ACTIVITIES = [
  {name:'Kids martial arts (boxing / MMA)', emoji:'🥋', needs:['coordination','attention'], query:'kids martial arts classes near me',
   why:'strong hand-eye coordination and focus are exactly what great junior martial-arts coaches build on'},
  {name:'Junior soccer',                    emoji:'⚽', needs:['speed','coordination'],     query:'junior soccer club near me',
   why:'quick decisions plus coordination — soccer rewards both every few seconds'},
  {name:'Kids basketball',                  emoji:'🏀', needs:['coordination','speed'],     query:'kids basketball classes near me',
   why:'catching, aiming and fast choices — a natural fit for these strengths'},
  {name:'Chess club',                       emoji:'♟️', needs:['memory','spatial'],         query:'kids chess club near me',
   why:'strong memory and planning are the exact ingredients of a young chess player'},
  {name:'Dance classes',                    emoji:'💃', needs:['rhythm','coordination'],    query:'kids dance classes near me',
   why:'a great sense of rhythm deserves a stage — dance builds confidence too'},
  {name:'Music lessons',                    emoji:'🎹', needs:['rhythm','memory'],          query:'kids music lessons near me',
   why:'timing plus memory is the musician’s toolkit — piano or drums are great starters'},
  {name:'Gymnastics',                       emoji:'🤸', needs:['coordination','attention'], query:'kids gymnastics classes near me',
   why:'body control and focus grow fast in gymnastics — and it feeds every other sport'},
  {name:'Swimming lessons',                 emoji:'🏊', needs:['attention','feelings'],     query:'kids swimming lessons near me',
   why:'calming, rhythmic and confidence-building — wonderful for emotional balance'},
  {name:'Robotics / LEGO club',             emoji:'🤖', needs:['spatial','memory'],         query:'kids robotics classes near me',
   why:'planning and puzzle-solving minds thrive on building things that work'},
  {name:'Art classes',                      emoji:'🎨', needs:['spatial','feelings'],       query:'kids art classes near me',
   why:'visual thinking plus a calm creative outlet — art grows both'},
];
function computeDomains(c){
  var out = {};
  var log = c.playLog || [];
  Object.keys(DOMAINS).forEach(function(k){
    var d = DOMAINS[k];
    if(k==='routine'){
      var days = {}; var total = 0;
      var cutoff = Date.now() - 14*86400000;
      S.history.forEach(function(h){
        if(h.cid!==c.id) return;
        var t = new Date(h.d+'T12:00:00').getTime();
        if(t < cutoff) return;
        days[h.d]=1; total++;
      });
      var nDays = Object.keys(days).length;
      out[k] = total===0 ? {score:null, plays:0, trend:null}
        : {score:Math.min(100, Math.round(nDays/14*60 + Math.min(c.streak,14)/14*25 + Math.min(total,28)/28*15)), plays:total, trend:null};
      return;
    }
    if(k==='feelings'){
      var moods = (c.moods||[]).slice(-20);
      if(moods.length<3){ out[k]={score:null, plays:moods.length, trend:null}; return; }
      var pos = moods.filter(function(m){return m.mood==='happy'||m.mood==='excited';}).length;
      out[k] = {score:Math.min(100, Math.round(38 + pos/moods.length*52 + Math.min(moods.length,10))), plays:moods.length, trend:null};
      return;
    }
    var scores = [], plays = 0;
    d.games.forEach(function(gid){
      var g = c.games && c.games[gid];
      if(!g || !g.plays) return;
      plays += g.plays;
      scores.push(Math.min(100, (g.lv-1)/9*70 + Math.min(1, g.plays/10)*30 ));
    });
    if(!scores.length){ out[k]={score:null, plays:0, trend:null}; return; }
    var avg = Math.round(scores.reduce(function(a,b){return a+b;},0)/scores.length);
    // trend from playLog
    var entries = log.filter(function(e){ return d.games.indexOf(e.g)>=0; });
    var trend = null;
    if(entries.length>=6){
      var maxByGame = {};
      entries.forEach(function(e){ maxByGame[e.g] = Math.max(maxByGame[e.g]||1, e.s||1); });
      var norm = entries.map(function(e){ return (e.s||0)/maxByGame[e.g]; });
      var third = Math.floor(norm.length/3);
      var first = norm.slice(0,third), last = norm.slice(-third);
      var fAvg = first.reduce(function(a,b){return a+b;},0)/first.length;
      var lAvg = last.reduce(function(a,b){return a+b;},0)/last.length;
      trend = lAvg > fAvg*1.12 ? 'up' : 'steady';
    }
    out[k] = {score:Math.max(6,avg), plays:plays, trend:trend};
  });
  return out;
}
function bandFor(score){
  if(score===null) return {label:'No data yet', color:'var(--muted)'};
  if(score>=65) return {label:'Strong 💪', color:'var(--green)'};
  if(score>=40) return {label:'Growing 🌱', color:'var(--gold-dark)'};
  return {label:'Emerging 🌤️', color:'var(--blue)'};
}
function confidenceFor(c){
  var n = (c.playLog||[]).length + S.history.filter(function(h){return h.cid===c.id;}).length;
  if(n<8)  return {label:'🌱 Early days — more play makes this sharper', n:n};
  if(n<25) return {label:'🔎 Picture getting clearer ('+n+' data points)', n:n};
  return {label:'✅ Well-developed picture ('+n+' data points)', n:n};
}
function activityMatches(dom){
  return ACTIVITIES.map(function(a){
    var vals = a.needs.map(function(k){ return dom[k] && dom[k].score!==null ? dom[k].score : null; }).filter(function(v){return v!==null;});
    if(!vals.length) return null;
    return {a:a, score:Math.round(vals.reduce(function(x,y){return x+y;},0)/vals.length) - (a.needs.length-vals.length)*10};
  }).filter(Boolean).sort(function(x,y){return y.score-x.score;}).slice(0,3);
}
function strengthsAndGrowth(dom){
  var pairs = Object.keys(dom).map(function(k){ return {k:k, s:dom[k].score}; }).filter(function(p){return p.s!==null;});
  pairs.sort(function(a,b){return b.s-a.s;});
  return {
    strengths: pairs.filter(function(p){return p.s>=55;}).slice(0,3),
    growth: pairs.slice().reverse().filter(function(p){return p.s<55;}).slice(0,2)
  };
}

/* ============ PARENT DASHBOARD (override: + Insights tab & reports) ============ */
function renderParent(){
  if(ui.report){ renderReportScreen(); return; }
  var tabs = [
    {id:'approve', name:'✅ Approvals'},
    {id:'insights',name:'🧠 Insights'},
    {id:'missions',name:'📋 Missions'},
    {id:'family',  name:'👨‍👩‍👧 Family'},
    {id:'reports', name:'📊 Reports'},
    {id:'settings',name:'⚙️ Settings'},
  ];
  var pendCount = S.children.reduce(function(n,c){return n+c.pending.length;},0);
  var body='';
  if(ui.ptab==='approve') body = parentApprove();
  else if(ui.ptab==='insights') body = parentInsights();
  else if(ui.ptab==='missions') body = parentMissions();
  else if(ui.ptab==='family') body = parentFamily();
  else if(ui.ptab==='reports') body = parentReports();
  else body = parentSettings();
  $('#app').innerHTML =
  '<div class="topbar">'+
    '<img class="logo" src="'+LOGO+'" alt="Tiny Champions">'+
    '<div class="who"><div class="hi">Parent Dashboard</div><div class="name">Welcome back 👋</div></div>'+
    '<button class="btn-parent" onclick="ui.parentUnlocked=false;ui.screen=\'home\';sfx.tap();render()" aria-label="Back to kid mode">🧒</button>'+
  '</div>'+
  '<div class="screen parent-screen">'+
    '<div class="ptabs">'+tabs.map(function(t){return '<button class="ptab '+(ui.ptab===t.id?'active':'')+'" onclick="ui.ptab=\''+t.id+'\';sfx.tap();render()">'+t.name+(t.id==='approve'&&pendCount?' ('+pendCount+')':'')+'</button>';}).join('')+'</div>'+
    body+
  '</div>';
}
function parentInsights(){
  if(!S.children.length) return '<div class="empty"><span class="e-emoji">🧠</span><b>No Champions yet</b><small>Add a child in the Family tab.</small></div>';
  return S.children.map(function(c){
    var dom = computeDomains(c);
    var conf = confidenceFor(c);
    var sg = strengthsAndGrowth(dom);
    var matches = activityMatches(dom);
    var noData = conf.n===0;
    return '<div class="card">'+
      '<div class="card-title"><span class="kc-dot" style="background:'+champColor(c)+';width:30px;height:30px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:.7rem">'+initials(c.name)+'</span> '+esc(c.name)+'&rsquo;s capability profile</div>'+
      '<div class="conf-pill">'+conf.label+'</div>'+
      (noData?'<p style="font-size:.85rem;color:var(--muted);font-weight:600;line-height:1.5;margin-top:8px">Once '+esc(c.name)+' plays arcade games and completes missions, a skill profile builds here automatically — memory, focus, coordination, speed and more.</p>':
      Object.keys(DOMAINS).map(function(k){
        var d = DOMAINS[k], v = dom[k], band = bandFor(v.score);
        return '<div class="dom-row"><div class="d-emoji">'+d.emoji+'</div>'+
          '<div class="d-body"><div class="d-name">'+d.name+(v.trend==='up'?' <span class="d-trend">📈 improving</span>':'')+'</div>'+
          '<div class="d-bar"><i style="width:'+(v.score||0)+'%;background:'+band.color+'"></i></div></div>'+
          '<div class="d-band" style="color:'+band.color+'">'+band.label+'</div></div>';
      }).join('')+
      (sg.strengths.length||sg.growth.length?
        '<div style="margin-top:12px" class="chip-row">'+
        sg.strengths.map(function(p){return '<span class="s-chip strong">💪 '+DOMAINS[p.k].name+'</span>';}).join('')+
        sg.growth.map(function(p){return '<span class="s-chip grow">🌱 '+DOMAINS[p.k].name+'</span>';}).join('')+
        '</div>':'')
      )+
    '</div>'+
    (matches.length && !noData?
      '<div class="card"><div class="card-title">🧭 Where '+esc(c.name)+'&rsquo;s strengths could shine</div>'+
      matches.map(function(m){
        return '<div class="act-card"><span class="a-emoji">'+m.a.emoji+'</span><div style="flex:1">'+
          '<div class="a-name">'+m.a.name+' <span style="font-size:.7rem;color:var(--muted);font-weight:800">'+m.score+'% match</span></div>'+
          '<div class="a-why">Because '+m.a.why+'.</div>'+
          '<a class="btn-maps" target="_blank" rel="noopener" href="https://www.google.com/maps/search/'+encodeURIComponent(m.a.query)+'">📍 Find highly-rated places nearby ↗</a>'+
          '</div></div>';
      }).join('')+
      '<p style="font-size:.72rem;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.5">Opens Google Maps near you with live ratings and reviews.</p></div>':'')+
    '<div class="card"><div class="card-title">📄 Generate a report for '+esc(c.name)+'</div>'+
      '<div class="report-btns">'+
      '<button class="rbtn" onclick="openReport(\''+c.id+'\',\'home\')"><div class="r-emoji">🏠</div><div class="r-name">Home report</div></button>'+
      '<button class="rbtn" onclick="openReport(\''+c.id+'\',\'school\')"><div class="r-emoji">🏫</div><div class="r-name">School report</div></button>'+
      '<button class="rbtn" onclick="openReport(\''+c.id+'\',\'therapy\')"><div class="r-emoji">🩺</div><div class="r-name">Therapy report</div></button>'+
      '</div><p style="font-size:.72rem;color:var(--muted);font-weight:600;margin-top:10px;line-height:1.5">Print or save as PDF to hand to a teacher or therapist.</p></div>';
  }).join('');
}
function openReport(cid, kind){
  ui.report = {cid:cid, kind:kind};
  sfx.tap(); render();
}
function closeReport(){ ui.report = null; render(); }
function printReport(){ window.print(); }

/* ============ REPORT BUILDER ============ */
function renderReportScreen(){
  var c = S.children.find(function(x){return x.id===ui.report.cid;});
  if(!c){ ui.report=null; render(); return; }
  var kind = ui.report.kind;
  $('#app').innerHTML =
  '<div class="topbar no-print">'+
    '<button class="btn-parent" onclick="closeReport()" aria-label="Back">←</button>'+
    '<div class="who"><div class="hi">Report preview</div><div class="name">'+esc(c.name)+'</div></div>'+
    '<button class="btn-parent" style="width:auto;padding:0 16px;font-size:.9rem;font-weight:800" onclick="printReport()">🖨️ Print / PDF</button>'+
  '</div>'+
  '<div class="screen parent-screen" style="padding-top:8px">'+buildReport(c, kind)+
  '<button class="btn btn-soft no-print" style="margin-top:14px" onclick="closeReport()">← Back to Insights</button></div>';
}
function buildReport(c, kind){
  var dom = computeDomains(c);
  var sg = strengthsAndGrowth(dom);
  var conf = confidenceFor(c);
  var cutoff = Date.now() - 14*86400000;
  var hist14 = S.history.filter(function(h){ return h.cid===c.id && new Date(h.d+'T12:00:00').getTime()>=cutoff; });
  var days14 = {}; hist14.forEach(function(h){ days14[h.d]=1; });
  var plays14 = (c.playLog||[]).filter(function(e){return e.t>=cutoff;});
  var moods = (c.moods||[]).filter(function(m){return m.ts>=cutoff;});
  var moodCounts = {};
  moods.forEach(function(m){ moodCounts[m.mood]=(moodCounts[m.mood]||0)+1; });
  var titles = {home:'Home Report 🏠', school:'School Report 🏫', therapy:'Therapy & Development Report 🩺'};
  var today = new Date();
  var dateStr = today.toLocaleDateString('en-AU', {day:'numeric', month:'long', year:'numeric'});
  var topD = sg.strengths[0] ? DOMAINS[sg.strengths[0].k] : null;
  var lowD = sg.growth[0] ? DOMAINS[sg.growth[0].k] : null;

  var html = '<div class="report-sheet">'+
    '<div class="rep-head"><img src="'+LOGO+'" alt="Tiny Champions">'+
    '<div><h1>'+titles[kind]+'</h1><div class="rep-meta">'+esc(c.name)+' · Level '+c.level+' Champion · '+dateStr+' · last 14 days</div></div></div>'+
    '<div class="rep-stats">'+
      '<div class="rep-stat"><b>'+hist14.length+'</b><small>Missions done</small></div>'+
      '<div class="rep-stat"><b>'+Object.keys(days14).length+'/14</b><small>Active days</small></div>'+
      '<div class="rep-stat"><b>'+c.streak+'</b><small>Day streak</small></div>'+
      '<div class="rep-stat"><b>'+plays14.length+'</b><small>Game plays</small></div>'+
    '</div>';

  // domain table (all kinds)
  html += '<h3>🧠 Skill profile</h3><table class="rep-table"><tr><th>Area</th><th>Level</th><th>Trend</th><th>Data</th></tr>'+
    Object.keys(DOMAINS).map(function(k){
      var v = dom[k], band = bandFor(v.score);
      return '<tr><td><b>'+DOMAINS[k].emoji+' '+DOMAINS[k].name+'</b></td><td style="color:'+band.color+';font-weight:800">'+band.label+'</td>'+
        '<td>'+(v.trend==='up'?'📈 Improving':v.trend==='steady'?'➡️ Steady':'—')+'</td><td>'+v.plays+' plays</td></tr>';
    }).join('')+'</table>';

  if(kind==='home'){
    html += '<h3>🌟 What&rsquo;s going well</h3><p>'+
      (topD ? esc(c.name)+' is showing real strength in <b>'+topD.name.toLowerCase()+'</b>'+(sg.strengths[1]?' and <b>'+DOMAINS[sg.strengths[1].k].name.toLowerCase()+'</b>':'')+'. Celebrate it out loud — named strengths grow fastest.' :
      esc(c.name)+' is just getting started — every play session teaches us more.')+'</p>';
    html += '<h3>🌱 Try this week</h3><ul>'+
      (lowD ? lowD.tips.slice(0,2).map(function(t){return '<li>'+t+'</li>';}).join('') : '<li>Keep a steady daily rhythm of 1–3 missions.</li>')+
      (topD ? '<li>Feed the strength: '+topD.tips[0].toLowerCase()+'</li>' : '')+
      '</ul>';
  }
  if(kind==='school'){
    html += '<h3>📝 Classroom-relevant observations</h3><ul>'+
      Object.keys(DOMAINS).filter(function(k){return ['memory','attention','speed','coordination','routine'].indexOf(k)>=0 && dom[k].score!==null;}).map(function(k){
        var band = bandFor(dom[k].score);
        return '<li><b>'+DOMAINS[k].name+'</b> ('+band.label.replace(/ .*/,'')+'): relates to '+DOMAINS[k].school+'.'+(dom[k].trend==='up'?' Currently improving at home.':'')+'</li>';
      }).join('')+'</ul>';
    html += '<h3>🤝 Suggested classroom supports</h3><ul>'+
      (lowD ? '<li>'+esc(c.name)+' benefits from support with '+lowD.name.toLowerCase()+' — e.g. '+lowD.tips[0].toLowerCase()+'.</li>':'')+
      '<li>Positive reinforcement works strongly for '+esc(c.name)+' — small, immediate acknowledgements.</li>'+
      (topD?'<li>Leverage their '+topD.name.toLowerCase()+' as a confidence anchor when introducing new material.</li>':'')+
      '</ul>';
  }
  if(kind==='therapy'){
    html += '<h3>📈 Engagement pattern</h3><p>'+
      'Across the last 14 days: '+hist14.length+' completed real-world tasks over '+Object.keys(days14).length+' active days'+
      (c.streak>1?' with a current streak of '+c.streak+' consecutive days':'')+'. '+
      plays14.length+' skill-game plays logged'+(plays14.length? ' (avg '+(Math.round(plays14.length/14*10)/10)+'/day)':'')+'.</p>';
    html += '<h3>💗 Emotional check-ins (self-reported)</h3>'+
      (moods.length ? '<table class="rep-table"><tr><th>Feeling</th><th>Times chosen</th></tr>'+
        Object.keys(moodCounts).map(function(k){ var mm = MOODS.find(function(x){return x.id===k;}); return '<tr><td>'+(mm?mm.emoji+' '+mm.name:k)+'</td><td>'+moodCounts[k]+'</td></tr>'; }).join('')+'</table>'
      : '<p>No emotional check-ins recorded in this period.</p>');
    html += '<h3>🔍 Notes for the clinician</h3><ul>'+
      '<li>Scores are relative to the child&rsquo;s own baseline and play volume — not age-normed.</li>'+
      (lowD?'<li>Lowest-signal area currently: <b>'+lowD.name+'</b> — may merit targeted observation.</li>':'')+
      (topD?'<li>Strongest engagement and performance: <b>'+topD.name+'</b>.</li>':'')+
      '<li>Communication and speech are not directly measured by this app.</li>'+
      '<li>Data confidence: '+conf.n+' data points in total.</li>'+
      '</ul>';
  }

  html += '<div class="rep-disclaimer">⚠️ This report is generated from play patterns in Tiny Champions. It reflects play-based observations only — it is <b>not</b> a clinical assessment, diagnosis or age-normed measurement. Always consult qualified professionals for developmental guidance.</div>'+
    '<p style="margin-top:14px;font-size:.7rem;color:#6b76a3;font-weight:700;text-align:center">Generated by Tiny Champions · '+dateStr+' · all data stays on your device</p></div>';
  return html;
}
render();
/* session-scoped view hook (used by tests/screenshots; cleared immediately) */
try{
  var dv = sessionStorage.getItem('tc_view');
  if(dv && S.setup){
    sessionStorage.removeItem('tc_view');
    ui.parentUnlocked = true;
    if(dv.indexOf('report:')===0){ ui.ptab='insights'; ui.report = {cid:S.children[0].id, kind:dv.split(':')[1]||'therapy'}; }
    else ui.ptab = dv;
    render();
  }
}catch(e){}
</script>
</body>
</html>
