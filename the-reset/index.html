  "Healing isn't a straight line — and that's okay.",
];
// Pick one affirmation that stays the same all day, then changes tomorrow.
function affirmationForToday() {
  const dayNumber = Math.floor(Date.now() / 86400000);
  return AFFIRMATIONS[dayNumber % AFFIRMATIONS.length];
}
const uid = () => Math.random().toString(36).slice(2, 9);
const money = (n) =>

// A date offset from today, as YYYY-MM-DD (used for sample data + inputs)
function isoDate(offsetDays = 0) {
  const d = new Date();
  d.setDate(d.getDate() + offsetDays);
  return d.toISOString().slice(0, 10);
}

/* ---------- Load & save ---------- */
function loadData() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return JSON.parse(raw);
  } catch (e) {}
  return null;
}
function saveData(data) {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(data)); } catch (e) {}
}

/* =======================================================================

/* =======================================================================
   Work helpers (hours, pay, weeks, invoice text)
   ======================================================================= */
function shiftHours(s) {
  if (!s.start || !s.end) return 0;
  const [sh, sm] = s.start.split(":").map(Number);
  const [eh, em] = s.end.split(":").map(Number);
  let mins = eh * 60 + em - (sh * 60 + sm);
  if (mins < 0) mins += 1440; // overnight shift
  return mins / 60;
}
function shiftPay(s) {
  return shiftHours(s) * (Number(s.rate) || 0);
}
function startOfWeek(date) {
  const x = new Date(date);
  const day = (x.getDay() + 6) % 7; // Monday = 0
  x.setDate(x.getDate() - day);
  x.setHours(0, 0, 0, 0);
  return x;
}
function isThisWeek(dateStr) {
  if (!dateStr) return false;
  const start = startOfWeek(new Date());
  const end = new Date(start); end.setDate(end.getDate() + 7);
  const d = new Date(dateStr + "T00:00:00");
  return d >= start && d < end;
}
const STATUS_LABEL = { "not-sent": "Not sent", sent: "Sent", paid: "Paid" };
function invoiceText(shifts) {
  const byEmp = {};
  shifts.forEach((s) => { (byEmp[s.employer || "Client"] = byEmp[s.employer || "Client"] || []).push(s); });
  let out = "INVOICE SUMMARY\nGenerated: " + new Date().toLocaleDateString() + "\n";
  let grand = 0;
  Object.keys(byEmp).forEach((emp) => {
    out += "\n" + emp + "\n";
    byEmp[emp].forEach((s) => {
      const pay = shiftPay(s); grand += pay;
      out += "  " + s.date + "  " + s.start + "-" + s.end + "  " +
             shiftHours(s).toFixed(2) + "h x $" + (Number(s.rate) || 0) + " = " +
             money(pay) + "  [" + STATUS_LABEL[s.status] + "]\n";
    });
  });
  out += "\nTOTAL: " + money(grand);
  return out;
}

            <button
              key={m.id}
              onClick={() => setToday({ mood: m.id })}
              className={"py-3 rounded-xl border-2 font-bold text-sm flex flex-col items-center gap-1 transition " +
                (today.mood === m.id ? m.on : "bg-white border-slate-200 text-slate-500")}
            >
              <span className="text-2xl">{m.emoji}</span>
              {m.label}
            </button>
          ))}
        </div>
        {!survival && (

            onClick={() => setToday({ survivalMode: true })}
            className="mt-3 w-full text-sm font-bold text-teal-700 bg-teal-50 rounded-xl py-2 active:bg-teal-100"
          >
            I'm tired / overwhelmed — show me survival mode
          </button>
        )}
      </Card>

      {/* Survival mode plan */}
      {survival && (

          <div className="flex items-center justify-between">
            <h3 className="text-lg font-extrabold text-teal-800">🫶 Survival mode</h3>

/* =======================================================================
   2. BUDGET TRACKER
   ======================================================================= */
function BudgetView({ data, setKey }) {
  const b = data.budget;
  const setBudget = (patch) => setKey("budget", (cur) => ({ ...cur, ...patch }));

  const rows = [
    { key: "rent",     label: "Rent" },
    { key: "bills",    label: "Bills & subscriptions" },
    { key: "food",     label: "Food & groceries" },
    { key: "fuel",     label: "Fuel / transport" },
    { key: "medicine", label: "Medicine / health" },
    { key: "debts",    label: "Debts / loans" },
  ];
  const committed = rows.reduce((sum, r) => sum + (Number(b[r.key]) || 0), 0);
  const totalIn = (Number(b.available) || 0) + (Number(b.incoming) || 0);
  const leftover = totalIn - committed;
  const overspending = leftover < 0;
  const usedPct = totalIn > 0 ? Math.min(100, (committed / totalIn) * 100) : 0;

  const [dns, setDns] = useState("");
  const addDns = () => {
    if (!dns.trim()) return;
    setBudget({ doNotSpend: [...b.doNotSpend, { id: uid(), text: dns.trim() }] });
    setDns("");
  };
  const delDns = (id) => setBudget({ doNotSpend: b.doNotSpend.filter((x) => x.id !== id) });

  const MoneyField = ({ k, label }) => (
    <div>
      <Label>{label}</Label>
      <div className="relative">
        <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">$</span>
        <Input type="number" inputMode="decimal" className="pl-8"
               value={b[k] ?? ""} onChange={(e) => setBudget({ [k]: e.target.value })} placeholder="0" />
      </div>
    </div>
  );

  return (
    <div className="space-y-4">
      <SectionHeader icon="💰" title="Money" subtitle="A calm, honest look at what's coming in and going out." />

      {/* Big leftover number */}
      <Card className={overspending ? "bg-rose-50 border-rose-100" : "bg-emerald-50 border-emerald-100"}>
        <p className="font-bold text-slate-500">Leftover money (safe to spend)</p>
        <p className={"text-4xl font-extrabold " + (overspending ? "text-rose-600" : "text-emerald-600")}>{money(leftover)}</p>
        <div className="mt-3 h-2.5 rounded-full bg-white overflow-hidden">
          <div className={"h-full " + (overspending ? "bg-rose-500" : "bg-emerald-500")} style={{ width: usedPct + "%" }} />
        </div>
        <p className="text-xs text-slate-500 mt-1">{money(committed)} committed of {money(totalIn)} available</p>
        {overspending && (
          <p className="mt-3 text-sm font-bold text-rose-700 bg-white rounded-xl p-3">
            ⚠️ You're planning to spend more than you have. Try trimming food, fuel or bills, or move a debt payment to next week.
          </p>
        )}
      </Card>

      <div className="grid grid-cols-2 gap-3">
        <Card><MoneyField k="available" label="Money I have now" /></Card>
        <Card><MoneyField k="incoming" label="Money coming in" /></Card>
      </div>

      <Card>
        <Label>Where it's going</Label>
        <div className="grid grid-cols-2 gap-3 mt-1">
          {rows.map((r) => <MoneyField key={r.key} k={r.key} label={r.label} />)}
        </div>
      </Card>

      {/* Do not spend list */}
      <Card>
        <Label>🚫 Do NOT spend on</Label>
        <p className="text-xs text-slate-400 mb-2">Your gentle reminders when you feel the urge.</p>
        <div className="flex gap-2 mb-2">
          <Input value={dns} onChange={(e) => setDns(e.target.value)}
                 onKeyDown={(e) => e.key === "Enter" && addDns()}
                 placeholder="e.g. Late-night takeaway" />
          <Btn onClick={addDns} className="shrink-0">Add</Btn>
        </div>
        {b.doNotSpend.length === 0 ? (
          <Empty>No items yet.</Empty>
        ) : (
          <ul className="space-y-2">
            {b.doNotSpend.map((x) => (
              <li key={x.id} className="flex items-center gap-2 bg-rose-50 rounded-xl px-3 py-2">
                <span className="flex-1 font-bold text-rose-700">{x.text}</span>
                <button onClick={() => delDns(x.id)} className="text-rose-300 text-lg">✕</button>
              </li>
            ))}
          </ul>
        )}
      </Card>
    </div>
  );
}

/* =======================================================================
   3. WORK & INVOICE TRACKER
   ======================================================================= */
function WorkView({ data, setKey }) {
  const shifts = data.shifts;
  const setShifts = (fn) => setKey("shifts", fn);

  const blank = { employer: "", date: isoDate(0), start: "09:00", end: "17:00", rate: "" };
  const [form, setForm] = useState(blank);
  const [invoice, setInvoice] = useState(null); // holds the generated text when modal open

  const addShift = () => {
    if (!form.employer.trim()) return;
    setShifts((arr) => [{ id: uid(), status: "not-sent", ...form, rate: form.rate || 0 }, ...arr]);
    setForm(blank);
  };
  const delShift = (id) => setShifts((arr) => arr.filter((s) => s.id !== id));
  const cycleStatus = (id) =>
    setShifts((arr) => arr.map((s) => {
      if (s.id !== id) return s;
      const order = ["not-sent", "sent", "paid"];
      return { ...s, status: order[(order.indexOf(s.status) + 1) % 3] };
    }));

  const weekTotal = shifts.filter((s) => isThisWeek(s.date)).reduce((sum, s) => sum + shiftPay(s), 0);
  const unpaidTotal = shifts.filter((s) => s.status !== "paid").reduce((sum, s) => sum + shiftPay(s), 0);

  const statusStyle = {
    "not-sent": "bg-slate-100 text-slate-600",
    sent: "bg-sky-100 text-sky-700",
    paid: "bg-emerald-100 text-emerald-700",
  };

  const copyInvoice = () => {
    if (navigator.clipboard) navigator.clipboard.writeText(invoice).catch(() => {});
  };

  return (
    <div className="space-y-4">
      <SectionHeader icon="🧾" title="Work & Invoices" subtitle="Track shifts, pay and what's been invoiced." />

      <div className="grid grid-cols-2 gap-3">
        <Card><p className="text-xs font-bold text-slate-400">This week's pay</p><p className="text-2xl font-extrabold text-slate-800">{money(weekTotal)}</p></Card>
        <Card><p className="text-xs font-bold text-slate-400">Not yet paid</p><p className="text-2xl font-extrabold text-amber-600">{money(unpaidTotal)}</p></Card>
      </div>

      {/* Add a shift */}
      <Card>
        <Label>Add a work shift</Label>
        <div className="space-y-2 mt-1">
          <Input placeholder="Employer / client name" value={form.employer}
                 onChange={(e) => setForm({ ...form, employer: e.target.value })} />
          <Input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
          <div className="grid grid-cols-2 gap-2">
            <div><Label>Start</Label><Input type="time" value={form.start} onChange={(e) => setForm({ ...form, start: e.target.value })} /></div>
            <div><Label>End</Label><Input type="time" value={form.end} onChange={(e) => setForm({ ...form, end: e.target.value })} /></div>
          </div>
          <div>
            <Label>Hourly rate</Label>
            <div className="relative">
              <span className="absolute left-4 top-1/2 -translate-y-1/2 text-slate-400 font-bold">$</span>
              <Input type="number" inputMode="decimal" className="pl-8" placeholder="0"
                     value={form.rate} onChange={(e) => setForm({ ...form, rate: e.target.value })} />
            </div>
          </div>
          <Btn onClick={addShift} className="w-full">Add shift</Btn>
        </div>
      </Card>

      {shifts.length > 0 && (
        <Btn variant="soft" className="w-full" onClick={() => setInvoice(invoiceText(shifts))}>
          🧾 Create invoice summary text
        </Btn>
      )}

      {/* Shift list */}
      {shifts.length === 0 ? (
        <Empty>No shifts yet. Add your first one above.</Empty>
      ) : (
        <div className="space-y-3">
          {shifts.map((s) => (
            <Card key={s.id}>
              <div className="flex items-start justify-between">
                <div>
                  <p className="font-extrabold text-slate-800">{s.employer || "Client"}</p>
                  <p className="text-sm text-slate-500">{s.date} · {s.start}–{s.end} · {shiftHours(s).toFixed(2)}h @ {money(s.rate)}/hr</p>
                </div>
                <button onClick={() => delShift(s.id)} className="text-slate-300 text-lg px-1">✕</button>
              </div>
              <div className="flex items-center justify-between mt-3">
                <p className="text-xl font-extrabold text-slate-800">{money(shiftPay(s))}</p>
                <button onClick={() => cycleStatus(s.id)}
                        className={"px-3 py-1.5 rounded-full text-sm font-bold " + statusStyle[s.status]}>
                  {STATUS_LABEL[s.status]} ⟳
                </button>
              </div>
            </Card>
          ))}
        </div>
      )}

      {invoice && (
        <Modal title="Invoice summary" onClose={() => setInvoice(null)}>
          <p className="text-sm text-slate-500 mb-2">Copy this and paste it into a message or email.</p>
          <TextArea rows={12} value={invoice} readOnly className="font-mono text-sm" />
          <Btn className="w-full mt-3" onClick={copyInvoice}>Copy to clipboard</Btn>
        </Modal>
      )}
    </div>
  );
}

  const del = (id) => setTasks((arr) => arr.filter((t) => t.id !== id));

      <SectionHeader icon="✅" title="Tasks" subtitle="One clear list. Sorted by what matters most." />

      <Card>
        <Label>Add a task</Label>
        <div className="space-y-2 mt-1">
          <Input placeholder="What needs doing?" value={form.text}
                 onChange={(e) => setForm({ ...form, text: e.target.value })}
                 onKeyDown={(e) => e.key === "Enter" && add()} />
          <div className="grid grid-cols-2 gap-2">
            <Select value={form.priority} onChange={(e) => setForm({ ...form, priority: e.target.value })}>
              {PRIORITIES.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}
            </Select>
            <Input type="date" value={form.due} onChange={(e) => setForm({ ...form, due: e.target.value })} />
          </div>
          <Btn onClick={add} className="w-full">Add task</Btn>
        </div>
      </Card>

      <div className="flex gap-2">
        <Chip active={filter === "todo"} onClick={() => setFilter("todo")}>To do</Chip>
        <Chip active={filter === "done"} onClick={() => setFilter("done")}>Done</Chip>
        <Chip active={filter === "all"} onClick={() => setFilter("all")}>All</Chip>
      </div>

      {shown.length === 0 ? <Empty>Nothing here. Enjoy the breathing room.</Empty> : (
        <div className="space-y-2">
          {shown.map((t) => {
            const pr = PRIORITIES.find((p) => p.id === t.priority);
            return (
              <Card key={t.id} className="flex items-start gap-3 py-3">
                <Tick done={t.status === "done"} onClick={() => cycleStatus(t.id)} />
                <div className="flex-1 min-w-0">
                  <p className={t.status === "done" ? "line-through text-slate-400 font-bold" : "font-bold"}>{t.text}</p>
                  <div className="flex flex-wrap items-center gap-1.5 mt-1">
                    <span className={"text-xs font-bold px-2 py-0.5 rounded-full " + pr.style}>{pr.label}</span>
                    <button onClick={() => cycleStatus(t.id)} className={"text-xs font-bold px-2 py-0.5 rounded-full " + statusStyle[t.status]}>{statusLabel[t.status]} ⟳</button>
                    {t.due && <span className="text-xs font-bold text-slate-400">📅 {t.due}</span>}
                  </div>
                </div>
                <button onClick={() => del(t.id)} className="text-slate-300 text-lg">✕</button>
              </Card>
            );
          })}
        </div>
      )}
    </div>
  );
}

/* =======================================================================
   8. NOTES
   ======================================================================= */
function NotesView({ data, setKey }) {
  const notes = data.notes;
  const setNotes = (fn) => setKey("notes", fn);
  const [text, setText] = useState("");
  const [search, setSearch] = useState("");
  const [editingId, setEditingId] = useState(null);
  const [editText, setEditText] = useState("");

  const add = () => {
    if (!text.trim()) return;
    setNotes((arr) => [{ id: uid(), text: text.trim(), created: Date.now() }, ...arr]);
    setText("");
  };
  const del = (id) => setNotes((arr) => arr.filter((n) => n.id !== id));
  const startEdit = (n) => { setEditingId(n.id); setEditText(n.text); };
  const saveEdit = () => {
    setNotes((arr) => arr.map((n) => (n.id === editingId ? { ...n, text: editText } : n)));
    setEditingId(null); setEditText("");
  };

  const shown = notes.filter((n) => n.text.toLowerCase().includes(search.toLowerCase()));

  return (
    <div className="space-y-4">
      <SectionHeader icon="📝" title="Notes" subtitle="A quick place to dump anything on your mind." />

      <Card>
        <TextArea rows={3} value={text} onChange={(e) => setText(e.target.value)}
                  placeholder="Type a quick note… (like a voice note, but text)" />
        <Btn onClick={add} className="w-full mt-2">Save note</Btn>
      </Card>

      <Input value={search} onChange={(e) => setSearch(e.target.value)} placeholder="🔍 Search notes" />

      {shown.length === 0 ? <Empty>{notes.length === 0 ? "No notes yet." : "No notes match your search."}</Empty> : (
        <div className="space-y-2">
          {shown.map((n) => (
            <Card key={n.id}>
              {editingId === n.id ? (
                <div>
                  <TextArea rows={3} value={editText} onChange={(e) => setEditText(e.target.value)} />
                  <div className="flex gap-2 mt-2">
                    <Btn onClick={saveEdit} className="flex-1">Save</Btn>
                    <Btn variant="ghost" onClick={() => setEditingId(null)} className="flex-1">Cancel</Btn>
                  </div>
                </div>
              ) : (
                <div>
                  <p className="whitespace-pre-wrap">{n.text}</p>
                  <div className="flex items-center justify-between mt-2">
                    <span className="text-xs text-slate-400">{new Date(n.created).toLocaleString(undefined, { day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" })}</span>
                    <div className="flex gap-3">
                      <button onClick={() => startEdit(n)} className="text-xs font-bold text-teal-700">Edit</button>
                      <button onClick={() => del(n.id)} className="text-xs font-bold text-rose-500">Delete</button>
                    </div>
                  </div>
                </div>
              )}
            </Card>
          ))}
        </div>
      )}
    </div>
  );
}

/* =======================================================================
   Settings (reset sample data, start fresh, backup / restore)
   ======================================================================= */
function SettingsModal({ data, setData, onClose }) {
  const [restoreText, setRestoreText] = useState("");
  const backup = JSON.stringify(data);

  const copyBackup = () => { if (navigator.clipboard) navigator.clipboard.writeText(backup).catch(() => {}); };
  const doRestore = () => {
    try {
      const parsed = JSON.parse(restoreText);
      if (parsed && typeof parsed === "object") { setData(parsed); onClose(); }
    } catch (e) { alert("That doesn't look like valid backup text."); }
  };

  return (
    <Modal title="Settings" onClose={onClose}>
      <div className="space-y-3">
        <p className="text-sm text-slate-500">Your data is saved on this device only. Back it up here if you want to keep it safe.</p>

        <Btn variant="ghost" className="w-full" onClick={() => { if (confirm("Reload the example data? This replaces what's here.")) { setData(sampleData()); onClose(); } }}>
          Reload example data
        </Btn>
        <Btn variant="danger" className="w-full" onClick={() => { if (confirm("Start completely fresh? This erases everything.")) { setData(emptyData()); onClose(); } }}>
          Start fresh (erase everything)
        </Btn>

        <div className="pt-2 border-t border-slate-100">
          <Label>Back up my data</Label>
          <TextArea rows={3} readOnly value={backup} className="font-mono text-xs" />
          <Btn variant="soft" className="w-full mt-2" onClick={copyBackup}>Copy backup text</Btn>
        </div>

        <div className="pt-2 border-t border-slate-100">
          <Label>Restore from backup</Label>
          <TextArea rows={3} value={restoreText} onChange={(e) => setRestoreText(e.target.value)} placeholder="Paste your backup text here…" className="font-mono text-xs" />
          <Btn className="w-full mt-2" onClick={doRestore} disabled={!restoreText.trim()}>Restore</Btn>
        </div>
      </div>
    </Modal>
  );
}

// A blank slate (used by "Start fresh")
function emptyData() {
  return {
    version: 1,
    today: { mood: "medium", survivalMode: false, priorities: ["", "", ""], reminders: [] },
    tasks: [],
    budget: { available: "", incoming: "", rent: "", bills: "", food: "", fuel: "", medicine: "", debts: "", doNotSpend: [] },
    shifts: [],
    shoppingBudget: "",
    shopping: [],
    kids: [],
    health: {
      checklist: { shower: false, eat: false, water: false, cleanRoom: false, pray: false, walk: false, sleepPlan: false },
      meds: [], sleepNotes: "", foodNotes: "", exerciseNotes: "", resetNotes: "",
    },
    notes: [],
  };
}

/* =======================================================================
   The App shell — header, tab strip, and the active section
   ======================================================================= */
function App() {
  const [data, setData] = useState(() => loadData() || sampleData());
  const [tab, setTab] = useState("today");
  const [showSettings, setShowSettings] = useState(false);
  const mainRef = useRef(null);

  // Save to localStorage whenever data changes
  useEffect(() => { saveData(data); }, [data]);

  // Scroll to top when switching sections
  useEffect(() => { if (mainRef.current) mainRef.current.scrollTop = 0; window.scrollTo(0, 0); }, [tab]);

  // Update one top-level slice of the data (value can be a value or an updater fn)
  const setKey = (key, val) =>
    setData((d) => ({ ...d, [key]: typeof val === "function" ? val(d[key]) : val }));

  const views = {
    today: <TodayView data={data} setKey={setKey} go={setTab} />,
    budget: <BudgetView data={data} setKey={setKey} />,
    work: <WorkView data={data} setKey={setKey} />,
    shopping: <ShoppingView data={data} setKey={setKey} />,
    kids: <KidsView data={data} setKey={setKey} />,
    health: <HealthView data={data} setKey={setKey} />,
    tasks: <TasksView data={data} setKey={setKey} />,
    notes: <NotesView data={data} setKey={setKey} />,
  };

  return (
    <div className="max-w-[480px] mx-auto min-h-screen bg-[#f4f5f3] flex flex-col">
      {/* Header + tab strip (sticky) */}
      <div className="sticky top-0 z-30 bg-[#f4f5f3]/95 backdrop-blur border-b border-slate-200/70">
        <div className="flex items-center justify-between px-4 pt-3 pb-2">
          <div className="flex items-center gap-2">
            <div className="w-9 h-9 rounded-xl bg-teal-600 text-white flex items-center justify-center text-lg">🌿</div>
            <div>
              <p className="font-extrabold leading-none text-slate-800">The Reset</p>
              <p className="text-xs text-slate-400 leading-none mt-0.5">One thing at a time</p>
            </div>
          </div>
          <button onClick={() => setShowSettings(true)}
                  className="w-9 h-9 rounded-full bg-white border border-slate-200 text-slate-500 active:bg-slate-100">⚙️</button>
        </div>

        <div className="flex gap-2 overflow-x-auto no-scrollbar px-4 pb-2">
          {TABS.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={"flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition " +
                (tab === t.id ? "bg-teal-600 text-white" : "bg-white text-slate-600 border border-slate-200 active:bg-slate-50")}>
              <span>{t.icon}</span>{t.label}
            </button>
          ))}
        </div>
      </div>

      {/* Active section */}
      <main ref={mainRef} className="flex-1 p-4 pb-10">
        {views[tab]}
        <p className="text-center text-xs text-slate-400 mt-8">
          Saved on your device only · The Reset · Be gentle with yourself 🌿
        </p>
      </main>

      {showSettings && <SettingsModal data={data} setData={setData} onClose={() => setShowSettings(false)} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
