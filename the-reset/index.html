async function callFn(action, body, accessToken) {
  const res = await fetch(FN_URL, {
    method: "POST",
    headers: { "Content-Type": "application/json", "apikey": SUPABASE_KEY, "Authorization": "Bearer " + (accessToken || SUPABASE_KEY) },
    body: JSON.stringify({ action, ...(body || {}) }),
  });
  let json = {}; try { json = await res.json(); } catch (e) {}
  if (!res.ok || json.error) throw new Error(json.error || ("Something went wrong (" + res.status + ")"));
  return json;
}

async function saveCloud(session, data) {

function shiftHours(s) { if (!s.start || !s.end) return 0; const [sh, sm] = s.start.split(":").map(Number); const [eh, em] = s.end.split(":").map(Number); let m = eh * 60 + em - (sh * 60 + sm); if (m < 0) m += 1440; return m / 60; }
function shiftPay(s) { return shiftHours(s) * (Number(s.rate) || 0); }
function startOfWeek(date) { const x = new Date(date); const day = (x.getDay() + 6) % 7; x.setDate(x.getDate() - day); x.setHours(0, 0, 0, 0); return x; }
function isThisWeek(ds) { if (!ds) return false; const s = startOfWeek(new Date()); const e = new Date(s); e.setDate(e.getDate() + 7); const d = new Date(ds + "T00:00:00"); return d >= s && d < e; }
const STATUS_LABEL = { "not-sent": "Not sent", sent: "Sent", paid: "Paid" };
function invoiceText(shifts) {
  const byEmp = {}; shifts.forEach((s) => { (byEmp[s.employer || "Client"] = byEmp[s.employer || "Client"] || []).push(s); });
  let out = "INVOICE SUMMARY\nGenerated: " + new Date().toLocaleDateString() + "\n"; let grand = 0;
  Object.keys(byEmp).forEach((emp) => { out += "\n" + emp + "\n"; byEmp[emp].forEach((s) => { const pay = shiftPay(s); grand += pay; out += "  " + s.date + "  " + s.start + "-" + s.end + "  " + shiftHours(s).toFixed(2) + "h x $" + (Number(s.rate) || 0) + " = " + money(pay) + "  [" + STATUS_LABEL[s.status] + "]\n"; }); });
  out += "\nTOTAL: " + money(grand); return out;
}

        {today.reminders.length === 0 ? <Empty>Nothing to remember right now.</Empty> : (
          <ul className="space-y-2.5">{today.reminders.map((r) => (
            <li key={r.id} className="flex items-center gap-3"><Tick done={r.done} onClick={() => toggleReminder(r.id)} /><span className={"flex-1 " + (r.done ? "line-through text-[#6b7079]" : "text-[#dfe1e6]")}>{r.text}</span><button onClick={() => delReminder(r.id)} className="text-[#4a4f58]"><Icon name="close" className="w-4 h-4" /></button></li>

}

// Defined at module scope (NOT inside BudgetView) so the input is not
// remounted on every keystroke — that would drop focus and lose the edit.
function MoneyField({ label, value, onChange }) {
  return (
    <div>
      <Label>{label}</Label>
      <div className="relative">
        <span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#6b7079] font-bold">$</span>
        <Input type="number" inputMode="decimal" className="pl-7" value={value ?? ""} onChange={onChange} placeholder="0" />
      </div>
    </div>
  );
}
function BudgetView({ data, setKey }) {
  const b = data.budget;
  const setBudget = (patch) => setKey("budget", (c) => ({ ...c, ...patch }));
  const rows = [
    { key: "rent", label: "Rent" }, { key: "bills", label: "Bills & subscriptions" },
    { key: "food", label: "Food & groceries" }, { key: "fuel", label: "Fuel / transport" },
    { key: "medicine", label: "Medicine / health" }, { key: "debts", label: "Debts / loans" },
  ];
  const committed = rows.reduce((s, r) => s + (Number(b[r.key]) || 0), 0);
  const totalIn = (Number(b.available) || 0) + (Number(b.incoming) || 0);
  const leftover = totalIn - committed;
  const over = leftover < 0;
  const usedPct = totalIn > 0 ? Math.min(100, (committed / totalIn) * 100) : 0;
  const [dns, setDns] = useState("");
  const addDns = () => { if (!dns.trim()) return; setBudget({ doNotSpend: [...b.doNotSpend, { id: uid(), text: dns.trim() }] }); setDns(""); };
  const delDns = (id) => setBudget({ doNotSpend: b.doNotSpend.filter((x) => x.id !== id) });
  const field = (k, label) => <MoneyField key={k} label={label} value={b[k]} onChange={(e) => setBudget({ [k]: e.target.value })} />;
  return (
    <div className="space-y-4">
      <SectionHeader icon="money" title="Money" subtitle="A calm, honest look at what's coming in and going out." />
      <div className={"card p-5 " + (over ? "bg-[#1f1414] border-[#4a2a2a]" : "bg-[#141b17] border-[#274031]")}>
        <p className="font-bold text-[#8b909a]">Leftover money — safe to spend</p>
        <p className={"text-4xl font-extrabold mt-1 " + (over ? "text-[#e5736f]" : "text-[#8fc0a1]")}>{money(leftover)}</p>
        <div className="mt-3 h-2.5 rounded-full bg-[#0e0f13] overflow-hidden"><div className={"h-full " + (over ? "bg-[#e5736f]" : "bg-[#7fae8f]")} style={{ width: usedPct + "%" }} /></div>
        <p className="text-xs text-[#8b909a] mt-1.5">{money(committed)} committed of {money(totalIn)} available</p>
        {over && <p className="mt-3 text-sm font-semibold text-[#f0a9a6] bg-[#e5736f]/10 rounded-xl p-3">You're planning to spend more than you have. Try trimming food, fuel or bills, or move a debt payment to next week.</p>}
      </div>
      <div className="grid grid-cols-2 gap-3">
        <Card>{field("available", "Money I have now")}</Card>
        <Card>{field("incoming", "Money coming in")}</Card>
      </div>
      <Card>
        <Label>Where it's going</Label>
        <div className="grid grid-cols-2 gap-3">{rows.map((r) => field(r.key, r.label))}</div>
      </Card>
      <Card>
        <Label>Do NOT spend on</Label>
        <p className="text-xs text-[#6b7079] mb-2">Your gentle reminders for when the urge hits.</p>
        <div className="flex gap-2 mb-2"><Input value={dns} onChange={(e) => setDns(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addDns()} placeholder="e.g. Late-night takeaway" /><Btn onClick={addDns} className="shrink-0"><Icon name="plus" className="w-5 h-5" /></Btn></div>
        {b.doNotSpend.length === 0 ? <Empty>No items yet.</Empty> : (
          <ul className="space-y-2">{b.doNotSpend.map((x) => (
            <li key={x.id} className="flex items-center gap-2 bg-[#e5736f]/8 border border-[#e5736f]/15 rounded-xl px-3 py-2.5"><span className="flex-1 font-semibold text-[#f0a9a6]">{x.text}</span><button onClick={() => delDns(x.id)} className="text-[#e5736f]/50"><Icon name="close" className="w-4 h-4" /></button></li>
          ))}</ul>
        )}
      </Card>
    </div>
  );
}

function WorkView({ data, setKey }) {
  const shifts = data.shifts;
  const setShifts = (fn) => setKey("shifts", fn);
  const blank = { employer: "", date: isoDate(0), start: "09:00", end: "17:00", rate: "" };
  const [form, setForm] = useState(blank);
  const [invoice, setInvoice] = useState(null);
  const addShift = () => { if (!form.employer.trim()) return; setShifts((a) => [{ id: uid(), status: "not-sent", ...form, rate: form.rate || 0 }, ...a]); setForm(blank); };
  const delShift = (id) => setShifts((a) => a.filter((s) => s.id !== id));
  const cycle = (id) => setShifts((a) => a.map((s) => { if (s.id !== id) return s; const o = ["not-sent", "sent", "paid"]; return { ...s, status: o[(o.indexOf(s.status) + 1) % 3] }; }));
  const weekTotal = shifts.filter((s) => isThisWeek(s.date)).reduce((a, s) => a + shiftPay(s), 0);
  const unpaid = shifts.filter((s) => s.status !== "paid").reduce((a, s) => a + shiftPay(s), 0);
  const sStyle = { "not-sent": "bg-[#22262f] text-[#a7abb4]", sent: "bg-[#7fa6d8]/15 text-[#9ec0ea]", paid: "bg-[#7fae8f]/15 text-[#8fc0a1]" };
  const copyInvoice = () => { if (navigator.clipboard) navigator.clipboard.writeText(invoice).catch(() => {}); };
  return (
    <div className="space-y-4">
      <SectionHeader icon="work" title="Work & Invoices" subtitle="Track shifts, pay and what's been invoiced." />
      <div className="grid grid-cols-2 gap-3">
        <Card><p className="text-[11px] font-bold uppercase tracking-wide text-[#71767f]">This week's pay</p><p className="text-2xl font-extrabold mt-1 text-[#ececf0]">{money(weekTotal)}</p></Card>
        <Card><p className="text-[11px] font-bold uppercase tracking-wide text-[#71767f]">Not yet paid</p><p className="text-2xl font-extrabold mt-1 text-[#d8a657]">{money(unpaid)}</p></Card>
      </div>
      <Card>
        <Label>Add a work shift</Label>
        <div className="space-y-2">
          <Input placeholder="Employer / client name" value={form.employer} onChange={(e) => setForm({ ...form, employer: e.target.value })} />
          <Input type="date" value={form.date} onChange={(e) => setForm({ ...form, date: e.target.value })} />
          <div className="grid grid-cols-2 gap-2">
            <div><Label>Start</Label><Input type="time" value={form.start} onChange={(e) => setForm({ ...form, start: e.target.value })} /></div>
            <div><Label>End</Label><Input type="time" value={form.end} onChange={(e) => setForm({ ...form, end: e.target.value })} /></div>
          </div>
          <div><Label>Hourly rate</Label><div className="relative"><span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#6b7079] font-bold">$</span><Input type="number" inputMode="decimal" className="pl-7" placeholder="0" value={form.rate} onChange={(e) => setForm({ ...form, rate: e.target.value })} /></div></div>
          <Btn onClick={addShift} className="w-full">Add shift</Btn>
        </div>
      </Card>
      {shifts.length > 0 && <Btn variant="soft" className="w-full" onClick={() => setInvoice(invoiceText(shifts))}>Create invoice summary text</Btn>}
      {shifts.length === 0 ? <Empty>No shifts yet. Add your first one above.</Empty> : (
        <div className="space-y-3">{shifts.map((s) => (
          <Card key={s.id}>
            <div className="flex items-start justify-between">
              <div><p className="font-extrabold text-[#ececf0]">{s.employer || "Client"}</p><p className="text-sm text-[#8b909a] mt-0.5">{s.date} · {s.start}–{s.end} · {shiftHours(s).toFixed(2)}h @ {money(s.rate)}/hr</p></div>
              <button onClick={() => delShift(s.id)} className="text-[#4a4f58]"><Icon name="close" className="w-4 h-4" /></button>
            </div>
            <div className="flex items-center justify-between mt-3">
              <p className="text-xl font-extrabold text-[#ececf0]">{money(shiftPay(s))}</p>
              <button onClick={() => cycle(s.id)} className={"px-3 py-1.5 rounded-full text-sm font-bold " + sStyle[s.status]}>{STATUS_LABEL[s.status]} ⟳</button>
            </div>
          </Card>
        ))}</div>
      )}
      {invoice && (
        <Modal title="Invoice summary" onClose={() => setInvoice(null)}>
          <p className="text-sm text-[#8b909a] mb-2">Copy this and paste it into a message or email.</p>
          <TextArea rows={12} value={invoice} readOnly className="font-mono text-sm" />
          <Btn className="w-full mt-3" onClick={copyInvoice}>Copy to clipboard</Btn>
        </Modal>
      )}
    </div>
  );
}

const SHOP_CATS = ["Groceries", "House essentials", "Medicine", "Kids", "Work"];
function ShoppingView({ data, setKey }) {
  const items = data.shopping;
  const setItems = (fn) => setKey("shopping", fn);
  const [filter, setFilter] = useState("All");
  const [form, setForm] = useState({ name: "", category: "Groceries", price: "" });
  const addItem = () => { if (!form.name.trim()) return; setItems((a) => [...a, { id: uid(), name: form.name.trim(), category: form.category, price: form.price || 0, bought: false }]); setForm({ name: "", category: form.category, price: "" }); };
  const toggle = (id) => setItems((a) => a.map((i) => (i.id === id ? { ...i, bought: !i.bought } : i)));
  const del = (id) => setItems((a) => a.filter((i) => i.id !== id));
  const shown = items.filter((i) => filter === "All" || i.category === filter);
  const estTotal = items.filter((i) => !i.bought).reduce((s, i) => s + (Number(i.price) || 0), 0);
  const budget = Number(data.shoppingBudget) || 0;
  const over = budget > 0 && estTotal > budget;
  return (
    <div className="space-y-4">
      <SectionHeader icon="shop" title="Shopping" subtitle="What you need — grouped and within budget." />
      <div className={"card p-4 " + (over ? "bg-[#1f1414] border-[#4a2a2a]" : "")}>

          <div className="text-right"><p className="text-[11px] font-bold uppercase tracking-wide text-[#71767f]">Estimated</p><p className={"text-2xl font-extrabold " + (over ? "text-[#e5736f]" : "text-[#ececf0]")}>{money(estTotal)}</p></div>
        </div>
        {over && <p className="mt-2 text-sm font-semibold text-[#f0a9a6]">Over budget by {money(estTotal - budget)}. Consider dropping a few items.</p>}
      </div>
      <Card>
        <Label>Add item</Label>
        <div className="space-y-2">
          <Input placeholder="Item name" value={form.name} onChange={(e) => setForm({ ...form, name: e.target.value })} onKeyDown={(e) => e.key === "Enter" && addItem()} />
          <div className="grid grid-cols-2 gap-2">
            <Select value={form.category} onChange={(e) => setForm({ ...form, category: e.target.value })}>{SHOP_CATS.map((c) => <option key={c}>{c}</option>)}</Select>
            <div className="relative"><span className="absolute left-3.5 top-1/2 -translate-y-1/2 text-[#6b7079] font-bold">$</span><Input type="number" inputMode="decimal" className="pl-7" placeholder="Price" value={form.price} onChange={(e) => setForm({ ...form, price: e.target.value })} /></div>
          </div>
          <Btn onClick={addItem} className="w-full">Add to list</Btn>
        </div>
      </Card>
      <div className="flex gap-2 overflow-x-auto no-scrollbar pb-1">
        <Chip active={filter === "All"} onClick={() => setFilter("All")}>All</Chip>
        {SHOP_CATS.map((c) => <Chip key={c} active={filter === c} onClick={() => setFilter(c)}>{c}</Chip>)}
      </div>
      {shown.length === 0 ? <Empty>Nothing here yet.</Empty> : (
        <div className="space-y-2">{shown.map((i) => (
          <Card key={i.id} className="flex items-center gap-3 py-3"><Tick done={i.bought} onClick={() => toggle(i.id)} /><div className="flex-1"><p className={i.bought ? "line-through text-[#6b7079] font-semibold" : "font-semibold text-[#dfe1e6]"}>{i.name}</p><p className="text-xs text-[#71767f]">{i.category}</p></div><span className="font-bold text-[#a7abb4]">{money(i.price)}</span><button onClick={() => del(i.id)} className="text-[#4a4f58]"><Icon name="close" className="w-4 h-4" /></button></Card>
        ))}</div>
      )}
    </div>
  );
}

    { key: "sleepNotes", label: "Sleep notes" }, { key: "foodNotes", label: "Food notes" },

const PRIORITIES = [
  { id: "urgent", label: "Urgent", style: "bg-[#e5736f]/15 text-[#f0a9a6]" },
  { id: "important", label: "Important", style: "bg-[#d8a657]/15 text-[#e0be7f]" },
  { id: "later", label: "Later", style: "bg-[#22262f] text-[#a7abb4]" },
];
const PRIORITY_ORDER = { urgent: 0, important: 1, later: 2 };
function TasksView({ data, setKey }) {
  const tasks = data.tasks;
  const setTasks = (fn) => setKey("tasks", fn);
  const [filter, setFilter] = useState("todo");
  const [form, setForm] = useState({ text: "", priority: "important", due: "" });
  const add = () => { if (!form.text.trim()) return; setTasks((a) => [...a, { id: uid(), text: form.text.trim(), priority: form.priority, status: "not-started", due: form.due }]); setForm({ text: "", priority: form.priority, due: "" }); };
  const del = (id) => setTasks((a) => a.filter((t) => t.id !== id));
  const cycle = (id) => setTasks((a) => a.map((t) => { if (t.id !== id) return t; const o = ["not-started", "in-progress", "done"]; return { ...t, status: o[(o.indexOf(t.status) + 1) % 3] }; }));
  const sLabel = { "not-started": "Not started", "in-progress": "In progress", done: "Done" };
  const sStyle = { "not-started": "bg-[#22262f] text-[#a7abb4]", "in-progress": "bg-[#7fa6d8]/15 text-[#9ec0ea]", done: "bg-[#7fae8f]/15 text-[#8fc0a1]" };
  const shown = tasks.filter((t) => (filter === "all" ? true : filter === "done" ? t.status === "done" : t.status !== "done")).sort((a, b) => PRIORITY_ORDER[a.priority] - PRIORITY_ORDER[b.priority]);
  return (
    <div className="space-y-4">
      <SectionHeader icon="tasks" title="Tasks" subtitle="One clear list. Sorted by what matters most." />
      <Card>
        <Label>Add a task</Label>
        <div className="space-y-2">
          <Input placeholder="What needs doing?" value={form.text} onChange={(e) => setForm({ ...form, text: e.target.value })} onKeyDown={(e) => e.key === "Enter" && add()} />
          <div className="grid grid-cols-2 gap-2"><Select value={form.priority} onChange={(e) => setForm({ ...form, priority: e.target.value })}>{PRIORITIES.map((p) => <option key={p.id} value={p.id}>{p.label}</option>)}</Select><Input type="date" value={form.due} onChange={(e) => setForm({ ...form, due: e.target.value })} /></div>
          <Btn onClick={add} className="w-full">Add task</Btn>
        </div>
      </Card>
      <div className="flex gap-2"><Chip active={filter === "todo"} onClick={() => setFilter("todo")}>To do</Chip><Chip active={filter === "done"} onClick={() => setFilter("done")}>Done</Chip><Chip active={filter === "all"} onClick={() => setFilter("all")}>All</Chip></div>
      {shown.length === 0 ? <Empty>Nothing here. Enjoy the breathing room.</Empty> : (
        <div className="space-y-2">{shown.map((t) => { const pr = PRIORITIES.find((p) => p.id === t.priority); return (
          <Card key={t.id} className="flex items-start gap-3 py-3">
            <Tick done={t.status === "done"} onClick={() => cycle(t.id)} />
            <div className="flex-1 min-w-0">
              <p className={t.status === "done" ? "line-through text-[#6b7079] font-semibold" : "font-semibold text-[#dfe1e6]"}>{t.text}</p>
              <div className="flex flex-wrap items-center gap-1.5 mt-1.5">
                <span className={"text-xs font-bold px-2 py-0.5 rounded-full " + pr.style}>{pr.label}</span>
                <button onClick={() => cycle(t.id)} className={"text-xs font-bold px-2 py-0.5 rounded-full " + sStyle[t.status]}>{sLabel[t.status]} ⟳</button>
                {t.due && <span className="text-xs font-bold text-[#71767f]">Due {t.due}</span>}
              </div>
            </div>
            <button onClick={() => del(t.id)} className="text-[#4a4f58]"><Icon name="close" className="w-4 h-4" /></button>
          </Card>
        ); })}</div>
      )}
    </div>
  );
}

function SyncBadge({ mode, sync }) {
  let dot = "#71767f", label = "On this device";
  if (mode === "cloud") {
    if (sync === "saving") { dot = "#d8a657"; label = "Saving…"; }
    else if (sync === "error") { dot = "#e5736f"; label = "Not saved"; }
    else { dot = "#7fae8f"; label = "Synced"; }
  }
  return <span className="flex items-center gap-1.5 text-[11px] font-bold text-[#8b909a]"><span className="w-1.5 h-1.5 rounded-full" style={{ background: dot }} />{label}</span>;
}

function App() {
  const [booting, setBooting] = useState(true);
  const [session, setSession] = useState(null);
  const [mode, setMode] = useState("welcome");   // welcome | local | cloud
  const [authView, setAuthView] = useState("welcome");
  const [recovery, setRecovery] = useState(false);
  const [data, setData] = useState(() => loadLocal() || sampleData());
  const [tab, setTab] = useState("today");
  const [showSettings, setShowSettings] = useState(false);
  const [sync, setSync] = useState("saved");
  const mainRef = useRef(null);
  const lastSaved = useRef("");

  const setKey = (key, val) => setData((d) => ({ ...d, [key]: typeof val === "function" ? val(d[key]) : val }));

  async function enterCloud(sess) {
    setSession(sess);
    let cloud = null;
    try { cloud = await loadCloud(sess); } catch (e) {}
    let d;
    if (cloud) d = cloud;
    else { d = loadLocal() || sampleData(); try { await saveCloud(sess, d); } catch (e) {} }
    lastSaved.current = JSON.stringify(d);
    setData(d); setMode("cloud"); setSync("saved");
    try { localStorage.removeItem(TRIAL_KEY); } catch (e) {}
    setBooting(false);
  }

  useEffect(() => {
    let subscription;
    (async () => {
      if (!cloudAvailable) { setMode("local"); setBooting(false); return; }
      try {
        const isRecovery = (window.location.hash || "").indexOf("type=recovery") !== -1;
        const { data: { session: sess } } = await sb.auth.getSession();
        if (sess) { await enterCloud(sess); }
        else if (isRecovery) { setRecovery(true); setBooting(false); }
        else if (localStorage.getItem(TRIAL_KEY) === "1") { setMode("local"); setBooting(false); }
        else { setMode("welcome"); setBooting(false); }
        const res = sb.auth.onAuthStateChange((event, s) => {
          if (event === "PASSWORD_RECOVERY") { setRecovery(true); setBooting(false); }
          else if (event === "SIGNED_OUT") { setSession(null); setMode("welcome"); setAuthView("welcome"); }
        });
        subscription = res.data ? res.data.subscription : null;
      } catch (e) { setMode("welcome"); setBooting(false); }
    })();
    return () => { try { subscription && subscription.unsubscribe(); } catch (e) {} };
  }, []);

  // Persist: always mirror locally; if cloud, debounce-save to the server.
  useEffect(() => {
    saveLocal(data);
    if (mode !== "cloud" || !session) return;
    const json = JSON.stringify(data);
    if (json === lastSaved.current) return;
    setSync("saving");
    const t = setTimeout(async () => {
      try { await saveCloud(session, data); lastSaved.current = json; setSync("saved"); }
      catch (e) { setSync("error"); }
    }, 800);
    return () => clearTimeout(t);
  }, [data, mode, session]);

  useEffect(() => { if (mainRef.current) mainRef.current.scrollTop = 0; window.scrollTo(0, 0); }, [tab]);

  // ---- auth actions ----
  const onTryFree = () => { try { localStorage.setItem(TRIAL_KEY, "1"); } catch (e) {} setData(loadLocal() || sampleData()); setMode("local"); };
  const onLogin = async (email, password) => { const { data: d, error } = await sb.auth.signInWithPassword({ email, password }); if (error) throw new Error(error.message === "Invalid login credentials" ? "Email or password is incorrect." : error.message); await enterCloud(d.session); };
  const onSignup = async (email, password) => { await callFn("signup", { email, password, initialData: loadLocal() || sampleData() }); await onLogin(email, password); };
  const onForgot = async (email) => { await sb.auth.resetPasswordForEmail(email, { redirectTo: window.location.origin }); };
  const onSetPassword = async (pw) => { if (!pw || pw.length < 6) throw new Error("Password must be at least 6 characters."); const { error } = await sb.auth.updateUser({ password: pw }); if (error) throw new Error(error.message); const { data: { session: s } } = await sb.auth.getSession(); try { history.replaceState(null, "", window.location.pathname); } catch (e) {} window.location.hash = ""; await enterCloud(s); setRecovery(false); };
  const onLogout = async () => { try { await sb.auth.signOut(); } catch (e) {} try { localStorage.removeItem(STORE_KEY); localStorage.removeItem(TRIAL_KEY); } catch (e) {} setSession(null); setData(sampleData()); setMode("welcome"); setAuthView("welcome"); setShowSettings(false); };
  const onChangePassword = async (pw) => { if (!pw || pw.length < 6) throw new Error("At least 6 characters."); const { error } = await sb.auth.updateUser({ password: pw }); if (error) throw new Error(error.message); };
  const goSignup = () => { setShowSettings(false); setAuthView("signup"); setMode("welcome"); };

  if (booting) {
    return <div className="min-h-screen flex flex-col items-center justify-center gap-4"><Logo size="w-14 h-14" /><p className="text-[#8b909a] font-bold">The Reset</p></div>;
  }
  if (recovery) return <RecoveryScreen onSetPassword={onSetPassword} />;
  if (mode === "welcome") return <AuthScreen view={authView} setView={setAuthView} onTryFree={onTryFree} onLogin={onLogin} onSignup={onSignup} onForgot={onForgot} />;

  const views = {
    today: <TodayView data={data} setKey={setKey} go={setTab} />,
    budget: <BudgetView data={data} setKey={setKey} />,
    work: <WorkView data={data} setKey={setKey} />,
    shopping: <ShoppingView data={data} setKey={setKey} />,
    kids: <KidsView data={data} setKey={setKey} />,
    health: <HealthView data={data} setKey={setKey} />,
    tasks: <TasksView data={data} setKey={setKey} />,
    notes: <NotesView data={data} setKey={setKey} />,
  };

  return (
    <div className="max-w-[480px] mx-auto min-h-screen flex flex-col">
      <div className="sticky top-0 z-30 bg-[#0e0f13]/90 backdrop-blur-md border-b border-[#1c1f27]">
        <div className="flex items-center justify-between px-4 pt-3 pb-2.5">
          <div className="flex items-center gap-2.5">
            <Logo size="w-10 h-10" />
            <div>
              <p className="font-extrabold leading-none text-[#f2f2f4] text-[17px]">The Reset</p>
              <div className="mt-1"><SyncBadge mode={mode} sync={sync} /></div>
            </div>
          </div>
          <button onClick={() => setShowSettings(true)} className="w-10 h-10 rounded-full bg-[#16181e] border border-[#242832] text-[#a7abb4] flex items-center justify-center"><Icon name="user" className="w-5 h-5" /></button>
        </div>
        <div className="flex gap-2 overflow-x-auto no-scrollbar px-4 pb-2.5">
          {TABS.map((t) => (
            <button key={t.id} onClick={() => setTab(t.id)}
              className={"flex items-center gap-1.5 px-3.5 py-2 rounded-full text-sm font-bold whitespace-nowrap transition " + (tab === t.id ? "bg-[#c8a45c] text-[#141206]" : "bg-[#16181e] text-[#a7abb4] border border-[#242832]")}>
              <Icon name={t.icon} className="w-4 h-4" />{t.label}
            </button>
          ))}
        </div>
      </div>

      <main ref={mainRef} className="flex-1 p-4 pb-12">
        {views[tab]}
        <p className="text-center text-xs text-[#5f646d] mt-8">{mode === "cloud" ? "Synced to your account" : "Saved on this device"} · The Reset · Be gentle with yourself</p>
      </main>

      {showSettings && (
        <SettingsModal data={data} setData={setData} session={session} mode={mode} onClose={() => setShowSettings(false)} onLogout={onLogout} onGoSignup={goSignup} onChangePassword={onChangePassword} />
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
