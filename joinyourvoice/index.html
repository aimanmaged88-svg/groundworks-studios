<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Your Voice — something new is coming</title>
  <meta name="description" content="A breakthrough in how nonverbal children are heard. Join the waitlist — the first families get it before anyone else." />
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: linear-gradient(160deg, #134e4a 0%, #0f766e 100%);
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card { max-width: 560px; width: 100%; text-align: center; }
    .dot {
      width: 72px; height: 72px; border-radius: 50%;
      background: #2dd4bf; margin: 0 auto 28px;
      box-shadow: 0 0 0 18px rgba(45, 212, 191, 0.25), 0 0 0 38px rgba(45, 212, 191, 0.1);
    }
    h1 { font-size: clamp(34px, 6vw, 52px); font-weight: 800; line-height: 1.15; margin-bottom: 18px; }
    h1 span { color: #2dd4bf; }
    p.sub { font-size: clamp(17px, 3vw, 21px); color: #99f6e4; line-height: 1.55; margin-bottom: 34px; }
    form { display: flex; flex-direction: column; gap: 12px; }
    input, textarea {
      width: 100%; border: none; border-radius: 16px;
      padding: 16px 18px; font-size: 17px; font-family: inherit;
      background: rgba(255,255,255,0.96); color: #134e4a;
    }
    textarea { resize: vertical; min-height: 84px; }
    input::placeholder, textarea::placeholder { color: #6b7f7d; }
    button {
      border: none; border-radius: 16px; padding: 18px;
      font-size: 19px; font-weight: 800; font-family: inherit;
      background: #2dd4bf; color: #134e4a; cursor: pointer;
      transition: transform 0.1s ease;
    }
    button:active { transform: scale(0.98); }
    .fine { margin-top: 22px; font-size: 14px; color: rgba(255,255,255,0.65); line-height: 1.5; }
    .ig { margin-top: 10px; font-size: 15px; }
    .ig a { color: #2dd4bf; text-decoration: none; font-weight: 700; }
  </style>
</head>
<body>
  <main class="card">
    <div class="dot" aria-hidden="true"></div>
    <h1>Every child has a voice.<br /><span>The world is about to hear it.</span></h1>
    <p class="sub">
      A new way for nonverbal and minimally-verbal children to be heard is coming —
      shaped by thousands of real family moments. No labels. No waitlists. No price tag.
    </p>
    <form action='/thanks' method='POST' name='waitlist'>
      <input type="hidden" name="form-name" value="waitlist" />
      <input type="email" name="email" required placeholder="Your email" />
      <textarea name="struggle" placeholder="Optional: what's the hardest part for your family right now?"></textarea>
      <button type="submit">Put my family first in line</button>
    </form>
    <p class="fine">No spam, ever. One email when it's your turn — that's it.</p>
  </main>
</body>
</html>
