# Netlify config for this monorepo.
# Each Sonics site deploys from its own folder. Swap `publish` (and the
# functions directory, where the site has functions) before deploying:
#
#   southwest-sonics-app      -> southwest-sonics-app.netlify.app  (the club app)
#   southwest-sonics-site     -> southwestsonics.netlify.app       (the website)
#   southwest-sonics-register -> sonics-register.netlify.app       (public rego form)
#   sonics-notes              -> sonics-notes.netlify.app          (private inbox + functions)
#   clutch-hq                 -> clutch-hq.netlify.app              (Clutch staff app)
#   clutch-app                -> clutch-basketball.netlify.app      (Clutch family app)
[build]
  publish = "southwest-sonics-app"
  command = ""

# Only read when the site being deployed has functions; harmless otherwise.
[functions]
  directory = "sonics-notes/netlify/functions"
